<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Byrdway Algebra Power Tool — Algebra + Honors</title>
<style>
:root{ --bg:#0f172a; --bg2:#111827; --card:#1e293b; --txt:#e2e8f0; --dim:#94a3b8; --accent:#fbbf24; --blue:#7dd3fc; --green:#4ade80; --red:#f87171; }
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
a{color:var(--blue);text-decoration:none}
h1,h2,h3,h4{font-family:'Segoe UI',Arial,sans-serif;color:#fff}
.cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at top,#1e293b,#0b1220 70%);padding:40px 20px}
.cover h1{font-size:3rem;letter-spacing:6px;margin:10px 0 0;color:var(--accent)}
.cover h2{font-size:1.6rem;letter-spacing:3px;margin:6px 0;color:#fff}
.cover .tagline{font-size:1.1rem;color:var(--blue);margin:4px 0}
.cover .promise{color:var(--dim);margin:10px 0}
.cover .author{margin-top:18px;font-size:1.05rem;color:#fff}
.cta{margin-top:28px;background:var(--accent);color:#111;border:none;padding:14px 28px;border-radius:30px;font-size:1rem;font-weight:700;cursor:pointer}
.cta:hover{filter:brightness(1.1)}
.topnav{position:sticky;top:0;z-index:50;background:#0b1220ee;backdrop-filter:blur(6px);display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #1e293b;flex-wrap:wrap;gap:8px}
.brand{font-weight:800;color:var(--accent);letter-spacing:1px}
.brand span{color:var(--dim);font-weight:400;margin-left:6px;font-size:0.85em}
.navlinks a{margin-left:14px;color:var(--dim);font-size:0.92rem}
.navlinks a.active,.navlinks a:hover{color:var(--accent)}
.page{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
.howpage{text-align:center}
.how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:24px 0}
.how-card{background:var(--card);border-radius:14px;padding:20px}
.how-ic{font-size:2rem}
.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px}
.tile{background:var(--card);border-radius:14px;padding:20px;text-align:center;transition:.15s;border:1px solid #1e293b}
.tile:hover{border-color:var(--accent);transform:translateY(-3px)}
.tile-num{color:var(--dim);font-size:0.8rem}
.tile-ic{margin:6px auto;width:40px;height:40px}
.tile-ic svg{width:100%;height:100%}
.tile-name{color:#fff;font-weight:600}
.needgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.needcard{background:var(--bg2);border-left:3px solid var(--blue);border-radius:8px;padding:12px 16px}
.area-tabbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;background:#0b1220;position:sticky;top:56px;z-index:40;border-bottom:1px solid #1e293b}
.area-tabbar a{padding:8px 14px;border-radius:20px;background:var(--card);color:var(--dim);font-size:0.9rem}
.area-tabbar a.on{background:var(--accent);color:#111;font-weight:700}
.pagebadge{font-size:0.7rem;background:var(--card);color:var(--dim);padding:3px 10px;border-radius:10px;vertical-align:middle;margin-left:10px}
.cs-page{background:#0b1220;border:1px solid #1e293b;border-radius:14px;padding:20px;margin:18px 0}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:10px}
.cc{background:var(--card);border-radius:12px;padding:14px}
.cc-formula{font-family:Consolas,monospace;color:var(--accent);font-weight:700;margin-bottom:6px}
.cc p{margin:4px 0;font-size:0.92rem}
.cc .trap{color:var(--red)}
.cc .inside{color:var(--green)}
.trap-card{border-left:3px solid var(--red)}
.painbox{background:#1a1023;border:1px solid #3b2545;border-radius:14px;padding:18px;margin-top:20px}
.painbox li{margin:6px 0;font-size:0.92rem}
.deng{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.deng-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;background:var(--bg2);border-radius:10px;padding:12px}
.deng-cell{font-size:0.85rem}
.deng-label{display:block;color:var(--accent);font-size:0.7rem;font-weight:700;letter-spacing:1px;margin-bottom:4px}
.stepflow{padding-left:0;list-style:none}
.stepflow li{background:var(--bg2);margin:8px 0;padding:10px 14px;border-radius:8px;display:flex;gap:10px;align-items:flex-start}
.stepnum{background:var(--blue);color:#111;border-radius:50%;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700}
.connlist li{margin:6px 0}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:16px}
.flashcard{perspective:1200px;height:420px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flashcard.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;overflow-y:auto}
.flip-back{transform:rotateY(180deg);background:#122032}
.fctype{align-self:flex-start;font-size:0.65rem;font-weight:700;color:#111;padding:3px 8px;border-radius:8px;margin-bottom:6px;flex-shrink:0}
.fc-text{font-size:0.92rem}
.fc-tap{font-size:0.7rem;color:var(--dim);text-align:right;margin-top:auto;padding-top:6px;flex-shrink:0}
.fc-diagram{margin-bottom:6px;flex-shrink:0;max-height:130px;overflow:hidden}
.fc-diagram svg{max-height:130px}
.hint{color:var(--dim);font-size:0.9rem}
.tier-section{margin-top:22px}
.testitem{background:var(--card);border-radius:12px;padding:16px;margin:10px 0}
.ti-diagram{margin:10px 0}
.reveal-btn{background:var(--blue);color:#111;border:none;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer}
.ti-a{margin-top:10px;background:var(--bg2);padding:10px;border-radius:8px}
.fixthis{margin-top:8px;font-size:0.85rem}
.interactive-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
.int-block{background:var(--card);border-radius:14px;padding:18px}
.linkcard{background:var(--bg2);border-radius:10px;padding:12px;margin:10px 0}
.linklabel{color:var(--accent);font-weight:700}
.linksub{font-size:0.8rem;color:var(--dim)}
.linknote{font-size:0.85rem;margin-top:4px}
.tutorprompt{background:var(--bg2);border-left:3px solid var(--green);padding:12px;border-radius:8px;font-style:italic;font-size:0.9rem}
.disclaimer{font-size:0.78rem;color:var(--dim);margin-top:10px}
@media (max-width:700px){ .interactive-grid{grid-template-columns:1fr} .deng-row{grid-template-columns:1fr 1fr} }

/* --- Algebra Power Tool surgical additions --- */
.deng-row5{grid-template-columns:1fr 1fr 1fr 1fr 1fr}
.link-actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.khan-action{background:var(--blue);color:#111;font-weight:700;padding:8px 16px;border-radius:20px;font-size:0.85rem;display:inline-block}
.khan-action.practice{background:var(--accent)}
.khan-action:hover{filter:brightness(1.1)}
@media (max-width:700px){ .deng-row5{grid-template-columns:1fr 1fr} }
.flip-inner:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:14px}
.tutor-actions{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.copy-prompt{background:var(--green);color:#111;border:none;font-weight:700;padding:8px 16px;border-radius:20px;cursor:pointer}.copy-status{font-size:.78rem;color:var(--green);margin-left:8px}.tutorprompt{user-select:text}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* BYRDWAY ALGEBRA POWER TOOL — data.js
   10 locked Algebra + Honors areas. Original Byrdway content, authored by
   byrdway-curriculum-architect specialist agents (one per area), matching
   the established Byrdway quality bar. */
const AREAS = [
  {
    "id": "solving-equations",
    "num": 1,
    "area": "Solving Equations & Inequalities",
    "painPoints": [
      "Flip-sign amnesia — forgetting to reverse the inequality symbol when multiplying or dividing both sides by a negative number.",
      "Distribution ghosting — distributing into only the first term inside parentheses, e.g., treating 3(x + 5) as 3x + 5 instead of 3x + 15.",
      "Negative-distribution leak — dropping or mishandling the sign when a negative is distributed across multiple terms, e.g., turning −(2x − 5) into −2x − 5 instead of −2x + 5.",
      "Variables-both-sides paralysis — freezing when the variable shows up on both sides, unsure which side to collect it on, especially when doing so would leave a negative coefficient.",
      "Fraction-equation freeze — trying to add or subtract fractions with unlike denominators mid-solve instead of clearing all denominators up front by multiplying every term by the LCD.",
      "Absolute value single-branch blindness — solving |x − 3| = 7 by writing only x − 3 = 7 and never generating the second case, x − 3 = −7.",
      "Absolute-value-can't-be-negative denial — forcing an answer out of an equation like |x + 2| = −3 instead of recognizing that an absolute value can never equal a negative number, so there is no solution.",
      "AND/OR inversion in compound and absolute value inequalities — writing an 'or' solution as one connected interval, or an 'and' solution as two disjoint rays.",
      "Literal-equation letter blindness — treating solving a formula (like A = ½bh) for a specific variable as a completely different skill from solving a numeric equation, instead of recognizing it as the identical inverse-operation procedure with other letters held constant.",
      "No-solution vs. all-real-numbers confusion — arriving at a false statement like 3 = 7 and calling it 'no x' when the real issue is deciding, correctly, between 'no solution' (false constant statement) and 'all real numbers' (true constant statement like 0 = 0)."
    ],
    "cheatSheet": {
      "page1": [
        {
          "formula": "ax + b = c  →  x = (c − b) / a",
          "note": "Undo operations in the reverse order of PEMDAS: strip the constant with addition/subtraction first, then strip the coefficient with multiplication/division last.",
          "trap": "Dividing before subtracting: solving 5x − 3 = 12 by dividing everything by 5 first produces the mangled x − 0.6 = 2.4 instead of the clean path to x = 3. Order matters.",
          "inside": "Think of the equation as an onion. The constant is the outer layer — peel it off first with addition or subtraction. The coefficient is the inner layer — peel it off last with multiplication or division."
        },
        {
          "formula": "a(bx + c) + d = e  →  distribute a across every term, then combine and isolate",
          "note": "Distribution isn't optional prep work — it is step one, before any combining or isolating happens.",
          "trap": "3(x + 5) = 3x + 5 is the single most common wrong move in this entire area — the 5 never got multiplied. Every term inside the parentheses gets hit by the outside factor.",
          "inside": "A negative sign directly in front of parentheses is itself a factor of −1 and distributes too: −(2x − 5) = −2x + 5, not −2x − 5. The sign flips on every term it touches, not just the first one."
        },
        {
          "formula": "ax + b = cx + d  →  (a − c)x = d − b",
          "note": "Move the smaller-coefficient variable term first so you don't end up isolating a negative x — not required, but it removes a sign headache.",
          "trap": "Subtracting the variable term from one side correctly, but leaving the constant term unmanaged on the wrong side, so the constants never actually get combined.",
          "inside": "This is a tug-of-war. Whichever side you pull every x-term toward, you must also settle every constant on the opposite side — nothing is allowed to stay behind unmoved."
        },
        {
          "formula": "Multiply every term on both sides by the LCD to clear all denominators before solving.",
          "note": "Clear fractions in one clean sweep at the very start — never try to add or subtract unlike fractions in the middle of a solve.",
          "trap": "Multiplying only the terms that are already fractions by the LCD, and forgetting that whole-number terms outside a fraction need that same LCD multiplied through them too.",
          "inside": "The LCD is a universal translator. It turns every term into a whole number in one move, so what's left behind looks exactly like the two-step equations you already have cold."
        },
        {
          "formula": "Solve A = ½bh for h  →  h = 2A / b",
          "note": "Every other letter in the equation is just a 'frozen' number — apply the identical inverse operations you would use if it actually were a number.",
          "trap": "Freezing up and treating a literal equation as an unfamiliar kind of math, instead of recognizing it as the same isolate-the-variable procedure with extra letters riding along for the trip.",
          "inside": "If you can solve 2 = ½(4)(h) for h, you can solve A = ½bh for h. The letters b and h simply haven't been assigned specific numbers yet — the moves are unchanged."
        }
      ],
      "page2": [
        {
          "formula": "ax + b > c  →  x > (c − b)/a   — reverse the symbol if you multiply/divide by a negative",
          "note": "Solve exactly like an equation until a negative multiplication or division forces the inequality to flip direction.",
          "trap": "Dividing −3x > 12 by −3 and writing x > −4 instead of the correct x < −4 — the single highest-frequency error in this entire unit.",
          "inside": "Picture the number line as a mirror. Multiplying or dividing by a negative flips your position across zero, so the direction your inequality arrow 'faces' has to flip too."
        },
        {
          "formula": "'And': a < bx + c < d, operate on all three parts together.  'Or': solve two separate inequalities and keep both solution sets.",
          "note": "'And' produces one connected interval; 'or' produces two separate rays that never touch each other.",
          "trap": "Graphing an 'or' solution as one connected shaded middle section (that's the 'and' picture), or graphing an 'and' solution as two disjoint rays.",
          "inside": "'And' means you're standing in the overlap of two rules — one shared region. 'Or' means either rule alone lets you in — two separate doors, and only one needs to be open."
        },
        {
          "formula": "|expr| = k  →  expr = k or expr = −k, only valid when k ≥ 0. If k < 0, no solution.",
          "note": "Isolate the absolute value completely before ever splitting into the two cases.",
          "trap": "Charging into x − 3 = −7 or x − 3 = 7 for the equation |x − 3| = −7 — absolute value can never equal a negative number, so this equation has no solution at all, and no case-splitting should even begin.",
          "inside": "Absolute value measures distance from zero, and distance is never negative. Before splitting into two cases, check whether k itself already tells you the answer is 'no solution.'"
        },
        {
          "formula": "|expr| < k  →  −k < expr < k (AND).   |expr| > k  →  expr < −k or expr > k (OR).",
          "note": "The direction of the inequality symbol tells you whether you're building an AND statement or an OR statement — memorize the pairing rather than re-deriving it each time.",
          "trap": "Writing |x| > 5 as −5 < x < 5 (that's the < rule) instead of the correct x < −5 or x > 5 — mixing up which symbol produces which structure.",
          "inside": "'Less thAND, greatOR.' Less-than absolute value inequalities are AND statements; greater-than absolute value inequalities are OR statements. Say it out loud until it's automatic."
        }
      ]
    },
    "blueprint": {
      "decisionEngine": [
        {
          "see": "A single variable term separated from a constant by at most one operation, e.g., 5x − 3 = 12",
          "identify": "One/two-step equation — the variable appears exactly once with no parentheses or fractions attached",
          "choose": "Undo operations in reverse PEMDAS order: addition/subtraction first, then multiplication/division",
          "execute": "5x − 3 = 12 → 5x = 15 → x = 3",
          "check": "Substitute back into the original: 5(3) − 3 = 15 − 3 = 12 ✓"
        },
        {
          "see": "Parentheses attached to a coefficient, e.g., 4(x − 2) + 3 = 19",
          "identify": "Multi-step equation requiring distribution before isolation",
          "choose": "Distribute across every term inside the parentheses, combine like terms, then solve as a two-step equation",
          "execute": "4x − 8 + 3 = 19 → 4x − 5 = 19 → 4x = 24 → x = 6",
          "check": "4(6 − 2) + 3 = 4(4) + 3 = 16 + 3 = 19 ✓"
        },
        {
          "see": "Variable terms on both sides of the equal sign, e.g., 7x + 3 = 2x + 18",
          "identify": "Variables-both-sides equation — variable terms must be consolidated onto one side first",
          "choose": "Subtract the smaller-coefficient variable term from both sides to avoid a negative leading coefficient",
          "execute": "7x + 3 = 2x + 18 → 5x + 3 = 18 → 5x = 15 → x = 3",
          "check": "7(3) + 3 = 24 and 2(3) + 18 = 24 — both sides match ✓"
        },
        {
          "see": "Fractions attached to the variable and/or constants, e.g., x/2 + 1/3 = 5/6",
          "identify": "Fraction equation — clearing denominators immediately avoids fraction arithmetic errors mid-solve",
          "choose": "Multiply every term on both sides by the LCD of all denominators present",
          "execute": "LCD = 6: 6(x/2) + 6(1/3) = 6(5/6) → 3x + 2 = 5 → 3x = 3 → x = 1",
          "check": "1/2 + 1/3 = 3/6 + 2/6 = 5/6 ✓"
        },
        {
          "see": "Multiple letters, with instructions to solve for one specific variable, e.g., solve A = ½bh for h",
          "identify": "Literal equation — treat every letter besides the target variable as a fixed constant",
          "choose": "Isolate the target variable using the exact same inverse operations you'd use with numeric coefficients",
          "execute": "A = ½bh → 2A = bh → h = 2A/b",
          "check": "Substitute back: A = ½ · b · (2A/b) = ½ · 2A = A ✓"
        },
        {
          "see": "An inequality symbol (<, >, ≤, ≥) attached to one variable, e.g., −4x + 9 ≤ 21",
          "identify": "Linear inequality — solved exactly like an equation until a negative multiply/divide is required",
          "choose": "Isolate the variable; reverse the inequality symbol only if you multiply or divide both sides by a negative number",
          "execute": "−4x + 9 ≤ 21 → −4x ≤ 12 → x ≥ −3 (symbol flipped)",
          "check": "Test the boundary x = −3: −4(−3) + 9 = 12 + 9 = 21 ≤ 21 ✓; test x = 0: 9 ≤ 21 ✓, consistent with x ≥ −3"
        },
        {
          "see": "Two inequality symbols joined by 'and'/'between' language, or by the word 'or,' e.g., −3 < 2x + 1 ≤ 9",
          "identify": "Compound inequality — decide whether it's a conjunction (one connected interval) or a disjunction (two separate rays)",
          "choose": "For 'and,' operate on all three parts simultaneously; for 'or,' solve each inequality separately and keep both solution sets",
          "execute": "−3 < 2x + 1 ≤ 9 → −4 < 2x ≤ 8 → −2 < x ≤ 4",
          "check": "Test x = 4: 2(4) + 1 = 9 ≤ 9 ✓; test x = −2 (excluded boundary): 2(−2) + 1 = −3, and −3 < −3 is false, so exclusion is correct"
        },
        {
          "see": "Absolute value bars around an expression, set equal to a number or compared with an inequality symbol, e.g., |2x − 5| = 7 or |2x − 5| < 7",
          "identify": "Absolute value problem — must split into two cases representing distance from zero; equations yield two solutions (or none), inequalities yield an AND (<) or OR (>) compound statement",
          "choose": "Isolate the absolute value first. For = k: write expr = k or expr = −k, only if k ≥ 0. For < k: write −k < expr < k. For > k: write expr < −k or expr > k",
          "execute": "|2x − 5| = 7 → 2x − 5 = 7 or 2x − 5 = −7 → x = 6 or x = −1",
          "check": "|2(6) − 5| = |7| = 7 ✓; |2(−1) − 5| = |−7| = 7 ✓"
        }
      ],
      "proofFlow": [
        "Read the statement first and note whether it's an equation (=) or an inequality (<, >, ≤, ≥) — this decision shapes every move that follows.",
        "Simplify each side independently before touching the equal/inequality sign: distribute, clear fractions or decimals, and combine like terms.",
        "Decide which side will hold the variable term (usually the side with the larger coefficient, to avoid a negative leading term).",
        "Use addition or subtraction to move terms across the equal/inequality sign, keeping track of the sign each term carries as it crosses.",
        "Use multiplication or division to isolate the variable's coefficient down to 1.",
        "If — and only if — you multiply or divide an inequality by a negative number, reverse the inequality symbol at that exact step.",
        "Write the solution in the form the problem requires: a single number, a single inequality, a compound inequality, 'no solution,' or 'all real numbers.'",
        "Check the solution by substituting it back into the ORIGINAL statement — not a simplified intermediate line — to catch arithmetic slips and sign errors.",
        "If a graph, number line, or interval notation is requested, represent the checked solution using open/closed circles or parentheses/brackets that match the strict vs. inclusive symbol."
      ],
      "connections": [
        "Every isolate-the-variable move here is the identical technique used to rearrange a linear equation into slope-intercept form (y = mx + b) and to solve for slope between two points — solving for y is solving an equation.",
        "Variables-on-both-sides equations are exactly what happens when two linear equations are set equal to find where a system of equations intersects — this area is the algebra engine inside every systems-of-equations solve by substitution.",
        "The two-branch case-splitting built here for absolute value equations (expr = k or expr = −k) is the exact skeleton of graphing absolute value functions y = |x| — each algebraic branch becomes one ray of the V-shaped graph later.",
        "Literal-equation isolation and 'no solution vs. all real numbers' reasoning are the same tools needed to find domain restrictions on rational and radical functions (setting a denominator equal to zero or a radicand ≥ 0 is just solving an equation or inequality for x), and this same isolate-for-one-variable move is what building an inverse function requires."
      ]
    },
    "flashcards": [
      {
        "type": "FORMULA",
        "front": "What is the general solving path for ax + b = c?",
        "back": "Subtract b from both sides to get ax = c − b, then divide both sides by a to get x = (c − b)/a. Undo addition/subtraction before multiplication/division."
      },
      {
        "type": "FORMULA",
        "front": "When solving an inequality, when must you flip the inequality symbol?",
        "back": "Only when you multiply or divide both sides by a negative number. Adding or subtracting any number — positive or negative — never flips the symbol."
      },
      {
        "type": "RECOGNITION",
        "front": "Look at 3(2x − 1) = 5x + 7. What type of equation is this, and what's the very first legal move?",
        "back": "Multi-step equation with distribution. First move: distribute the 3 across both terms inside the parentheses — 6x − 3 = 5x + 7 — before doing anything else."
      },
      {
        "type": "MINI_SOLVE",
        "front": "Solve: 2x/3 = 8",
        "back": "Multiply both sides by 3/2 (or multiply by 3 then divide by 2): 2x = 24 → x = 12. Check: 2(12)/3 = 24/3 = 8 ✓"
      },
      {
        "type": "MINI_SOLVE",
        "front": "Solve: |x − 4| = 9",
        "back": "x − 4 = 9 or x − 4 = −9 → x = 13 or x = −5. Check: |13 − 4| = 9 ✓ and |−5 − 4| = |−9| = 9 ✓"
      },
      {
        "type": "GRAPH",
        "front": "Graph the solution to x ≥ 3 on a number line.",
        "back": "Closed (filled) circle at 3, shading extending to the right toward positive infinity, since 3 itself is included by the ≥ symbol.",
        "diagram": "numberline:closed3,right"
      },
      {
        "type": "GRAPH",
        "front": "Graph the solution to −2 < x ≤ 5 on a number line.",
        "back": "Open circle at −2 (not included, strict <), closed circle at 5 (included, ≤), with shading connecting the two — one continuous interval because this is an 'and' compound inequality.",
        "diagram": "numberline:compound-and:open-2,closed5"
      },
      {
        "type": "ERROR_ANALYSIS",
        "front": "A student writes: 3(x + 5) = 3x + 5, then solves from there. What went wrong?",
        "back": "The distribution was incomplete — the 3 was applied to x but never to the 5. The correct distribution is 3(x + 5) = 3x + 15. Every term inside the parentheses must be multiplied by the outside factor."
      },
      {
        "type": "ERROR_ANALYSIS",
        "front": "A student solves −2x > 8 and writes x > −4. Is this correct? If not, fix it.",
        "back": "Incorrect — dividing both sides by −2 requires flipping the inequality symbol. The correct solution is x < −4. Check: x = −5 gives −2(−5) = 10 > 8 ✓, consistent with x < −4, not x > −4."
      },
      {

function svgWrap(inner, vb, h){
  h = h || 220;
  return '<svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:'+h+'px;background:#0b1220;border-radius:10px" role="img" aria-label="algebra diagram">'+inner+'</svg>';
}
const STROKE='#7dd3fc', ACCENT='#fbbf24', DIM='#64748b', GOOD='#4ade80', BAD='#f87171', TXT='#e2e8f0';

function parsePoints(payload){
  const re = /([A-Za-z']*)\(([-\d.]+),\s*([-\d.]+)\)/g;
  const pts = []; let m;
  while((m = re.exec(payload))){ pts.push({label:m[1], x:parseFloat(m[2]), y:parseFloat(m[3])}); }
  return pts;
}

function gridBase(range){
  const size=300, cx=150, cy=150;
  const scale = 130/range;
  const toX = x => cx + x*scale, toY = y => cy - y*scale;
  let s = '';
  const step = Math.max(1, Math.round(range/8));
  for(let i=-Math.floor(range); i<=Math.floor(range); i+=step){
    s += `<line x1="${toX(i)}" y1="${toY(-range)}" x2="${toX(i)}" y2="${toY(range)}" stroke="#1e293b" stroke-width="1"/>`;
    s += `<line x1="${toX(-range)}" y1="${toY(i)}" x2="${toX(range)}" y2="${toY(i)}" stroke="#1e293b" stroke-width="1"/>`;
  }
  s += `<line x1="${toX(-range)}" y1="${toY(0)}" x2="${toX(range)}" y2="${toY(0)}" stroke="${DIM}" stroke-width="1.5"/>`;
  s += `<line x1="${toX(0)}" y1="${toY(-range)}" x2="${toX(0)}" y2="${toY(range)}" stroke="${DIM}" stroke-width="1.5"/>`;
  return { s, toX, toY, size };
}

function lineAcross(g, m, b, range, color, style){
  const x1=-range, x2=range, y1=m*x1+b, y2=m*x2+b;
  const dash = style==='dashed' ? ' stroke-dasharray="6,4"' : '';
  return `<line x1="${g.toX(x1)}" y1="${g.toY(y1)}" x2="${g.toX(x2)}" y2="${g.toY(y2)}" stroke="${color}" stroke-width="2.5"${dash}/>`;
}

function shadeHalfPlane(g, m, b, dir, range, color, opacity){
  // dir: 'above' shades y > line, 'below' shades y < line, clipped to the visible grid square.
  const yL = m*-range+b, yR = m*range+b;
  let d;
  if(dir==='above'){
    d = `M ${g.toX(-range)} ${g.toY(yL)} L ${g.toX(-range)} ${g.toY(range)} L ${g.toX(range)} ${g.toY(range)} L ${g.toX(range)} ${g.toY(yR)} Z`;
  } else {
    d = `M ${g.toX(-range)} ${g.toY(yL)} L ${g.toX(-range)} ${g.toY(-range)} L ${g.toX(range)} ${g.toY(-range)} L ${g.toX(range)} ${g.toY(yR)} Z`;
  }
  return `<path d="${d}" fill="${color}" opacity="${opacity}" stroke="none"/>`;
}

function coordGrid(payload){
  if(payload.startsWith('line:')){
    const [m,b] = payload.slice(5).split(',').map(Number);
    const range = 10;
    const g = gridBase(range);
    let s = g.s;
    const x1=-range, x2=range, y1=m*x1+b, y2=m*x2+b;
    s += `<line x1="${g.toX(x1)}" y1="${g.toY(y1)}" x2="${g.toX(x2)}" y2="${g.toY(y2)}" stroke="${STROKE}" stroke-width="2.5"/>`;
    s += `<circle cx="${g.toX(0)}" cy="${g.toY(b)}" r="5" fill="${ACCENT}"/>`;
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  }
  if(payload.startsWith('vertical:')){
    const k = Number(payload.slice(9));
    const range=10; const g = gridBase(range);
    let s = g.s;
    s += `<line x1="${g.toX(k)}" y1="${g.toY(-range)}" x2="${g.toX(k)}" y2="${g.toY(range)}" stroke="${STROKE}" stroke-width="2.5"/>`;
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  }
  if(payload.startsWith('abs:')){
    const raw = payload.slice(4);
    const hMatch = raw.match(/h(-?\d+\.?\d*)/), kMatch = raw.match(/k(-?\d+\.?\d*)/), aMatch = raw.match(/a(-?\d+\.?\d*)/);
    const h = hMatch?parseFloat(hMatch[1]):0, k = kMatch?parseFloat(kMatch[1]):0, a = aMatch?parseFloat(aMatch[1]):1;
    const range=10; const g = gridBase(range);
    let s = g.s;
    const pathL = `M ${g.toX(h-range)} ${g.toY(a*range+k)} L ${g.toX(h)} ${g.toY(k)}`;
    const pathR = `M ${g.toX(h)} ${g.toY(k)} L ${g.toX(h+range)} ${g.toY(a*range+k)}`;
    s += `<path d="${pathL}" fill="none" stroke="${STROKE}" stroke-width="2.5"/>`;
    s += `<path d="${pathR}" fill="none" stroke="${STROKE}" stroke-width="2.5"/>`;
    s += `<circle cx="${g.toX(h)}" cy="${g.toY(k)}" r="5" fill="${ACCENT}"/>`;
    s += `<text x="${g.toX(h)+8}" y="${g.toY(k)-8}" fill="${TXT}" font-size="12" font-family="sans-serif">vertex (${h},${k})</text>`;
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  }
  if(payload.startsWith('systemineq')){
    // format: "systemineq:m1,b1,style1,dir1,m2,b2,style2,dir2"
    //   style: solid|dashed   dir: above|below (which side of the line is shaded)
    // bare "systemineq" (no args) falls back to a sensible default pair.
    let m1=1,b1=1,style1='solid',dir1='above', m2=0,b2=-2,style2='dashed',dir2='below';
    const body = payload.indexOf(':')===-1 ? '' : payload.slice(payload.indexOf(':')+1);
    if(body){
      const parts = body.split(',').map(x=>x.trim());
      if(parts.length>=8){
        m1=parseFloat(parts[0]); b1=parseFloat(parts[1]); style1=parts[2]; dir1=parts[3];
        m2=parseFloat(parts[4]); b2=parseFloat(parts[5]); style2=parts[6]; dir2=parts[7];
      }
    }
    const range=10; const g = gridBase(range);
    let s = g.s;
    s += shadeHalfPlane(g, m1, b1, dir1, range, STROKE, 0.16);
    s += shadeHalfPlane(g, m2, b2, dir2, range, ACCENT, 0.16);
    s += lineAcross(g, m1, b1, range, STROKE, style1);
    s += lineAcross(g, m2, b2, range, ACCENT, style2);
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  }
  if(payload.startsWith('boundary')){
    // format: "boundary:m,b,style,dir"  (single boundary line + shaded half-plane)
    // bare "boundary" (no args) falls back to a sensible default.
    let m=1,b=1,style='solid',dir='below';
    const body = payload.indexOf(':')===-1 ? '' : payload.slice(payload.indexOf(':')+1);
    if(body){
      const parts = body.split(',').map(x=>x.trim());
      if(parts.length>=4){
        m=parseFloat(parts[0]); b=parseFloat(parts[1]); style=parts[2]; dir=parts[3];
      }
    }
    const range=10; const g = gridBase(range);
    let s = g.s;
    s += shadeHalfPlane(g, m, b, dir, range, STROKE, 0.16);
    s += lineAcross(g, m, b, range, STROKE, style);
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  }
  if(payload==='system' || payload.startsWith('system:')){
    // format: "system:m1,b1,m2,b2" — draws both lines and the computed intersection point.
    // bare "system" (no args) falls back to the original default pair.
    let m1=1,b1=1,m2=-0.5,b2=4;
    if(payload.startsWith('system:')){
      const nums = payload.slice(7).split(',').map(Number);
      if(nums.length>=4 && nums.every(n=>!isNaN(n))){ [m1,b1,m2,b2] = nums; }
    }
    const range=10; const g = gridBase(range);
    let s = g.s;
    s += lineAcross(g, m1, b1, range, STROKE, 'solid');
    s += lineAcross(g, m2, b2, range, ACCENT, 'solid');
    if(m1!==m2){
      const ix = (b2-b1)/(m1-m2);
      const iy = m1*ix+b1;
      const ixR = Math.round(ix*100)/100, iyR = Math.round(iy*100)/100;
      s += `<circle cx="${g.toX(ix)}" cy="${g.toY(iy)}" r="6" fill="${GOOD}"/>`;
      s += `<text x="${g.toX(ix)+8}" y="${g.toY(iy)-8}" fill="${TXT}" font-size="12" font-family="sans-serif">solution (${ixR}, ${iyR})</text>`;
    } else {
      s += `<text x="10" y="20" fill="${b1===b2?GOOD:BAD}" font-size="12" font-family="sans-serif">${b1===b2?'infinitely many solutions (same line)':'no solution (parallel lines)'}</text>`;
    }
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  }
  // default: plot arbitrary points connected
  const pts = parsePoints(payload);
  let range = 10;
  pts.forEach(p=>{ range = Math.max(range, Math.abs(p.x)+2, Math.abs(p.y)+2); });
  const g = gridBase(range);
  let s = g.s;
  if(pts.length>1){
    let path = 'M '+g.toX(pts[0].x)+' '+g.toY(pts[0].y);
    for(let i=1;i<pts.length;i++) path += ' L '+g.toX(pts[i].x)+' '+g.toY(pts[i].y);
    s += `<path d="${path}" fill="none" stroke="${STROKE}" stroke-width="2"/>`;
  }
  pts.forEach(p=>{
    s += `<circle cx="${g.toX(p.x)}" cy="${g.toY(p.y)}" r="5" fill="${ACCENT}"/>`;
    s += `<text x="${g.toX(p.x)+8}" y="${g.toY(p.y)-8}" fill="${TXT}" font-size="13" font-family="sans-serif">${p.label}(${p.x},${p.y})</text>`;
  });
  return svgWrap(s, `0 0 ${g.size} ${g.size}`);
}

function numberlineDiagram(payload){
  // range auto-expands so every plotted boundary value lands cleanly on the drawn line
  const boundaryVals = [];
  const boundaryRe = /(open|closed)\s*(-?[\d.]+)/g;
  let bm;
  while((bm = boundaryRe.exec(payload))){ boundaryVals.push(parseFloat(bm[2])); }
  let range = 10;
  boundaryVals.forEach(v=>{ range = Math.max(range, Math.ceil(Math.abs(v))+2); });

  const w=320,h=100,cy=50, left=20,right=300;
  const toX = v => left + (v+range)*((right-left)/(2*range));
  let s = `<line x1="${left}" y1="${cy}" x2="${right}" y2="${cy}" stroke="${DIM}" stroke-width="2"/>`;
  const step = Math.max(1, Math.round(range/5));
  for(let i=-range;i<=range;i+=step){ s += `<line x1="${toX(i)}" y1="${cy-6}" x2="${toX(i)}" y2="${cy+6}" stroke="${DIM}" stroke-width="1"/><text x="${toX(i)}" y="${cy+22}" fill="${TXT}" font-size="10" text-anchor="middle" font-family="sans-serif">${i}</text>`; }

  function drawCircle(type, val){
    if(type==='closed') s += `<circle cx="${toX(val)}" cy="${cy}" r="7" fill="${ACCENT}"/>`;
    else s += `<circle cx="${toX(val)}" cy="${cy}" r="7" fill="#0b1220" stroke="${ACCENT}" stroke-width="2.5"/>`;
  }

  if(/^compound-and:/.test(payload) || /^compound-or:/.test(payload)){
    // format: "compound-and:open-2,closed5"  or  "compound-or:closed-3,open4"
    const isOr = payload.startsWith('compound-or:');
    const body = payload.slice(payload.indexOf(':')+1);
    const parts = body.split(',');
    const bounds = parts.map(p=>{
      const m = p.match(/(open|closed)(-?[\d.]+)/);
      return { type: m[1], val: parseFloat(m[2]) };
    }).sort((a,b)=>a.val-b.val);
    const [lo, hi] = bounds;
    if(isOr){
      s += `<line x1="${left}" y1="${cy}" x2="${toX(lo.val)}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
      s += `<line x1="${toX(hi.val)}" y1="${cy}" x2="${right}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
    } else {
      s += `<line x1="${toX(lo.val)}" y1="${cy}" x2="${toX(hi.val)}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
    }
    drawCircle(lo.type, lo.val);
    drawCircle(hi.type, hi.val);
  } else if(payload.includes('closed') || payload.includes('open')){
    // format: "closed3,right"  or  "open-4,left"
    const parts = payload.split(',');
    const m = parts[0].match(/(open|closed)(-?[\d.]+)/);
    const type = m ? m[1] : 'closed';
    const val = m ? parseFloat(m[2]) : 0;
    const dir = parts[1]||'right';
    if(dir==='right') s += `<line x1="${toX(val)}" y1="${cy}" x2="${right}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
    else s += `<line x1="${left}" y1="${cy}" x2="${toX(val)}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
    drawCircle(type, val);
  } else {
    s += `<circle cx="${toX(0)}" cy="${cy}" r="7" fill="${ACCENT}"/>`;
    s += `<line x1="${toX(0)}" y1="${cy}" x2="${right}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
  }
  return svgWrap(s, `0 0 ${w} ${h}`, 110);
}

function slopeTriangleDiagram(payload){
  const nums = (payload.match(/-?\d+\.?\d*/g)||[2,4,5,10]).map(Number);
  const [x1,y1,x2,y2] = nums;
  const range=12; const g = gridBase(range);
  let s = g.s;
  s += `<line x1="${g.toX(x1)}" y1="${g.toY(y1)}" x2="${g.toX(x2)}" y2="${g.toY(y2)}" stroke="${STROKE}" stroke-width="2.5"/>`;
  s += `<line x1="${g.toX(x1)}" y1="${g.toY(y1)}" x2="${g.toX(x2)}" y2="${g.toY(y1)}" stroke="${ACCENT}" stroke-width="2" stroke-dasharray="4,3"/>`;
  s += `<line x1="${g.toX(x2)}" y1="${g.toY(y1)}" x2="${g.toX(x2)}" y2="${g.toY(y2)}" stroke="${GOOD}" stroke-width="2" stroke-dasharray="4,3"/>`;
  s += `<circle cx="${g.toX(x1)}" cy="${g.toY(y1)}" r="5" fill="${ACCENT}"/>`;
  s += `<circle cx="${g.toX(x2)}" cy="${g.toY(y2)}" r="5" fill="${ACCENT}"/>`;
  s += `<text x="${(g.toX(x1)+g.toX(x2))/2}" y="${g.toY(y1)+16}" fill="${ACCENT}" font-size="11" font-family="sans-serif">run</text>`;
  s += `<text x="${g.toX(x2)+8}" y="${(g.toY(y1)+g.toY(y2))/2}" fill="${GOOD}" font-size="11" font-family="sans-serif">rise</text>`;
  return svgWrap(s, `0 0 ${g.size} ${g.size}`);
}

function expDiagram(payload){
  const decay = payload.includes('decay');
  const m = payload.match(/(?:decay|base)(-?\d+\.?\d*)/);
  const base = m ? parseFloat(m[1]) : (decay ? 0.5 : 2);
  const range=10; const g = gridBase(range);
  let s = g.s;
  let path='';
  for(let px=-range; px<=range; px+=0.5){
    const py = Math.min(range, Math.pow(base, px));
    const cmd = px===-range?'M':'L';
    path += `${cmd} ${g.toX(px)} ${g.toY(py)} `;
  }
  s += `<path d="${path}" fill="none" stroke="${STROKE}" stroke-width="2.5"/>`;
  s += `<circle cx="${g.toX(0)}" cy="${g.toY(1)}" r="5" fill="${ACCENT}"/>`;
  return svgWrap(s, `0 0 ${g.size} ${g.size}`);
}

function parabolaDiagram(payload){
  let h=0,k=0,a=1;
  if(payload.includes('vertex:')){
    const m = payload.match(/h(-?\d+\.?\d*),k(-?\d+\.?\d*),a(-?\d+\.?\d*)/);
    if(m){ h=parseFloat(m[1]); k=parseFloat(m[2]); a=parseFloat(m[3]); }
  } else if(payload.includes('widthcompare')){
    // format: "widthcompare:coefA,coefB" -> compares the two named |a| coefficients.
    // bare "widthcompare" (no args) falls back to the original default pair (3, 1/3).
    let coefs = [3,1/3];
    const wcBody = payload.indexOf(':')===-1 ? '' : payload.slice(payload.indexOf(':')+1);
    if(wcBody){
      const nums = wcBody.split(',').map(Number);
      if(nums.length>=2 && nums.every(n=>!isNaN(n))){ coefs = nums; }
    }
    const range=10; const g = gridBase(range);
    let s = g.s;
    coefs.forEach((coef,i)=>{
      let path='';
      for(let px=-range; px<=range; px+=0.4){ const py=coef*px*px; if(Math.abs(py)>range) continue; const cmd=path===''?'M':'L'; path+=`${cmd} ${g.toX(px)} ${g.toY(py)} `; }
      s += `<path d="${path}" fill="none" stroke="${i===0?ACCENT:STROKE}" stroke-width="2.5"/>`;
    });
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  } else if(payload.includes('discriminant-neg')){
    // format: "discriminant-neg:a,b,c" -> plots the REAL y=ax^2+bx+c whose
    // discriminant is negative (never crosses the x-axis).
    // bare "discriminant-neg" (no args) falls back to the original default curve.
    let da=0.3, db=0, dc=4;
    const dnBody = payload.indexOf(':')===-1 ? '' : payload.slice(payload.indexOf(':')+1);
    if(dnBody){
      const nums = dnBody.split(',').map(Number);
      if(nums.length>=3 && nums.every(n=>!isNaN(n))){ [da,db,dc] = nums; }
    }
    const vh = -db/(2*da), vk = da*vh*vh+db*vh+dc;
    const range = Math.max(10, Math.ceil(Math.abs(vh))+4, Math.ceil(Math.abs(vk))+4);
    const g = gridBase(range);
    let s = g.s; let path='';
    const dnStep = range/60;
    for(let px=-range; px<=range; px+=dnStep){ const py=da*px*px+db*px+dc; if(Math.abs(py)>range) continue; const cmd=path===''?'M':'L'; path+=`${cmd} ${g.toX(px)} ${g.toY(py)} `; }
    s += `<path d="${path}" fill="none" stroke="${BAD}" stroke-width="2.5"/>`;
    s += `<text x="30" y="270" fill="${BAD}" font-size="12" font-family="sans-serif">never crosses x-axis</text>`;
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  } else if(payload.includes('projectile')){
    // format: "projectile:a,v0,h0" -> plots the REAL h(t)=a*t^2+v0*t+h0
    // (feet, seconds) and marks the positive landing root (where h(t)=0).
    // bare "projectile" (no args) falls back to the original default curve.
    let pa=-16, pv0=48, ph0=4;
    const pjBody = payload.indexOf(':')===-1 ? '' : payload.slice(payload.indexOf(':')+1);
    if(pjBody){
      const nums = pjBody.split(',').map(Number);
      if(nums.length>=3 && nums.every(n=>!isNaN(n))){ [pa,pv0,ph0] = nums; }
    }
    // positive root of pa*t^2 + pv0*t + ph0 = 0 (the physically meaningful landing time)
    const disc = Math.max(0, pv0*pv0 - 4*pa*ph0);
    const sq = Math.sqrt(disc);
    const r1 = (-pv0+sq)/(2*pa), r2 = (-pv0-sq)/(2*pa);
    const tLand = Math.max(r1,r2) > 0 ? Math.max(r1,r2) : Math.min(r1,r2);
    const vt = -pv0/(2*pa);
    const maxHeight = Math.max(ph0, pa*vt*vt+pv0*vt+ph0);
    const xRange = (Math.max(tLand, vt)*1.15) || 5;
    const yRange = (maxHeight*1.15) || 10;
    const size=300, padL=42, padB=30, padT=20, padR=20;
    const toX = t => padL + (t/xRange)*(size-padL-padR);
    const toY = y => (size-padB) - (y/yRange)*(size-padB-padT);
    let s = `<line x1="${padL}" y1="${size-padB}" x2="${size-padR}" y2="${size-padB}" stroke="${DIM}" stroke-width="1.5"/>`;
    s += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${size-padB}" stroke="${DIM}" stroke-width="1.5"/>`;
    let path='';
    const pjStep = xRange/60;
    for(let t=0; t<=xRange; t+=pjStep){ const py=pa*t*t+pv0*t+ph0; const cmd=path===''?'M':'L'; path+=`${cmd} ${toX(t)} ${toY(Math.max(0,py))} `; }
    s += `<path d="${path}" fill="none" stroke="${STROKE}" stroke-width="2.5"/>`;
    s += `<circle cx="${toX(tLand)}" cy="${toY(0)}" r="5" fill="${GOOD}"/>`;
    s += `<text x="${toX(tLand)+8}" y="${toY(0)-8}" fill="${TXT}" font-size="12" font-family="sans-serif">lands t≈${Math.round(tLand*100)/100}s</text>`;
    s += `<text x="10" y="16" fill="${TXT}" font-size="11" font-family="sans-serif">h(t)=${pa}t²+${pv0}t+${ph0}</text>`;
    return svgWrap(s, `0 0 ${size} ${size}`);
  } else if(payload.includes('increasedecrease')){
    // payload like "increasedecrease:h,k" -> vertex (h,k) of an upward parabola y=(x-h)^2+k
    let vh=2, vk=-1;
    const vm = payload.match(/increasedecrease:(-?\d+\.?\d*),(-?\d+\.?\d*)/);
    if(vm){ vh=parseFloat(vm[1]); vk=parseFloat(vm[2]); }
    const range=10; const g = gridBase(range);
    let s = g.s;
    // decreasing branch (left of vertex) in BAD, increasing branch (right of vertex) in GOOD
    let pathDec=''; let pathInc='';
    for(let px=-range; px<=vh; px+=0.3){ const py=(px-vh)*(px-vh)+vk; if(Math.abs(py)>range) continue; const cmd=pathDec===''?'M':'L'; pathDec+=`${cmd} ${g.toX(px)} ${g.toY(py)} `; }
    for(let px=vh; px<=range; px+=0.3){ const py=(px-vh)*(px-vh)+vk; if(Math.abs(py)>range) continue; const cmd=pathInc===''?'M':'L'; pathInc+=`${cmd} ${g.toX(px)} ${g.toY(py)} `; }
    s += `<path d="${pathDec}" fill="none" stroke="${BAD}" stroke-width="2.5"/>`;
    s += `<path d="${pathInc}" fill="none" stroke="${GOOD}" stroke-width="2.5"/>`;
    s += `<circle cx="${g.toX(vh)}" cy="${g.toY(vk)}" r="5" fill="${ACCENT}"/>`;
    s += `<text x="${g.toX(vh)+8}" y="${g.toY(vk)-8}" fill="${TXT}" font-size="12" font-family="sans-serif">vertex (${vh},${vk})</text>`;
    s += `<text x="20" y="20" fill="${BAD}" font-size="11" font-family="sans-serif">decreasing</text>`;
    s += `<text x="${g.size-90}" y="20" fill="${GOOD}" font-size="11" font-family="sans-serif">increasing</text>`;
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  } else if(payload.includes('positive-negative')){
    // payload like "positive-negative:h,k" -> vertex (h,k) of an upward parabola y=(x-h)^2+k
    // optional third value: "positive-negative:h,k,a" -> sets the leading coefficient a
    // (a defaults to 1 / opens-upward when omitted, preserving prior behavior).
    let vh=2, vk=-1, va=1;
    const vm = payload.match(/positive-negative:(-?\d+\.?\d*),(-?\d+\.?\d*)(?:,(-?\d+\.?\d*))?/);
    if(vm){ vh=parseFloat(vm[1]); vk=parseFloat(vm[2]); if(vm[3]!==undefined) va=parseFloat(vm[3]); }
    const range=10; const g = gridBase(range);
    let s = g.s; let path='';
    for(let px=-range; px<=range; px+=0.3){ const py=va*(px-vh)*(px-vh)+vk; if(Math.abs(py)>range) continue; const cmd=path===''?'M':'L'; path+=`${cmd} ${g.toX(px)} ${g.toY(py)} `; }
    s += `<path d="${path}" fill="none" stroke="${STROKE}" stroke-width="2"/>`;
    // Two real roots exist when the vertex sits on the opposite side of the x-axis
    // from the direction the parabola opens (va and vk have opposite signs).
    // Between the roots, y has the same sign as vk (the vertex's extreme value);
    // outside the roots, y has the opposite sign.
    const rootsExist = (va>0 && vk<0) || (va<0 && vk>0);
    if(rootsExist){
      const halfWidth = Math.sqrt(-vk/va);
      const rootL = vh-halfWidth, rootR = vh+halfWidth;
      let midPath = `M ${g.toX(rootL)} ${g.toY(0)} `;
      for(let px=rootL; px<=rootR; px+=0.2){ const py=va*(px-vh)*(px-vh)+vk; midPath += `L ${g.toX(px)} ${g.toY(py)} `; }
      midPath += `L ${g.toX(rootR)} ${g.toY(0)} Z`;
      const insideColor = vk<0 ? BAD : GOOD;
      const outsideColor = vk<0 ? GOOD : BAD;
      const insideLabel = vk<0 ? 'negative' : 'positive';
      const outsideLabel = vk<0 ? 'positive' : 'negative';
      s += `<path d="${midPath}" fill="${insideColor}" opacity="0.25" stroke="none"/>`;
      s += `<circle cx="${g.toX(rootL)}" cy="${g.toY(0)}" r="4" fill="${ACCENT}"/>`;
      s += `<circle cx="${g.toX(rootR)}" cy="${g.toY(0)}" r="4" fill="${ACCENT}"/>`;
      s += `<text x="${g.toX(vh)-14}" y="${g.toY(vk)-8}" fill="${insideColor}" font-size="11" font-family="sans-serif">${insideLabel}</text>`;
      s += `<text x="20" y="20" fill="${outsideColor}" font-size="11" font-family="sans-serif">${outsideLabel}</text>`;
      s += `<text x="${g.size-90}" y="20" fill="${outsideColor}" font-size="11" font-family="sans-serif">${outsideLabel}</text>`;
    }
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  }
  const range=10; const g = gridBase(range);
  let s = g.s; let path='';
  for(let px=-range; px<=range; px+=0.4){
    const py = a*(px-h)*(px-h)+k;
    if(Math.abs(py)>range) continue;
    const cmd = path===''?'M':'L';
    path += `${cmd} ${g.toX(px)} ${g.toY(py)} `;
  }
  s += `<path d="${path}" fill="none" stroke="${STROKE}" stroke-width="2.5"/>`;
  s += `<circle cx="${g.toX(h)}" cy="${g.toY(k)}" r="5" fill="${ACCENT}"/>`;
  s += `<text x="${g.toX(h)+8}" y="${g.toY(k)-8}" fill="${TXT}" font-size="12" font-family="sans-serif">vertex (${h},${k})</text>`;
  return svgWrap(s, `0 0 ${g.size} ${g.size}`);
}

function scatterDiagram(payload){
  const strong = payload.includes('strong');
  const positive = !payload.includes('negative');
  const size=300, pad=30;
  let s = `<line x1="${pad}" y1="${size-pad}" x2="${size-pad}" y2="${size-pad}" stroke="${DIM}" stroke-width="1.5"/>`;
  s += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${size-pad}" stroke="${DIM}" stroke-width="1.5"/>`;
  const offsets = strong ? [-7,5,-4,8,-6,3,0,6,-5,7,-3,4,-8,2] : [-30,22,-18,34,-26,12,4,28,-20,31,-10,18,-35,8];
  for(let i=0;i<14;i++){
    const x = pad + (i+0.7)*((size-2*pad)/14);
    const noise = offsets[i];
    const y = positive ? (size-pad) - ((x-pad)*0.8 + noise + 20) : pad + ((x-pad)*0.8 + noise + 20);
    s += `<circle cx="${x}" cy="${Math.max(pad,Math.min(size-pad,y))}" r="4" fill="${ACCENT}"/>`;
  }
  return svgWrap(s, `0 0 ${size} ${size}`);
}

// areaModelDiagram: draws a REAL 2x2 area-model rectangle for a binomial
// product (a+b)(c+d), with each region labeled by its actual area (x^2, 4x,
// 2x, 8, ...) and each side labeled with its actual term (x, 4 / x, 2), plus
// a caption showing the combined total (e.g. x^2+6x+8).
//
// Standardized payload format: "areamodel:a,b,c,d" meaning (a+b)(c+d), where
// each of a/b/c/d is a bare term like "x", "-x", "3x", "4", or "-4".
//   Example: "areamodel:x,4,x,2"  -> (x+4)(x+2)
// Legacy format "areamodel:(x+4)(x+2)" (parenthesized binomials) is also
// still accepted and parsed into the same four terms.
function parseAreaTerm(raw){
  const t = String(raw).trim().replace(/\s+/g,'');
  if(t==='x') return {coef:1, isX:true};
  if(t==='-x') return {coef:-1, isX:true};
  const mx = t.match(/^(-?\d*)x$/);
  if(mx){
    let c = mx[1];
    if(c===''||c==='+') c=1; else if(c==='-') c=-1; else c=parseFloat(c);
    return {coef:c, isX:true};
  }
  const n = parseFloat(t);
  return {coef: isNaN(n)?0:n, isX:false};
}
function areaTermLabel(p){
  if(p.isX){
    if(p.coef===1) return 'x';
    if(p.coef===-1) return '-x';
    return p.coef+'x';
  }
  return String(p.coef);
}
function areaCellLabel(pa,pb){
  const coef = pa.coef*pb.coef;
  const deg = (pa.isX?1:0)+(pb.isX?1:0);
  const suffix = deg===2 ? 'x²' : deg===1 ? 'x' : '';
  let coefStr;
  if(suffix){
    coefStr = coef===1?'':coef===-1?'-':String(coef);
  } else {
    coefStr = String(coef);
  }
  return { coef, deg, label: coefStr+suffix };
}
function splitBinomialText(s){
  s = s.replace(/\s+/g,'');
  const m = s.match(/^(-?[^+-]+)([+-].+)$/);
  if(!m) return [s, '0'];
  let first = m[1], second = m[2];
  if(second[0]==='+') second = second.slice(1);
  return [first, second];
}
function areaModelDiagram(payload){
  let terms = null;
  const legacy = payload.match(/^\(([^)]+)\)\(([^)]+)\)$/);
  if(legacy){
    terms = [...splitBinomialText(legacy[1]), ...splitBinomialText(legacy[2])];
  } else {
    const parts = payload.split(',').map(x=>x.trim()).filter(Boolean);
    if(parts.length>=4) terms = parts.slice(0,4);
  }
  if(!terms) terms = ['x','4','x','2']; // safe fallback: (x+4)(x+2)

  const rowTerms = [parseAreaTerm(terms[0]), parseAreaTerm(terms[1])]; // first factor -> rows
  const colTerms = [parseAreaTerm(terms[2]), parseAreaTerm(terms[3])]; // second factor -> columns

  const sizeFor = p => p.isX ? 110 : Math.max(30, Math.min(90, Math.abs(p.coef)*14+24));
  const colWidths = colTerms.map(sizeFor);
  const rowHeights = rowTerms.map(sizeFor);

  const x0 = 70, y0 = 46;
  const colX = [x0, x0+colWidths[0]];
  const rowY = [y0, y0+rowHeights[0]];
  const gridW = colWidths[0]+colWidths[1];
  const gridH = rowHeights[0]+rowHeights[1];

  const cells = [];
  for(let r=0;r<2;r++){
    for(let c=0;c<2;c++){
      cells.push({ r, c, cell: areaCellLabel(rowTerms[r], colTerms[c]) });
    }
  }

  const cellColors = [STROKE, ACCENT, ACCENT, GOOD];
  let s = '';
  // outer border
  s += `<rect x="${x0}" y="${y0}" width="${gridW}" height="${gridH}" fill="none" stroke="${TXT}" stroke-width="1"/>`;
  cells.forEach(({r,c,cell}, i)=>{
    const cx = colX[c], cy = rowY[r];
    const cw = colWidths[c], ch = rowHeights[r];
    s += `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="${cellColors[i]}" opacity="0.16" stroke="${cellColors[i]}" stroke-width="1.5"/>`;
    s += `<text x="${cx+cw/2}" y="${cy+ch/2+5}" fill="${TXT}" font-size="15" text-anchor="middle" font-family="sans-serif">${cell.label}</text>`;
  });

  // column (top) labels — terms of the second factor
  colTerms.forEach((p,c)=>{
    s += `<text x="${colX[c]+colWidths[c]/2}" y="${y0-10}" fill="${ACCENT}" font-size="14" text-anchor="middle" font-family="sans-serif">${areaTermLabel(p)}</text>`;
  });
  // row (left) labels — terms of the first factor
  rowTerms.forEach((p,r)=>{
    s += `<text x="${x0-14}" y="${rowY[r]+rowHeights[r]/2+5}" fill="${ACCENT}" font-size="14" text-anchor="end" font-family="sans-serif">${areaTermLabel(p)}</text>`;
  });

  // factor expressions along the outer edges
  const factor1 = `${areaTermLabel(rowTerms[0])}${rowTerms[1].coef<0?'':'+'}${areaTermLabel(rowTerms[1])}`;
  const factor2 = `${areaTermLabel(colTerms[0])}${colTerms[1].coef<0?'':'+'}${areaTermLabel(colTerms[1])}`;
  s += `<text x="${x0+gridW/2}" y="18" fill="${TXT}" font-size="13" text-anchor="middle" font-family="sans-serif">(${factor2})</text>`;
  s += `<text x="16" y="${y0+gridH/2+5}" fill="${TXT}" font-size="13" text-anchor="middle" font-family="sans-serif" transform="rotate(-90 16 ${y0+gridH/2+5})">(${factor1})</text>`;

  // combine like-degree terms into the total polynomial caption
  const totals = {2:0, 1:0, 0:0};
  cells.forEach(({cell})=>{ totals[cell.deg] += cell.coef; });
  let expr = '';
  [2,1,0].forEach(deg=>{
    const coef = totals[deg];
    if(coef===0 && !(deg===0 && expr==='')) return;
    const suffix = deg===2?'x²':deg===1?'x':'';
    let piece;
    if(suffix){
      const mag = Math.abs(coef);
      piece = (mag===1?'':String(mag))+suffix;
    } else {
      piece = String(Math.abs(coef));
    }
    if(expr===''){
      expr = (coef<0?'-':'')+piece;
    } else {
      expr += (coef<0?' - ':' + ')+piece;
    }
  });
  if(expr==='') expr='0';

  const h = y0+gridH+56;
  s += `<text x="${x0+gridW/2}" y="${y0+gridH+30}" fill="${GOOD}" font-size="14" text-anchor="middle" font-family="sans-serif">Total area = ${expr}</text>`;
  return svgWrap(s, `0 0 ${x0+gridW+40} ${h}`, 220);
}

// twoWayTableDiagram: renders a REAL two-way frequency table with actual
// row/column labels, cell counts, and computed row/column/grand totals.
//
// Payload format (semicolon-separated fields, order doesn't matter):
//   "rows=RowLabel1,RowLabel2;cols=ColLabel1,ColLabel2;data=r1c1,r1c2,r2c1,r2c2"
// - rows: comma-separated row category labels
// - cols: comma-separated column category labels
// - data: comma-separated cell counts in row-major order
//         (row1col1, row1col2, ..., row2col1, row2col2, ...)
// Example: "twowaytable:rows=Freshmen,Sophomores;cols=Job,No Job;data=18,62,32,38"
function twoWayTableDiagram(payload){
  const w=340, h=220;

  const fields = {};
  payload.split(';').forEach(part=>{
    const eq = part.indexOf('=');
    if(eq===-1) return;
    fields[part.slice(0,eq).trim()] = part.slice(eq+1).trim();
  });

  const rows = fields.rows ? fields.rows.split(',').map(x=>x.trim()) : ['Row 1','Row 2'];
  const cols = fields.cols ? fields.cols.split(',').map(x=>x.trim()) : ['Col 1','Col 2'];
  const nums = fields.data ? fields.data.split(',').map(x=>parseFloat(x.trim())) : [0,0,0,0];

  const nRows = rows.length, nCols = cols.length;
  // Build the data grid (nRows x nCols) from the flat row-major list.
  const grid = [];
  for(let r=0;r<nRows;r++){
    const row = [];
    for(let c=0;c<nCols;c++) row.push(nums[r*nCols+c] || 0);
    grid.push(row);
  }
  const rowTotals = grid.map(row => row.reduce((a,b)=>a+b,0));
  const colTotals = cols.map((_,c) => grid.reduce((sum,row)=>sum+row[c],0));
  const grandTotal = rowTotals.reduce((a,b)=>a+b,0);

  // Layout: label column + one column per category + totals column,
  // and header row + one row per category + totals row.
  const labelColW = 100, totalColW = 70;
  const dataColW = (w-20-labelColW-totalColW)/nCols;
  const headerRowH = 30, dataRowH = 34, totalRowH = 34;
  const x0 = 10, y0 = 10;
  const colX = i => x0 + labelColW + i*dataColW;
  const totalX = x0 + labelColW + nCols*dataColW;
  const rowY = i => y0 + headerRowH + i*dataRowH;
  const totalRowY = y0 + headerRowH + nRows*dataRowH;
  const tableW = labelColW + nCols*dataColW + totalColW;
  const tableH = headerRowH + nRows*dataRowH + totalRowH;

  let s = '';
  s += `<rect x="${x0}" y="${y0}" width="${tableW}" height="${tableH}" fill="none" stroke="${DIM}" stroke-width="1.5"/>`;
  // vertical lines
  s += `<line x1="${x0+labelColW}" y1="${y0}" x2="${x0+labelColW}" y2="${y0+tableH}" stroke="${DIM}" stroke-width="1"/>`;
  for(let c=1;c<nCols;c++) s += `<line x1="${colX(c)}" y1="${y0}" x2="${colX(c)}" y2="${y0+tableH}" stroke="${DIM}" stroke-width="1"/>`;
  s += `<line x1="${totalX}" y1="${y0}" x2="${totalX}" y2="${y0+tableH}" stroke="${DIM}" stroke-width="1"/>`;
  // horizontal lines
  s += `<line x1="${x0}" y1="${y0+headerRowH}" x2="${x0+tableW}" y2="${y0+headerRowH}" stroke="${DIM}" stroke-width="1"/>`;
  for(let r=1;r<nRows;r++) s += `<line x1="${x0}" y1="${rowY(r)}" x2="${x0+tableW}" y2="${rowY(r)}" stroke="${DIM}" stroke-width="1"/>`;
  s += `<line x1="${x0}" y1="${totalRowY}" x2="${x0+tableW}" y2="${totalRowY}" stroke="${DIM}" stroke-width="1"/>`;

  // header labels
  cols.forEach((label,c)=>{
    s += `<text x="${colX(c)+dataColW/2}" y="${y0+headerRowH/2+4}" fill="${ACCENT}" font-size="11" text-anchor="middle" font-family="sans-serif">${label}</text>`;
  });
  s += `<text x="${totalX+totalColW/2}" y="${y0+headerRowH/2+4}" fill="${ACCENT}" font-size="11" text-anchor="middle" font-family="sans-serif">Total</text>`;

  // row labels + cell values
  rows.forEach((label,r)=>{
    s += `<text x="${x0+8}" y="${rowY(r)+dataRowH/2+4}" fill="${ACCENT}" font-size="11" font-family="sans-serif">${label}</text>`;
    grid[r].forEach((val,c)=>{
      s += `<text x="${colX(c)+dataColW/2}" y="${rowY(r)+dataRowH/2+4}" fill="${TXT}" font-size="13" text-anchor="middle" font-family="sans-serif">${val}</text>`;
    });
    s += `<text x="${totalX+totalColW/2}" y="${rowY(r)+dataRowH/2+4}" fill="${GOOD}" font-size="13" text-anchor="middle" font-family="sans-serif">${rowTotals[r]}</text>`;
  });

  // column totals row + grand total
  s += `<text x="${x0+8}" y="${totalRowY+totalRowH/2+4}" fill="${ACCENT}" font-size="11" font-family="sans-serif">Total</text>`;
  colTotals.forEach((val,c)=>{
    s += `<text x="${colX(c)+dataColW/2}" y="${totalRowY+totalRowH/2+4}" fill="${GOOD}" font-size="13" text-anchor="middle" font-family="sans-serif">${val}</text>`;
  });
  s += `<text x="${totalX+totalColW/2}" y="${totalRowY+totalRowH/2+4}" fill="${ACCENT}" font-size="13" text-anchor="middle" font-family="sans-serif">${grandTotal}</text>`;

  return svgWrap(s, `0 0 ${w} ${h}`, 190);
}

function fallbackDiagram(code){
  return svgWrap(`<text x="150" y="150" fill="${TXT}" font-size="14" text-anchor="middle" font-family="sans-serif">${code}</text>`, `0 0 300 300`);

function renderDiagram(code){
  if(!code) return '';
  const idx = code.indexOf(':');
  const prefix = idx===-1?code:code.slice(0,idx);
  const payload = idx===-1?'':code.slice(idx+1);
  try{
    if(prefix==='coordgrid') return coordGrid(payload);
    if(prefix==='numberline') return numberlineDiagram(payload);
    if(prefix==='slopetriangle') return slopeTriangleDiagram(payload);
    if(prefix==='expgrowth') return expDiagram(payload);
    if(prefix==='parabola') return parabolaDiagram(payload);
    if(prefix==='scatter') return scatterDiagram(payload);
    if(prefix==='areamodel') return areaModelDiagram(payload);
    if(prefix==='twowaytable') return twoWayTableDiagram(payload);
    return fallbackDiagram(code);
  }catch(e){
    return fallbackDiagram(code);
  }
}

      <div class="needcard"><b>I have a test / need it fast</b><p>→ Cheat Sheet</p></div>
      <div class="needcard"><b>I don't get it</b><p>→ Blueprint</p></div>
      <div class="needcard"><b>I need to remember it</b><p>→ Flashcards</p></div>
      <div class="needcard"><b>Show me</b><p>→ Learn It (in each area)</p></div>
      <div class="needcard"><b>I need practice</b><p>→ Practice It (in each area)</p></div>
      <div class="needcard"><b>Help me think</b><p>→ Tutor Me with Khanmigo (where eligible)</p></div>
      <div class="needcard"><b>Am I ready?</b><p>→ Test Me</p></div>
      <div class="needcard"><b>Push me further</b><p>→ Honors Layer</p></div>
    </div>
  </div>`;
}

function cheatCard(c){
  return `<div class="cc">
    <div class="cc-formula">${esc(c.formula)}</div>
    ${c.note?`<p>${esc(c.note)}</p>`:''}
    ${c.trap?`<p class="trap"><b>Don't:</b> ${esc(c.trap)}</p>`:''}
    ${c.inside?`<p class="inside"><b>Inside Fact:</b> ${esc(c.inside)}</p>`:''}
  </div>`;
}

function renderCheatSheet(a){
  return `<div class="page">
  <h2>${a.area} — Cheat Sheet <span class="pagebadge">2 pages</span></h2>
  <div class="cs-page"><h3>Page 1 — Core Toolkit</h3><div class="cc-grid">${a.cheatSheet.page1.map(cheatCard).join('')}</div></div>
  <div class="cs-page"><h3>Page 2 — Deeper Facts &amp; Traps</h3><div class="cc-grid">${a.cheatSheet.page2.map(cheatCard).join('')}</div></div>
  ${painPointsBox(a)}
  ${commonErrorsBox(a)}
  </div>`;
}

function painPointsBox(a){
  return `<div class="painbox"><h3>Where students get stuck (and how this area fixes it)</h3>
  <ul>${a.painPoints.slice(0,6).map(p=>'<li>'+esc(p)+'</li>').join('')}</ul></div>`;
}

function commonErrorsBox(a){
  return `<div class="painbox" style="border-color:#3b1d1d;background:#1a1010">
  <h3>Common Errors To Watch For</h3>
  <ul>${a.commonErrors.map(e=>'<li>'+esc(e)+'</li>').join('')}</ul></div>`;
}

function renderBlueprint(a){
  const rows = a.blueprint.decisionEngine.map(r=>`<div class="deng-row deng-row5">
    <div class="deng-cell"><span class="deng-label">SEE</span>${esc(r.see)}</div>
    <div class="deng-cell"><span class="deng-label">IDENTIFY</span>${esc(r.identify)}</div>
    <div class="deng-cell"><span class="deng-label">CHOOSE</span>${esc(r.choose)}</div>
    <div class="deng-cell"><span class="deng-label">EXECUTE</span>${esc(r.execute)}</div>
    <div class="deng-cell"><span class="deng-label">CHECK</span>${esc(r.check)}</div>
  </div>`).join('');
  const steps = a.blueprint.proofFlow.map((s,i)=>`<li><span class="stepnum">${i+1}</span>${esc(s)}</li>`).join('');
  const conns = a.blueprint.connections.map(c=>'<li>'+esc(c)+'</li>').join('');
  return `<div class="page">
  <h2>${a.area} — Blueprint <span class="pagebadge">2 pages</span></h2>
  <div class="cs-page"><h3>Page 1 — Decision Engine: What tool do I use?</h3><div class="deng">${rows}</div></div>
  <div class="cs-page"><h3>Page 2 — Worked Pathway &amp; Connections</h3>
    <h4>Step-by-step pathway</h4><ol class="stepflow">${steps}</ol>
    <h4>You Already Know This — connections forward</h4><ul class="connlist">${conns}</ul>
  </div>
  </div>`;
}

const typeColors = {FORMULA:'#4ade80', RECOGNITION:'#7dd3fc', MINI_SOLVE:'#c084fc', GRAPH:'#38bdf8', ERROR_ANALYSIS:'#f87171', TRUE_OR_TRAP:'#fb923c', CONNECTION:'#22d3ee', HONORS:'#fb7185'};

function renderFlashcards(a){
  const cards = a.flashcards.map((c,i)=>`
    <div class="flashcard" id="fc-${i}">
      <div class="flip-inner" tabindex="0" role="button" aria-pressed="false" aria-label="Flashcard, tap or press Enter to flip" onclick="flipCard(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard(this);}">
        <div class="flip-front">
          <span class="fctype" style="background:${typeColors[c.type]||'#999'}">${c.type.replace(/_/g,' ')}</span>
          <div class="fc-diagram">${c.diagram?renderDiagram(c.diagram):''}</div>
          <p class="fc-text">${esc(c.front)}</p>
          <div class="fc-tap">tap to flip ↻</div>
        </div>
        <div class="flip-back">
          <span class="fctype" style="background:${typeColors[c.type]||'#999'}">ANSWER</span>
          <p class="fc-text">${esc(c.back)}</p>
          <div class="fc-tap">tap to flip back ↻</div>
        </div>
      </div>
    </div>`).join('');
  return `<div class="page">
  <h2>${a.area} — Flashcards <span class="pagebadge">${a.flashcards.length} cards</span></h2>
  <p class="hint">Tap any card to reveal the answer. Card types are color-coded: FORMULA, RECOGNITION, MINI SOLVE, GRAPH, ERROR ANALYSIS, TRUE OR TRAP, CONNECTION, HONORS.</p>
  <div class="fc-grid">${cards}</div>
  </div>`;
}

function testItem(item, tier, idx, areaId){
  const uid = `${areaId}-${tier}-${idx}`;
  return `<div class="testitem" id="ti-${uid}">
    <div class="ti-q"><b>Q${idx+1}.</b> ${esc(item.q)}</div>
    ${item.diagram?`<div class="ti-diagram">${renderDiagram(item.diagram)}</div>`:''}
    <button class="reveal-btn" onclick="revealAnswer('${uid}')">Reveal Answer</button>
    <div class="ti-a" id="ta-${uid}" style="display:none"><b>Answer:</b> ${esc(item.a)}
      ${item.explain?`<p style="margin-top:6px"><b>Why:</b> ${esc(item.explain)}</p>`:''}
      <div class="fixthis">Missed it? <a href="#/area/${areaId}/blueprint">FIX THIS → Back to Blueprint</a></div>
    </div>
  </div>`;
}

function renderTestMe(a){
  const tiers = ['foundation','proficient','advanced','honors'];
  const tierLabels = {foundation:'FOUNDATION',proficient:'PROFICIENT',advanced:'ADVANCED',honors:'HONORS'};
  const sections = tiers.map(t => `<div class="tier-section">
    <h3>${tierLabels[t]}</h3>
    ${a.testMe[t].map((item,i)=>testItem(item,t,i,a.id)).join('')}
  </div>`).join('');
  return `<div class="page">
  <h2>${a.area} — Test Me</h2>
  <p class="hint">Work each tier, then reveal to check. Every answer includes a "Why" explanation, not just the final number. Missed one? Use FIX THIS to jump straight back to the exact Blueprint concept.</p>
  ${sections}
  </div>`;
}

function renderHonorsLayer(a){
  const items = a.honorsLayer.items.map((h,i)=>{
    const uid = `${a.id}-honors-${i}`;
    return `<div class="testitem">
      <div class="ti-q"><b>Honors Prompt ${i+1}.</b> ${esc(h.prompt)}</div>
      <button class="reveal-btn" onclick="revealAnswer('${uid}')">Reveal Response</button>
      <div class="ti-a" id="ta-${uid}" style="display:none">${esc(h.response)}</div>
    </div>`;
  }).join('');
  return `<div class="page">
  <h2>${a.area} — Honors Layer <span class="pagebadge">Why · What-If · Prove · Generalize · Defend</span></h2>
  <div class="cs-page"><h3>Honors Framework</h3><p>${esc(a.honorsLayer.framework)}</p></div>
  <div class="cs-page"><h3>Honors Prompts</h3>${items}</div>
  </div>`;
}

function flipCard(inner){
  const card = inner.parentElement;
  card.classList.toggle('flipped');
  inner.setAttribute('aria-pressed', card.classList.contains('flipped') ? 'true' : 'false');
}

function revealAnswer(uid){
  const el = document.getElementById('ta-'+uid);
  if(el) el.style.display = el.style.display==='none' ? 'block' : 'none';
}

function copyTutorPrompt(areaId, btn){
  const a = AREAS.find(x => x.id === areaId);
  if(!a) return;
  const text = a.khanmigoPrompt;
  const status = btn ? btn.nextElementSibling : null;
  const done = () => { if(status){ status.textContent='COPIED'; setTimeout(()=>status.textContent='',1800); } };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ if(document.execCommand('copy')) done(); }catch(e){}
  document.body.removeChild(ta);
}

function renderInteractive(a){
  const dest = KHAN_AREA_DESTINATIONS[a.id];
  const linkBlock = dest ? `<div class="linkcard">
      <div class="linklabel">${esc(a.khanResources[0]?.label||'Learn & Practice')}</div>
      <div class="linksub">${esc(a.khanResources[0]?.topic||'')}</div>
      <div class="link-actions">
        <a class="khan-action" href="${esc(dest.watch)}" target="_blank" rel="noopener noreferrer">LEARN IT</a>
        <a class="khan-action practice" href="${esc(dest.practice)}" target="_blank" rel="noopener noreferrer">PRACTICE IT</a>
      </div>
      ${dest.watch.includes('algebra-1-fl-best') ? '<div class="linknote">This area uses Khan Academy\'s Florida B.E.S.T. Algebra 1 track because it provides a specific data-analysis destination.</div>' : ''}
    </div>` : '';
  return `<div class="page">
  <h2>${a.area} — Interactive Support</h2>
  <div class="interactive-grid">
    <div class="int-block"><h3>LEARN IT / PRACTICE IT</h3><p class="hint">Khan Academy learning and practice destinations. External resources may change over time.</p>${linkBlock}</div>
    <div class="int-block"><h3>TUTOR ME WITH KHANMIGO</h3>
      <p class="hint">Have Khanmigo access? Open the AI tutor, then use the Byrdway Tutor Prompt below.</p>
      <div class="tutor-actions"><a class="khan-action" href="${KHANMIGO_STUDENT_DESTINATION}" target="_blank" rel="noopener noreferrer">TUTOR ME WITH KHANMIGO</a></div>
      <h4>BYRDWAY TUTOR PROMPT</h4>
      <div class="tutorprompt">${esc(a.khanmigoPrompt)}</div>
      <div class="tutor-actions"><button class="copy-prompt" type="button" onclick="copyTutorPrompt('${esc(a.id)}',this)">COPY TUTOR PROMPT</button><span class="copy-status" aria-live="polite"></span></div>
      <p class="hint">No Khanmigo access? Keep going with Learn It, Practice It, Blueprint, Flashcards, and Test Me.</p>
      <p class="disclaimer">Khanmigo access is provided separately by Khan Academy and depends on account eligibility. Byrdway Mathematics is not affiliated with, endorsed by, or sponsored by Khan Academy or Khanmigo.</p>
    </div>
  </div>
  </div>`;
}
function renderBackmatter(){
  const allFormulas = AREAS.flatMap(a => a.cheatSheet.page1.map(f => ({area:a.area, id:a.id, f})));
  const allErrors = AREAS.flatMap(a => a.commonErrors.slice(0,2).map(e => ({area:a.area, id:a.id, e})));
  return `<div class="page">
  <h2>Back Matter</h2>
  <div class="cs-page"><h3>Master Formula / Tool Finder</h3>
    <div class="cc-grid">${allFormulas.map(x=>`<div class="cc"><div class="cc-formula">${esc(x.f.formula)}</div><p>${esc(x.f.note)}</p><a href="#/area/${x.id}/cheatsheet">→ ${esc(x.area)}</a></div>`).join('')}</div>
  </div>
  <div class="cs-page"><h3>"Don't Fall For This" Collection</h3>
    <div class="cc-grid">${allErrors.map(x=>`<div class="cc trap-card"><b>${esc(x.area)}</b><p class="trap">✗ ${esc(x.e)}</p></div>`).join('')}</div>
  </div>
  <div class="cs-page"><h3>Cumulative Readiness Check</h3>
    <p>Pick any 3 areas above and complete their Test Me — Advanced tier, then their Honors Layer. If you clear all three without opening the Blueprint, you're test-ready across the semester's toughest transfer skills.</p>
  </div>
  <div class="cs-page"><h3>About the Author</h3>
    <p>Dr. Rogé J. Byrd — Byrdway Mathematics. This Power Tool was built using the Byrdway instructional architecture: compress what matters, connect how it works, retrieve what's memorized, verify real mastery, and push honors-level depth before test day.</p>
  </div>
  <div class="cs-page"><h3>Resource &amp; Link Disclaimer</h3>
    <p>Khan Academy and Khanmigo are independent educational resources referenced for optional supplemental study. This product is not affiliated with, sponsored by, or endorsed by Khan Academy. Khanmigo access depends on your own school or account eligibility and is not included with this purchase. Khan Academy learning and practice destinations are external resources and may change over time; periodic re-verification is recommended before continued classroom use.</p>
  </div>
  </div>`;
}

function route(){
  const hash = location.hash || '#/cover';
  const parts = hash.replace('#/','').split('/');
  const app = document.getElementById('app');
  if(parts[0]==='cover' || hash==='#/' || hash===''){ app.innerHTML = renderCover(); return; }
  if(parts[0]==='how'){ app.innerHTML = navBar()+renderHow(); window.scrollTo(0,0); return; }
  if(parts[0]==='home'){ app.innerHTML = navBar()+renderHome(); window.scrollTo(0,0); return; }
  if(parts[0]==='backmatter'){ app.innerHTML = navBar()+renderBackmatter(); window.scrollTo(0,0); return; }
  if(parts[0]==='area'){
    const a = findArea(parts[1]);
    if(!a){ app.innerHTML = navBar()+'<div class="page">Area not found. <a href="#/home">Go Home</a></div>'; return; }
    const tab = parts[2]||'cheatsheet';
    let body = '';
    if(tab==='cheatsheet') body = renderCheatSheet(a);
    else if(tab==='blueprint') body = renderBlueprint(a);
    else if(tab==='flashcards') body = renderFlashcards(a);
    else if(tab==='testme') body = renderTestMe(a);
    else if(tab==='honors') body = renderHonorsLayer(a);
    else if(tab==='interactive') body = renderInteractive(a);
    app.innerHTML = navBar(a.id, tab) + `<div class="area-tabbar">
      <a href="#/area/${a.id}/cheatsheet" class="${tab==='cheatsheet'?'on':''}">⚡ Cheat Sheet</a>
      <a href="#/area/${a.id}/blueprint" class="${tab==='blueprint'?'on':''}">🧭 Blueprint</a>
      <a href="#/area/${a.id}/flashcards" class="${tab==='flashcards'?'on':''}">🗂️ Flashcards</a>
      <a href="#/area/${a.id}/testme" class="${tab==='testme'?'on':''}">✅ Test Me</a>
      <a href="#/area/${a.id}/honors" class="${tab==='honors'?'on':''}">🎓 Honors Layer</a>
      <a href="#/area/${a.id}/interactive" class="${tab==='interactive'?'on':''}">🎬 Interactive</a>
    </div>` + body;
    window.scrollTo(0,0);
    return;
  }
  app.innerHTML = navBar()+renderHome();
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);
</script>
