name: ByrdWay Studio - Windows verification

on:
  push:
    paths: ['ByrdWay_Product_Studio/**', '.github/workflows/byrdway-windows.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: ByrdWay_Product_Studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies (same as install_windows.bat)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m playwright install chromium

      - name: Fetch ffmpeg for Windows (video Reviewer; bundled into the ZIP)
        run: |
          $u = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $u -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffx" -Force
          $b = Get-ChildItem "$env:RUNNER_TEMP\ffx" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item "$($b.DirectoryName)\ffmpeg.exe", "$($b.DirectoryName)\ffprobe.exe" ffmpeg\
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP\ffx" -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName ffmpeg\FFMPEG_LICENSE.txt
          .\ffmpeg\ffmpeg.exe -version | Select-Object -First 1

      - name: Full automated test suite incl. real-window GUI and Explainer end-to-end (no skips allowed)
        run: |
          "E2E=$env:RUNNER_TEMP\e2e_explainer_evidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:E2E = "$env:RUNNER_TEMP\e2e_explainer_evidence"
          $env:BYRDWAY_E2E_EVIDENCE = $env:E2E
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test_results_windows.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Select-String -Path test_results_windows.txt -Pattern "skipped") { Write-Error "A test was SKIPPED on Windows - not accepted"; exit 1 }
          if (-not (Test-Path "$env:E2E\3_export\Multiplication_Anime_Explainer.pdf")) { Write-Error "Explainer end-to-end evidence missing"; exit 1 }

      - name: Source self-test
        run: |
          python app.py --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item selftest_report.json selftest_report_source.json

      - name: Build Windows executable (PyInstaller)
        run: pyinstaller --noconfirm byrdway_studio.spec

      - name: Package the downloadable files
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Copy-Item USER_GUIDE.md, OWNER_QUICK_START.md, KNOWN_LIMITATIONS.md, PRODUCTION_READINESS_REPORT.md dist\ByrdWayStudio\
          Copy-Item ffmpeg dist\ByrdWayStudio\ffmpeg -Recurse -Force
          if (-not (Test-Path dist\ByrdWayStudio\ffmpeg\ffprobe.exe)) { Write-Error "ffmpeg not bundled"; exit 1 }
          Compress-Archive -Path dist\ByrdWayStudio -DestinationPath "ByrdWayStudio_v${v}_Windows_exe.zip" -Force
          git -C "$env:GITHUB_WORKSPACE" archive --format=zip --prefix="ByrdWay_Product_Studio_v$v/" HEAD:ByrdWay_Product_Studio -o "$PWD\ByrdWay_Product_Studio_v${v}_source.zip"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead("$PWD\ByrdWay_Product_Studio_v${v}_source.zip")
          $n = $z.Entries.Count
          $hasVer = $z.Entries | Where-Object { $_.FullName -eq "ByrdWay_Product_Studio_v$v/version.py" }
          $z.Dispose()
          if ($n -lt 50 -or -not $hasVer) { Write-Error "source ZIP incomplete ($n entries)"; exit 1 }
          "source ZIP entries: $n"
          Compress-Archive -Path "$env:E2E\*" -DestinationPath "E2E_Explainer_Evidence_v$v.zip" -Force

      - name: Self-test the EXACT downloadable .exe (extracted from the release ZIP)
        run: |
          $v = $env:VERSION
          $x = "$env:RUNNER_TEMP\from_zip"
          Expand-Archive "ByrdWayStudio_v${v}_Windows_exe.zip" -DestinationPath $x -Force
          $exe = "$x\ByrdWayStudio\ByrdWayStudio.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru -WorkingDirectory $env:RUNNER_TEMP
          Get-Content "$env:RUNNER_TEMP\selftest_report.json"
          if ($p.ExitCode -ne 0) { Write-Error "exe self-test failed ($($p.ExitCode))"; exit 1 }
          $got = (Get-Content "$env:RUNNER_TEMP\selftest_report.json" | ConvertFrom-Json).version
          if ($got -ne $v) { Write-Error "exe reports version $got but version.py says $v"; exit 1 }
          Copy-Item "$env:RUNNER_TEMP\selftest_report.json" selftest_report_exe.json
          # exe-only owner path: install Chromium FROM THE EXE into an empty folder, then self-test with only that
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:RUNNER_TEMP\exe_only_browsers"
          $i = Start-Process -FilePath $exe -ArgumentList "--install-browser" -Wait -PassThru
          if ($i.ExitCode -ne 0) { Write-Error "exe --install-browser failed ($($i.ExitCode))"; exit 1 }
          Remove-Item "$env:RUNNER_TEMP\selftest_report.json" -ErrorAction SilentlyContinue
          $p2 = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru -WorkingDirectory $env:RUNNER_TEMP
          if ($p2.ExitCode -ne 0) { Write-Error "self-test with exe-installed browser failed"; exit 1 }
          if (-not (Get-ChildItem "$env:RUNNER_TEMP\exe_only_browsers" -Directory | Where-Object Name -like 'chromium*')) { Write-Error "exe did not install Chromium"; exit 1 }
          "exe-only path: Chromium installed by the exe and self-test passed with it" | Tee-Object -FilePath exe_only_install.txt
          Remove-Item Env:PLAYWRIGHT_BROWSERS_PATH
          $env:BYRDWAY_WORKSPACE = "$env:RUNNER_TEMP\byrdway_ws"
          $g = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($g.HasExited) { Write-Error "GUI exited early with code $($g.ExitCode)"; exit 1 }
          if (-not (Test-Path "$env:BYRDWAY_WORKSPACE\settings.json")) { Write-Error "workspace not created"; exit 1 }
          Stop-Process -Id $g.Id -Force
          "Downloadable exe: self-test passed, version $got, GUI ran 20s and created its workspace" | Tee-Object -FilePath gui_smoke.txt

      - name: Verification manifest
        run: |
          $v = $env:VERSION
          $files = "ByrdWayStudio_v${v}_Windows_exe.zip", "ByrdWay_Product_Studio_v${v}_source.zip", "E2E_Explainer_Evidence_v$v.zip"
          $tests = (Select-String -Path test_results_windows.txt -Pattern "^Ran \d+ tests").Line
          $ok = (Select-String -Path test_results_windows.txt -Pattern "^OK").Line
          $m = @("ByrdWay Product Engineering Studio v$v - verification manifest",
                 "commit: $env:GITHUB_SHA",
                 "workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
                 "windows: $((Get-CimInstance Win32_OperatingSystem).Caption) $((Get-CimInstance Win32_OperatingSystem).Version)",
                 "tests: $tests $ok (no skips allowed)",
                 "exe self-test (run from the downloadable ZIP): $((Get-Content selftest_report_exe.json | ConvertFrom-Json).passed)",
                 "exe-only browser install + self-test: $(Test-Path exe_only_install.txt)",
                 "", "SHA-256 of downloadable files:")
          foreach ($f in $files) { $m += "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $f" }
          $m | Tee-Object -FilePath VERIFICATION_MANIFEST.txt

      # A push only TESTS (full suite, build, self-test of the exact .exe, evidence artifact).
      # A draft release is created only when the owner starts the workflow by hand (Actions -> Run workflow),
      # so work in progress never replaces an existing numbered release.
      - name: Draft GitHub release, then download it back and compare checksums
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:VERSION
          $files = "ByrdWayStudio_v${v}_Windows_exe.zip", "ByrdWay_Product_Studio_v${v}_source.zip", "E2E_Explainer_Evidence_v$v.zip", "VERIFICATION_MANIFEST.txt"
          # A manual run publishes a TEST BUILD draft named after its commit. Numbered drafts (e.g. v0.5.0) are never
          # replaced or deleted here; only earlier test-build drafts are removed.
          $sha = $env:GITHUB_SHA.Substring(0,7)
          $tag = "v$v-build-$sha"
          gh release delete $tag --yes --cleanup-tag 2>$null
          $old = gh release list --limit 50 --json tagName,isDraft,name | ConvertFrom-Json | Where-Object { $_.isDraft -and $_.name -like '*test build*' -and $_.tagName -ne $tag }
          foreach ($r in $old) { gh release delete $r.tagName --yes --cleanup-tag; "removed superseded test-build draft $($r.tagName)" }
          $notes = (Get-Content VERIFICATION_MANIFEST.txt -Raw) + "`nTEST BUILD of commit $sha (version stays $v until the owner's acceptance tests pass). DRAFT: not published."
          gh release create $tag @files --draft --target $env:GITHUB_SHA --title "ByrdWay Product Engineering Studio v$v test build $sha" --notes "$notes"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $dl = "$env:RUNNER_TEMP\downloaded"
          gh release download $tag --dir $dl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in $files) {
            $a = (Get-FileHash $f -Algorithm SHA256).Hash; $b = (Get-FileHash "$dl\$f" -Algorithm SHA256).Hash
            if ($a -ne $b) { Write-Error "release asset $f differs from the tested file"; exit 1 }
            "verified identical after download: $f  $($a.ToLower())"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: byrdway-windows-evidence
          path: |
            ByrdWay_Product_Studio/test_results_windows.txt
            ByrdWay_Product_Studio/selftest_report_*.json
            ByrdWay_Product_Studio/gui_smoke.txt
            ByrdWay_Product_Studio/exe_only_install.txt
            ByrdWay_Product_Studio/VERIFICATION_MANIFEST.txt
            ByrdWay_Product_Studio/E2E_Explainer_Evidence_*.zip
