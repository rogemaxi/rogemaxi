<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Byrdway Algebra Power Tool — Algebra + Honors</title>
<style>
:root{ --bg:#0f172a; --bg2:#111827; --card:#1e293b; --txt:#e2e8f0; --dim:#94a3b8; --accent:#fbbf24; --blue:#7dd3fc; --green:#4ade80; --red:#f87171; }
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
a{color:var(--blue);text-decoration:none}
h1,h2,h3,h4{font-family:'Segoe UI',Arial,sans-serif;color:#fff}
.cover{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at top,#1e293b,#0b1220 70%);padding:40px 20px}
.cover h1{font-size:3rem;letter-spacing:6px;margin:10px 0 0;color:var(--accent)}
.cover h2{font-size:1.6rem;letter-spacing:3px;margin:6px 0;color:#fff}
.cover .tagline{font-size:1.1rem;color:var(--blue);margin:4px 0}
.cover .promise{color:var(--dim);margin:10px 0}
.cover .author{margin-top:18px;font-size:1.05rem;color:#fff}
.cta{margin-top:28px;background:var(--accent);color:#111;border:none;padding:14px 28px;border-radius:30px;font-size:1rem;font-weight:700;cursor:pointer}
.cta:hover{filter:brightness(1.1)}
.topnav{position:sticky;top:0;z-index:50;background:#0b1220ee;backdrop-filter:blur(6px);display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #1e293b;flex-wrap:wrap;gap:8px}
.brand{font-weight:800;color:var(--accent);letter-spacing:1px}
.brand span{color:var(--dim);font-weight:400;margin-left:6px;font-size:0.85em}
.navlinks a{margin-left:14px;color:var(--dim);font-size:0.92rem}
.navlinks a.active,.navlinks a:hover{color:var(--accent)}
.page{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
.howpage{text-align:center}
.how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:24px 0}
.how-card{background:var(--card);border-radius:14px;padding:20px}
.how-ic{font-size:2rem}
.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px}
.tile{background:var(--card);border-radius:14px;padding:20px;text-align:center;transition:.15s;border:1px solid #1e293b}
.tile:hover{border-color:var(--accent);transform:translateY(-3px)}
.tile-num{color:var(--dim);font-size:0.8rem}
.tile-ic{margin:6px auto;width:40px;height:40px}
.tile-ic svg{width:100%;height:100%}
.tile-name{color:#fff;font-weight:600}
.needgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.needcard{background:var(--bg2);border-left:3px solid var(--blue);border-radius:8px;padding:12px 16px}
.area-tabbar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;background:#0b1220;position:sticky;top:56px;z-index:40;border-bottom:1px solid #1e293b}
.area-tabbar a{padding:8px 14px;border-radius:20px;background:var(--card);color:var(--dim);font-size:0.9rem}
.area-tabbar a.on{background:var(--accent);color:#111;font-weight:700}
.pagebadge{font-size:0.7rem;background:var(--card);color:var(--dim);padding:3px 10px;border-radius:10px;vertical-align:middle;margin-left:10px}
.cs-page{background:#0b1220;border:1px solid #1e293b;border-radius:14px;padding:20px;margin:18px 0}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:10px}
.cc{background:var(--card);border-radius:12px;padding:14px}
.cc-formula{font-family:Consolas,monospace;color:var(--accent);font-weight:700;margin-bottom:6px}
.cc p{margin:4px 0;font-size:0.92rem}
.cc .trap{color:var(--red)}
.cc .inside{color:var(--green)}
.trap-card{border-left:3px solid var(--red)}
.painbox{background:#1a1023;border:1px solid #3b2545;border-radius:14px;padding:18px;margin-top:20px}
.painbox li{margin:6px 0;font-size:0.92rem}
.deng{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.deng-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;background:var(--bg2);border-radius:10px;padding:12px}
.deng-cell{font-size:0.85rem}
.deng-label{display:block;color:var(--accent);font-size:0.7rem;font-weight:700;letter-spacing:1px;margin-bottom:4px}
.stepflow{padding-left:0;list-style:none}
.stepflow li{background:var(--bg2);margin:8px 0;padding:10px 14px;border-radius:8px;display:flex;gap:10px;align-items:flex-start}
.stepnum{background:var(--blue);color:#111;border-radius:50%;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700}
.connlist li{margin:6px 0}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:16px}
.flashcard{perspective:1200px;height:420px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flashcard.flipped .flip-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;overflow-y:auto}
.flip-back{transform:rotateY(180deg);background:#122032}
.fctype{align-self:flex-start;font-size:0.65rem;font-weight:700;color:#111;padding:3px 8px;border-radius:8px;margin-bottom:6px;flex-shrink:0}
.fc-text{font-size:0.92rem}
.fc-tap{font-size:0.7rem;color:var(--dim);text-align:right;margin-top:auto;padding-top:6px;flex-shrink:0}
.fc-diagram{margin-bottom:6px;flex-shrink:0;max-height:130px;overflow:hidden}
.fc-diagram svg{max-height:130px}
.hint{color:var(--dim);font-size:0.9rem}
.tier-section{margin-top:22px}
.testitem{background:var(--card);border-radius:12px;padding:16px;margin:10px 0}
.ti-diagram{margin:10px 0}
.reveal-btn{background:var(--blue);color:#111;border:none;padding:8px 16px;border-radius:20px;font-weight:700;cursor:pointer}
.ti-a{margin-top:10px;background:var(--bg2);padding:10px;border-radius:8px}
.fixthis{margin-top:8px;font-size:0.85rem}
.interactive-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
.int-block{background:var(--card);border-radius:14px;padding:18px}
.linkcard{background:var(--bg2);border-radius:10px;padding:12px;margin:10px 0}
.linklabel{color:var(--accent);font-weight:700}
.linksub{font-size:0.8rem;color:var(--dim)}
.linknote{font-size:0.85rem;margin-top:4px}
.tutorprompt{background:var(--bg2);border-left:3px solid var(--green);padding:12px;border-radius:8px;font-style:italic;font-size:0.9rem}
.disclaimer{font-size:0.78rem;color:var(--dim);margin-top:10px}
@media (max-width:700px){ .interactive-grid{grid-template-columns:1fr} .deng-row{grid-template-columns:1fr 1fr} }

/* --- Algebra Power Tool surgical additions --- */
.deng-row5{grid-template-columns:1fr 1fr 1fr 1fr 1fr}
.link-actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.khan-action{background:var(--blue);color:#111;font-weight:700;padding:8px 16px;border-radius:20px;font-size:0.85rem;display:inline-block}
.khan-action.practice{background:var(--accent)}
.khan-action:hover{filter:brightness(1.1)}
@media (max-width:700px){ .deng-row5{grid-template-columns:1fr 1fr} }
.flip-inner:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:14px}
.tutor-actions{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.copy-prompt{background:var(--green);color:#111;border:none;font-weight:700;padding:8px 16px;border-radius:20px;cursor:pointer}.copy-status{font-size:.78rem;color:var(--green);margin-left:8px}.tutorprompt{user-select:text}
</style>
<style id="bwm-style">
/* ===== BYRDWAY MASTERY ADD-ON — additive styles (all classes prefixed bwm-) ===== */
.bwm{--bwm-good:var(--green);--bwm-bad:var(--red);--bwm-warn:#fb923c}
.bwm-math{font-family:Consolas,'Cambria Math',monospace;color:var(--accent);font-weight:700;direction:ltr;unicode-bidi:isolate;white-space:pre-wrap}
.bwm-mathbox{background:var(--bg2);border:1px solid #1e293b;border-radius:10px;padding:12px 16px;margin:10px 0;font-size:1.08rem;text-align:left}
.bwm-hero{background:linear-gradient(135deg,#1e293b,#0b1220);border:1px solid #334155;border-radius:16px;padding:20px;margin:6px 0 28px}
.bwm-hero h2{margin:0 0 4px;color:var(--accent)}
.bwm-sub{color:var(--dim);margin:0 0 12px}
.bwm-langrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.bwm-langrow label{font-weight:700;color:#fff}
.bwm-select{background:var(--bg2);color:var(--txt);border:1px solid #334155;border-radius:10px;padding:8px 12px;font-size:1rem;min-height:40px}
.bwm-note{font-size:.82rem;color:var(--dim)}
.bwm-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.bwm-card{display:block;background:var(--card);border:1px solid #1e293b;border-radius:14px;padding:16px;color:var(--txt);transition:.15s}
.bwm-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.bwm-card .bwm-ic{font-size:1.6rem}
.bwm-card h3{margin:6px 0 4px;font-size:1.05rem}
.bwm-card p{margin:0;font-size:.88rem;color:var(--dim)}
.bwm-card .bwm-stat{margin-top:8px;font-size:.8rem;color:var(--blue)}
.bwm-btn{display:inline-block;background:var(--accent);color:#111;border:none;padding:10px 20px;border-radius:24px;font-weight:700;font-size:.95rem;cursor:pointer;margin:4px 6px 4px 0}
.bwm-btn.alt{background:var(--blue)}
.bwm-btn.ghost{background:transparent;color:var(--txt);border:1px solid #334155}
.bwm-btn:disabled{opacity:.45;cursor:not-allowed}
.bwm-btn:hover:not(:disabled){filter:brightness(1.1)}
.bwm-progress{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.bwm-progress>i{display:block;height:100%;background:var(--accent)}
.bwm-qcard{background:var(--card);border-radius:14px;padding:18px;margin:12px 0}
.bwm-qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:.85rem;margin-bottom:8px}
.bwm-stem{font-size:1.05rem;color:#fff;margin:4px 0}
.bwm-opts{display:grid;gap:10px;margin-top:12px}
.bwm-opt{display:flex;gap:12px;align-items:center;text-align:start;background:var(--bg2);border:2px solid #1e293b;border-radius:12px;padding:12px 14px;color:var(--txt);font-size:1rem;cursor:pointer;width:100%;min-height:48px}
.bwm-opt:hover{border-color:#475569}
.bwm-opt.on{border-color:var(--accent);background:#2a2410}
.bwm-opt .bwm-letter{min-width:28px;height:28px;border-radius:50%;background:#334155;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.bwm-opt.on .bwm-letter{background:var(--accent);color:#111}
.bwm-dots{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.bwm-dot{width:34px;height:34px;border-radius:8px;border:1px solid #334155;background:var(--bg2);color:var(--dim);font-size:.8rem;cursor:pointer}
.bwm-dot.done{background:#1e3a2a;color:var(--green);border-color:#22543d}
.bwm-dot.cur{border-color:var(--accent);color:var(--accent)}
.bwm-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.bwm-score{font-size:3rem;font-weight:800;color:var(--accent);margin:0}
.bwm-bars{display:grid;gap:8px;margin-top:10px}
.bwm-bar{display:grid;grid-template-columns:minmax(120px,1.4fr) 3fr 56px;gap:10px;align-items:center;font-size:.88rem}
.bwm-bar .bwm-track{height:12px;background:var(--bg2);border-radius:6px;overflow:hidden}
.bwm-bar .bwm-track>i{display:block;height:100%}
.bwm-review{border-inline-start:4px solid #334155}
.bwm-review.ok{border-inline-start-color:var(--green)}
.bwm-review.no{border-inline-start-color:var(--red)}
.bwm-tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:10px;color:#111}
.bwm-tag.ok{background:var(--green)}.bwm-tag.no{background:var(--red)}.bwm-tag.na{background:#94a3b8}
.bwm-steps{list-style:none;padding:0;margin:8px 0}
.bwm-steps li{background:var(--bg2);border-radius:8px;padding:8px 12px;margin:6px 0;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.bwm-steps .bwm-sn{background:var(--blue);color:#111;border-radius:50%;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.bwm-steps .bwm-sl{color:#fff;font-weight:600;flex:1 1 180px}
.bwm-steps .bwm-math{flex:2 1 240px}
.bwm-plan-item{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;border-inline-start:5px solid var(--dim)}
.bwm-plan-item h3{margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bwm-rank{background:#334155;color:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.bwm-band{font-size:.72rem;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:10px;color:#111}
.bwm-plan-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bwm-plan-links a{background:var(--bg2);border:1px solid #334155;color:var(--txt);padding:7px 12px;border-radius:18px;font-size:.85rem}
.bwm-plan-links a:hover{border-color:var(--accent);color:var(--accent)}
.bwm-plan-links b{color:var(--accent);margin-inline-end:4px}
.bwm-lesson h3{color:var(--accent);margin:0 0 6px;font-size:.85rem;letter-spacing:1.5px;text-transform:uppercase}
.bwm-lesson .cs-page p{font-size:1.02rem}
.bwm-principle{font-size:1.15rem !important;color:#fff;font-weight:600}
.bwm-eoc{display:grid;gap:12px;margin-top:14px}
.bwm-eoc-row{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:16px;border:1px solid #1e293b}
.bwm-eoc-num{font-size:2rem;font-weight:800;color:var(--accent);text-align:center}
.bwm-dok{display:inline-block;font-size:.72rem;font-weight:800;background:var(--blue);color:#111;padding:2px 10px;border-radius:10px;margin-inline-start:6px}
.bwm-dok.x{background:linear-gradient(90deg,#fbbf24,#fb7185);color:#111}
.bwm-done{color:var(--green);font-size:.8rem;font-weight:700}
.bwm-tilegrid .tile{display:block}
@media (max-width:700px){
  .bwm-eoc-row{grid-template-columns:48px 1fr}
  .bwm-eoc-row .bwm-btn{grid-column:1 / -1}
  .bwm-bar{grid-template-columns:1fr 2fr 48px}
  .bwm-score{font-size:2.4rem}
}
</style>

<div id="app"></div>
<script>
/* BYRDWAY ALGEBRA POWER TOOL — data.js
   10 locked Algebra + Honors areas. Original Byrdway content, authored by
   byrdway-curriculum-architect specialist agents (one per area), matching
   the established Byrdway quality bar. */
const AREAS = [
  {
    "id": "solving-equations",
    "num": 1,
    "area": "Solving Equations & Inequalities",

function svgWrap(inner, vb, h){
  h = h || 220;
  return '<svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:'+h+'px;background:#0b1220;border-radius:10px" role="img" aria-label="algebra diagram">'+inner+'</svg>';

const STROKE='#7dd3fc', ACCENT='#fbbf24', DIM='#64748b', GOOD='#4ade80', BAD='#f87171', TXT='#e2e8f0';

function parsePoints(payload){
  const re = /([A-Za-z']*)\(([-\d.]+),\s*([-\d.]+)\)/g;
  const pts = []; let m;
  while((m = re.exec(payload))){ pts.push({label:m[1], x:parseFloat(m[2]), y:parseFloat(m[3])}); }
  return pts;
}

function gridBase(range){
  const size=300, cx=150, cy=150;
  const scale = 130/range;
  const toX = x => cx + x*scale, toY = y => cy - y*scale;
  let s = '';
  const step = Math.max(1, Math.round(range/8));
  for(let i=-Math.floor(range); i<=Math.floor(range); i+=step){
    s += `<line x1="${toX(i)}" y1="${toY(-range)}" x2="${toX(i)}" y2="${toY(range)}" stroke="#1e293b" stroke-width="1"/>`;
    s += `<line x1="${toX(-range)}" y1="${toY(i)}" x2="${toX(range)}" y2="${toY(i)}" stroke="#1e293b" stroke-width="1"/>`;
  }
  s += `<line x1="${toX(-range)}" y1="${toY(0)}" x2="${toX(range)}" y2="${toY(0)}" stroke="${DIM}" stroke-width="1.5"/>`;
  s += `<line x1="${toX(0)}" y1="${toY(-range)}" x2="${toX(0)}" y2="${toY(range)}" stroke="${DIM}" stroke-width="1.5"/>`;
  return { s, toX, toY, size };
}

function lineAcross(g, m, b, range, color, style){
  const x1=-range, x2=range, y1=m*x1+b, y2=m*x2+b;
  const dash = style==='dashed' ? ' stroke-dasharray="6,4"' : '';
  return `<line x1="${g.toX(x1)}" y1="${g.toY(y1)}" x2="${g.toX(x2)}" y2="${g.toY(y2)}" stroke="${color}" stroke-width="2.5"${dash}/>`;
}

function shadeHalfPlane(g, m, b, dir, range, color, opacity){
  // dir: 'above' shades y > line, 'below' shades y < line, clipped to the visible grid square.
  const yL = m*-range+b, yR = m*range+b;
  let d;
  if(dir==='above'){
    d = `M ${g.toX(-range)} ${g.toY(yL)} L ${g.toX(-range)} ${g.toY(range)} L ${g.toX(range)} ${g.toY(range)} L ${g.toX(range)} ${g.toY(yR)} Z`;
  } else {
    d = `M ${g.toX(-range)} ${g.toY(yL)} L ${g.toX(-range)} ${g.toY(-range)} L ${g.toX(range)} ${g.toY(-range)} L ${g.toX(range)} ${g.toY(yR)} Z`;
  }
  return `<path d="${d}" fill="${color}" opacity="${opacity}" stroke="none"/>`;
}

    }
    const range=10; const g = gridBase(range);
    let s = g.s;
    s += lineAcross(g, m1, b1, range, STROKE, 'solid');
    s += lineAcross(g, m2, b2, range, ACCENT, 'solid');
    if(m1!==m2){
      const ix = (b2-b1)/(m1-m2);
      const iy = m1*ix+b1;
      const ixR = Math.round(ix*100)/100, iyR = Math.round(iy*100)/100;
      s += `<circle cx="${g.toX(ix)}" cy="${g.toY(iy)}" r="6" fill="${GOOD}"/>`;
      s += `<text x="${g.toX(ix)+8}" y="${g.toY(iy)-8}" fill="${TXT}" font-size="12" font-family="sans-serif">solution (${ixR}, ${iyR})</text>`;
    } else {
      s += `<text x="10" y="20" fill="${b1===b2?GOOD:BAD}" font-size="12" font-family="sans-serif">${b1===b2?'infinitely many solutions (same line)':'no solution (parallel lines)'}</text>`;
    }
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  }
  // default: plot arbitrary points connected
  const pts = parsePoints(payload);
  let range = 10;
  pts.forEach(p=>{ range = Math.max(range, Math.abs(p.x)+2, Math.abs(p.y)+2); });
  const g = gridBase(range);
  let s = g.s;
  if(pts.length>1){
    let path = 'M '+g.toX(pts[0].x)+' '+g.toY(pts[0].y);
    for(let i=1;i<pts.length;i++) path += ' L '+g.toX(pts[i].x)+' '+g.toY(pts[i].y);
    s += `<path d="${path}" fill="none" stroke="${STROKE}" stroke-width="2"/>`;
  }
  pts.forEach(p=>{
    s += `<circle cx="${g.toX(p.x)}" cy="${g.toY(p.y)}" r="5" fill="${ACCENT}"/>`;
    s += `<text x="${g.toX(p.x)+8}" y="${g.toY(p.y)-8}" fill="${TXT}" font-size="13" font-family="sans-serif">${p.label}(${p.x},${p.y})</text>`;
  });
  return svgWrap(s, `0 0 ${g.size} ${g.size}`);
}

function numberlineDiagram(payload){
  // range auto-expands so every plotted boundary value lands cleanly on the drawn line
  const boundaryVals = [];
  const boundaryRe = /(open|closed)\s*(-?[\d.]+)/g;
  let bm;
  while((bm = boundaryRe.exec(payload))){ boundaryVals.push(parseFloat(bm[2])); }
  let range = 10;
  boundaryVals.forEach(v=>{ range = Math.max(range, Math.ceil(Math.abs(v))+2); });

  const w=320,h=100,cy=50, left=20,right=300;
  const toX = v => left + (v+range)*((right-left)/(2*range));
  let s = `<line x1="${left}" y1="${cy}" x2="${right}" y2="${cy}" stroke="${DIM}" stroke-width="2"/>`;
  const step = Math.max(1, Math.round(range/5));
  for(let i=-range;i<=range;i+=step){ s += `<line x1="${toX(i)}" y1="${cy-6}" x2="${toX(i)}" y2="${cy+6}" stroke="${DIM}" stroke-width="1"/><text x="${toX(i)}" y="${cy+22}" fill="${TXT}" font-size="10" text-anchor="middle" font-family="sans-serif">${i}</text>`; }

  function drawCircle(type, val){
    if(type==='closed') s += `<circle cx="${toX(val)}" cy="${cy}" r="7" fill="${ACCENT}"/>`;
    else s += `<circle cx="${toX(val)}" cy="${cy}" r="7" fill="#0b1220" stroke="${ACCENT}" stroke-width="2.5"/>`;
  }

  if(/^compound-and:/.test(payload) || /^compound-or:/.test(payload)){
    // format: "compound-and:open-2,closed5"  or  "compound-or:closed-3,open4"
    const isOr = payload.startsWith('compound-or:');
    const body = payload.slice(payload.indexOf(':')+1);
    const parts = body.split(',');
    const bounds = parts.map(p=>{
      const m = p.match(/(open|closed)(-?[\d.]+)/);
      return { type: m[1], val: parseFloat(m[2]) };
    }).sort((a,b)=>a.val-b.val);
    const [lo, hi] = bounds;
    if(isOr){
      s += `<line x1="${left}" y1="${cy}" x2="${toX(lo.val)}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
      s += `<line x1="${toX(hi.val)}" y1="${cy}" x2="${right}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
    } else {
      s += `<line x1="${toX(lo.val)}" y1="${cy}" x2="${toX(hi.val)}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
    }
    drawCircle(lo.type, lo.val);
    drawCircle(hi.type, hi.val);
  } else if(payload.includes('closed') || payload.includes('open')){
    // format: "closed3,right"  or  "open-4,left"
    const parts = payload.split(',');
    const m = parts[0].match(/(open|closed)(-?[\d.]+)/);
    const type = m ? m[1] : 'closed';
    const val = m ? parseFloat(m[2]) : 0;
    const dir = parts[1]||'right';
    if(dir==='right') s += `<line x1="${toX(val)}" y1="${cy}" x2="${right}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
    else s += `<line x1="${left}" y1="${cy}" x2="${toX(val)}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
    drawCircle(type, val);
  } else {
    s += `<circle cx="${toX(0)}" cy="${cy}" r="7" fill="${ACCENT}"/>`;
    s += `<line x1="${toX(0)}" y1="${cy}" x2="${right}" y2="${cy}" stroke="${ACCENT}" stroke-width="4"/>`;
  }
  return svgWrap(s, `0 0 ${w} ${h}`, 110);
}

function slopeTriangleDiagram(payload){
  const nums = (payload.match(/-?\d+\.?\d*/g)||[2,4,5,10]).map(Number);
  const [x1,y1,x2,y2] = nums;
  const range=12; const g = gridBase(range);

  s += `<line x1="${g.toX(x1)}" y1="${g.toY(y1)}" x2="${g.toX(x2)}" y2="${g.toY(y1)}" stroke="${ACCENT}" stroke-width="2" stroke-dasharray="4,3"/>`;
  s += `<line x1="${g.toX(x2)}" y1="${g.toY(y1)}" x2="${g.toX(x2)}" y2="${g.toY(y2)}" stroke="${GOOD}" stroke-width="2" stroke-dasharray="4,3"/>`;
  s += `<circle cx="${g.toX(x1)}" cy="${g.toY(y1)}" r="5" fill="${ACCENT}"/>`;

function expDiagram(payload){
 const match=payload.match(/(?:decay|base)(\d+\.?\d*)/),base=match?Number(match[1]):2;
 const scale=payload.match(/,a(-?\d+\.?\d*)/),amplitude=scale?Number(scale[1]):1;
 const decay=base<1,xmin=decay?0:-2,xmax=decay?6:4,ymax=amplitude*(decay?1.2:8);
 const size=300,left=45,right=280,top=30,bottom=265;
 const X=x=>left+(x-xmin)/(xmax-xmin)*(right-left),Y=y=>bottom-y/ymax*(bottom-top);
 const id='exp-clip-'+String(base).replace('.','-')+'-'+amplitude;
 let s=`<defs><clipPath id="${id}"><rect x="${left}" y="${top}" width="${right-left}" height="${bottom-top}"/></clipPath></defs>`;
 s+=`<line x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}" stroke="${DIM}"/><line x1="${X(0)}" y1="${top}" x2="${X(0)}" y2="${bottom}" stroke="${DIM}"/>`;
 for(let x=xmin;x<=xmax;x++)s+=`<text x="${X(x)-4}" y="${bottom+17}" fill="${TXT}" font-size="10">${x}</text>`;
 for(let i=1;i<=4;i++){const y=ymax*i/4;s+=`<text x="5" y="${Y(y)+3}" fill="${TXT}" font-size="10">${Number(y.toFixed(2))}</text>`;}
 const path=Array.from({length:161},(_,i)=>{const x=xmin+(xmax-xmin)*i/160,y=amplitude*base**x;return `${i?'L':'M'} ${X(x)} ${Y(y)}`;}).join(' ');
 s+=`<g clip-path="url(#${id})"><path d="${path}" fill="none" stroke="${STROKE}" stroke-width="2.5"/><circle cx="${X(0)}" cy="${Y(amplitude)}" r="5" fill="${ACCENT}"/></g>`;
 s+=`<text x="${X(0)+8}" y="${Y(amplitude)-8}" fill="${TXT}" font-size="11">(0, ${amplitude})</text><text x="46" y="18" fill="${TXT}" font-size="12">y = ${amplitude} · ${base}^x</text>`;
 return svgWrap(s,`0 0 ${size} ${size}`);
}

function parabolaDiagram(payload){
  let h=0,k=0,a=1;
  if(payload.includes('vertex:')){
    const m = payload.match(/h(-?\d+\.?\d*),k(-?\d+\.?\d*),a(-?\d+\.?\d*)/);
    if(m){ h=parseFloat(m[1]); k=parseFloat(m[2]); a=parseFloat(m[3]); }
  } else if(payload.includes('widthcompare')){
    // format: "widthcompare:coefA,coefB" -> compares the two named |a| coefficients.
    // bare "widthcompare" (no args) falls back to the original default pair (3, 1/3).
    let coefs = [3,1/3];
    const wcBody = payload.indexOf(':')===-1 ? '' : payload.slice(payload.indexOf(':')+1);
    if(wcBody){
      const nums = wcBody.split(',').map(Number);
      if(nums.length>=2 && nums.every(n=>!isNaN(n))){ coefs = nums; }
    }
    const range=10; const g = gridBase(range);
    let s = g.s;
    coefs.forEach((coef,i)=>{
      let path='';
      for(let px=-range; px<=range; px+=0.4){ const py=coef*px*px; if(Math.abs(py)>range) continue; const cmd=path===''?'M':'L'; path+=`${cmd} ${g.toX(px)} ${g.toY(py)} `; }
      s += `<path d="${path}" fill="none" stroke="${i===0?ACCENT:STROKE}" stroke-width="2.5"/>`;
    });
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  } else if(payload.includes('discriminant-neg')){
    // format: "discriminant-neg:a,b,c" -> plots the REAL y=ax^2+bx+c whose
    // discriminant is negative (never crosses the x-axis).
    // bare "discriminant-neg" (no args) falls back to the original default curve.
    let da=0.3, db=0, dc=4;
    const dnBody = payload.indexOf(':')===-1 ? '' : payload.slice(payload.indexOf(':')+1);
    if(dnBody){
      const nums = dnBody.split(',').map(Number);
      if(nums.length>=3 && nums.every(n=>!isNaN(n))){ [da,db,dc] = nums; }
    }
    const vh = -db/(2*da), vk = da*vh*vh+db*vh+dc;
    const range = Math.max(10, Math.ceil(Math.abs(vh))+4, Math.ceil(Math.abs(vk))+4);
    const g = gridBase(range);
    let s = g.s; let path='';
    const dnStep = range/60;
    for(let px=-range; px<=range; px+=dnStep){ const py=da*px*px+db*px+dc; if(Math.abs(py)>range) continue; const cmd=path===''?'M':'L'; path+=`${cmd} ${g.toX(px)} ${g.toY(py)} `; }
    s += `<path d="${path}" fill="none" stroke="${BAD}" stroke-width="2.5"/>`;
    s += `<text x="30" y="270" fill="${BAD}" font-size="12" font-family="sans-serif">never crosses x-axis</text>`;
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  } else if(payload.includes('projectile')){
    // format: "projectile:a,v0,h0" -> plots the REAL h(t)=a*t^2+v0*t+h0
    // (feet, seconds) and marks the positive landing root (where h(t)=0).
    // bare "projectile" (no args) falls back to the original default curve.
    let pa=-16, pv0=48, ph0=4;
    const pjBody = payload.indexOf(':')===-1 ? '' : payload.slice(payload.indexOf(':')+1);
    if(pjBody){
      const nums = pjBody.split(',').map(Number);
      if(nums.length>=3 && nums.every(n=>!isNaN(n))){ [pa,pv0,ph0] = nums; }
    }
    // positive root of pa*t^2 + pv0*t + ph0 = 0 (the physically meaningful landing time)
    const disc = Math.max(0, pv0*pv0 - 4*pa*ph0);
    const sq = Math.sqrt(disc);
    const r1 = (-pv0+sq)/(2*pa), r2 = (-pv0-sq)/(2*pa);
    const tLand = Math.max(r1,r2) > 0 ? Math.max(r1,r2) : Math.min(r1,r2);
    const vt = -pv0/(2*pa);
    const maxHeight = Math.max(ph0, pa*vt*vt+pv0*vt+ph0);
    const xRange = (Math.max(tLand, vt)*1.15) || 5;
    const yRange = (maxHeight*1.15) || 10;
    const size=300, padL=42, padB=30, padT=20, padR=20;
    const toX = t => padL + (t/xRange)*(size-padL-padR);
    const toY = y => (size-padB) - (y/yRange)*(size-padB-padT);
    let s = `<line x1="${padL}" y1="${size-padB}" x2="${size-padR}" y2="${size-padB}" stroke="${DIM}" stroke-width="1.5"/>`;
    s += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${size-padB}" stroke="${DIM}" stroke-width="1.5"/>`;
    let path='';
    for(let i=0;i<=120;i++){const t=tLand*i/120,py=pa*t*t+pv0*t+ph0;path+=`${i?'L':'M'} ${toX(t)} ${toY(py)} `;}
    s += `<path d="${path}" fill="none" stroke="${STROKE}" stroke-width="2.5"/>`;
    s += `<circle cx="${toX(tLand)}" cy="${toY(0)}" r="5" fill="${GOOD}"/>`;
    s += `<text x="${toX(tLand)+8}" y="${toY(0)-8}" fill="${TXT}" font-size="12" font-family="sans-serif">lands t≈${Math.round(tLand*100)/100}s</text>`;
    s += `<text x="10" y="16" fill="${TXT}" font-size="11" font-family="sans-serif">h(t)=${pa}t²+${pv0}t+${ph0}</text>`;
    return svgWrap(s, `0 0 ${size} ${size}`);
  } else if(payload.includes('increasedecrease')){
    // payload like "increasedecrease:h,k" -> vertex (h,k) of an upward parabola y=(x-h)^2+k
    let vh=2, vk=-1;
    const vm = payload.match(/increasedecrease:(-?\d+\.?\d*),(-?\d+\.?\d*)/);
    if(vm){ vh=parseFloat(vm[1]); vk=parseFloat(vm[2]); }
    const range=10; const g = gridBase(range);
    let s = g.s;
    // decreasing branch (left of vertex) in BAD, increasing branch (right of vertex) in GOOD
    let pathDec=''; let pathInc='';
    for(let px=-range; px<=vh; px+=0.3){ const py=(px-vh)*(px-vh)+vk; if(Math.abs(py)>range) continue; const cmd=pathDec===''?'M':'L'; pathDec+=`${cmd} ${g.toX(px)} ${g.toY(py)} `; }
    for(let px=vh; px<=range; px+=0.3){ const py=(px-vh)*(px-vh)+vk; if(Math.abs(py)>range) continue; const cmd=pathInc===''?'M':'L'; pathInc+=`${cmd} ${g.toX(px)} ${g.toY(py)} `; }
    s += `<path d="${pathDec}" fill="none" stroke="${BAD}" stroke-width="2.5"/>`;
    s += `<path d="${pathInc}" fill="none" stroke="${GOOD}" stroke-width="2.5"/>`;
    s += `<circle cx="${g.toX(vh)}" cy="${g.toY(vk)}" r="5" fill="${ACCENT}"/>`;
    s += `<text x="${g.toX(vh)+8}" y="${g.toY(vk)-8}" fill="${TXT}" font-size="12" font-family="sans-serif">vertex (${vh},${vk})</text>`;
    s += `<text x="20" y="20" fill="${BAD}" font-size="11" font-family="sans-serif">decreasing</text>`;
    s += `<text x="${g.size-90}" y="20" fill="${GOOD}" font-size="11" font-family="sans-serif">increasing</text>`;
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  } else if(payload.includes('positive-negative')){
    // payload like "positive-negative:h,k" -> vertex (h,k) of an upward parabola y=(x-h)^2+k
    // optional third value: "positive-negative:h,k,a" -> sets the leading coefficient a
    // (a defaults to 1 / opens-upward when omitted, preserving prior behavior).
    let vh=2, vk=-1, va=1;
    const vm = payload.match(/positive-negative:(-?\d+\.?\d*),(-?\d+\.?\d*)(?:,(-?\d+\.?\d*))?/);
    if(vm){ vh=parseFloat(vm[1]); vk=parseFloat(vm[2]); if(vm[3]!==undefined) va=parseFloat(vm[3]); }
    const range=10; const g = gridBase(range);
    let s = g.s; let path='';
    for(let px=-range; px<=range; px+=0.3){ const py=va*(px-vh)*(px-vh)+vk; if(Math.abs(py)>range) continue; const cmd=path===''?'M':'L'; path+=`${cmd} ${g.toX(px)} ${g.toY(py)} `; }
    s += `<path d="${path}" fill="none" stroke="${STROKE}" stroke-width="2"/>`;
    // Two real roots exist when the vertex sits on the opposite side of the x-axis
    // from the direction the parabola opens (va and vk have opposite signs).
    // Between the roots, y has the same sign as vk (the vertex's extreme value);
    // outside the roots, y has the opposite sign.
    const rootsExist = (va>0 && vk<0) || (va<0 && vk>0);
    if(rootsExist){
      const halfWidth = Math.sqrt(-vk/va);
      const rootL = vh-halfWidth, rootR = vh+halfWidth;
      let midPath = `M ${g.toX(rootL)} ${g.toY(0)} `;
      for(let px=rootL; px<=rootR; px+=0.2){ const py=va*(px-vh)*(px-vh)+vk; midPath += `L ${g.toX(px)} ${g.toY(py)} `; }
      midPath += `L ${g.toX(rootR)} ${g.toY(0)} Z`;
      const insideColor = vk<0 ? BAD : GOOD;
      const outsideColor = vk<0 ? GOOD : BAD;
      const insideLabel = vk<0 ? 'negative' : 'positive';
      const outsideLabel = vk<0 ? 'positive' : 'negative';
      s += `<path d="${midPath}" fill="${insideColor}" opacity="0.25" stroke="none"/>`;
      s += `<circle cx="${g.toX(rootL)}" cy="${g.toY(0)}" r="4" fill="${ACCENT}"/>`;
      s += `<circle cx="${g.toX(rootR)}" cy="${g.toY(0)}" r="4" fill="${ACCENT}"/>`;
      s += `<text x="${g.toX(vh)-14}" y="${g.toY(vk)-8}" fill="${insideColor}" font-size="11" font-family="sans-serif">${insideLabel}</text>`;
      s += `<text x="20" y="20" fill="${outsideColor}" font-size="11" font-family="sans-serif">${outsideLabel}</text>`;
      s += `<text x="${g.size-90}" y="20" fill="${outsideColor}" font-size="11" font-family="sans-serif">${outsideLabel}</text>`;
    }
    return svgWrap(s, `0 0 ${g.size} ${g.size}`);
  }
  const range=10; const g = gridBase(range);
  let s = g.s; let path='';
  for(let px=-range; px<=range; px+=0.4){
    const py = a*(px-h)*(px-h)+k;
    if(Math.abs(py)>range) continue;
    const cmd = path===''?'M':'L';
    path += `${cmd} ${g.toX(px)} ${g.toY(py)} `;
  }
  s += `<path d="${path}" fill="none" stroke="${STROKE}" stroke-width="2.5"/>`;
  s += `<circle cx="${g.toX(h)}" cy="${g.toY(k)}" r="5" fill="${ACCENT}"/>`;
  s += `<text x="${g.toX(h)+8}" y="${g.toY(k)-8}" fill="${TXT}" font-size="12" font-family="sans-serif">vertex (${h},${k})</text>`;
  return svgWrap(s, `0 0 ${g.size} ${g.size}`);
}

function scatterDiagram(payload){
  const strong = payload.includes('strong');
  const positive = !payload.includes('negative');
  const size=300, pad=30;
  let s = `<line x1="${pad}" y1="${size-pad}" x2="${size-pad}" y2="${size-pad}" stroke="${DIM}" stroke-width="1.5"/>`;
  s += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${size-pad}" stroke="${DIM}" stroke-width="1.5"/>`;
  const offsets = strong ? [-7,5,-4,8,-6,3,0,6,-5,7,-3,4,-8,2] : [-30,22,-18,34,-26,12,4,28,-20,31,-10,18,-35,8];
  for(let i=0;i<14;i++){
    const x = pad + (i+0.7)*((size-2*pad)/14);
    const noise = offsets[i];
    const y = positive ? (size-pad) - ((x-pad)*0.8 + noise + 20) : pad + ((x-pad)*0.8 + noise + 20);
    s += `<circle cx="${x}" cy="${Math.max(pad,Math.min(size-pad,y))}" r="4" fill="${ACCENT}"/>`;
  }
  return svgWrap(s, `0 0 ${size} ${size}`);
}

// areaModelDiagram: draws a REAL 2x2 area-model rectangle for a binomial
// product (a+b)(c+d), with each region labeled by its actual area (x^2, 4x,
// 2x, 8, ...) and each side labeled with its actual term (x, 4 / x, 2), plus
// a caption showing the combined total (e.g. x^2+6x+8).
//
// Standardized payload format: "areamodel:a,b,c,d" meaning (a+b)(c+d), where
// each of a/b/c/d is a bare term like "x", "-x", "3x", "4", or "-4".
//   Example: "areamodel:x,4,x,2"  -> (x+4)(x+2)
// Legacy format "areamodel:(x+4)(x+2)" (parenthesized binomials) is also
// still accepted and parsed into the same four terms.
function parseAreaTerm(raw){
  const t = String(raw).trim().replace(/\s+/g,'');
  if(t==='x') return {coef:1, isX:true};
  if(t==='-x') return {coef:-1, isX:true};
  const mx = t.match(/^(-?\d*)x$/);
  if(mx){
    let c = mx[1];
    if(c===''||c==='+') c=1; else if(c==='-') c=-1; else c=parseFloat(c);
    return {coef:c, isX:true};
  }
  const n = parseFloat(t);
  return {coef: isNaN(n)?0:n, isX:false};
}
function areaTermLabel(p){
  if(p.isX){
    if(p.coef===1) return 'x';
    if(p.coef===-1) return '-x';
    return p.coef+'x';
  }
  return String(p.coef);
}
function areaCellLabel(pa,pb){
  const coef = pa.coef*pb.coef;
  const deg = (pa.isX?1:0)+(pb.isX?1:0);
  const suffix = deg===2 ? 'x²' : deg===1 ? 'x' : '';
  let coefStr;
  if(suffix){
    coefStr = coef===1?'':coef===-1?'-':String(coef);
  } else {
    coefStr = String(coef);
  }
  return { coef, deg, label: coefStr+suffix };
}
function splitBinomialText(s){
  s = s.replace(/\s+/g,'');
  const m = s.match(/^(-?[^+-]+)([+-].+)$/);
  if(!m) return [s, '0'];
  let first = m[1], second = m[2];
  if(second[0]==='+') second = second.slice(1);
  return [first, second];
}
function areaModelDiagram(payload){
  let terms = null;
  const legacy = payload.match(/^\(([^)]+)\)\(([^)]+)\)$/);
  if(legacy){
    terms = [...splitBinomialText(legacy[1]), ...splitBinomialText(legacy[2])];
  } else {
    const parts = payload.split(',').map(x=>x.trim()).filter(Boolean);
    if(parts.length>=4) terms = parts.slice(0,4);
  }
  if(!terms) terms = ['x','4','x','2']; // safe fallback: (x+4)(x+2)

  const rowTerms = [parseAreaTerm(terms[0]), parseAreaTerm(terms[1])]; // first factor -> rows
  const colTerms = [parseAreaTerm(terms[2]), parseAreaTerm(terms[3])]; // second factor -> columns

  const sizeFor = p => p.isX ? 110 : Math.max(30, Math.min(90, Math.abs(p.coef)*14+24));
  const colWidths = colTerms.map(sizeFor);
  const rowHeights = rowTerms.map(sizeFor);

  const x0 = 70, y0 = 46;
  const colX = [x0, x0+colWidths[0]];
  const rowY = [y0, y0+rowHeights[0]];
  const gridW = colWidths[0]+colWidths[1];
  const gridH = rowHeights[0]+rowHeights[1];

  const cells = [];
  for(let r=0;r<2;r++){
    for(let c=0;c<2;c++){
      cells.push({ r, c, cell: areaCellLabel(rowTerms[r], colTerms[c]) });
    }
  }

  const cellColors = [STROKE, ACCENT, ACCENT, GOOD];
  let s = '';
  // outer border
  s += `<rect x="${x0}" y="${y0}" width="${gridW}" height="${gridH}" fill="none" stroke="${TXT}" stroke-width="1"/>`;
  cells.forEach(({r,c,cell}, i)=>{
    const cx = colX[c], cy = rowY[r];
    const cw = colWidths[c], ch = rowHeights[r];
    s += `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="${cellColors[i]}" opacity="0.16" stroke="${cellColors[i]}" stroke-width="1.5"/>`;
    s += `<text x="${cx+cw/2}" y="${cy+ch/2+5}" fill="${TXT}" font-size="15" text-anchor="middle" font-family="sans-serif">${cell.label}</text>`;
  });

  // column (top) labels — terms of the second factor
  colTerms.forEach((p,c)=>{
    s += `<text x="${colX[c]+colWidths[c]/2}" y="${y0-10}" fill="${ACCENT}" font-size="14" text-anchor="middle" font-family="sans-serif">${areaTermLabel(p)}</text>`;
  });
  // row (left) labels — terms of the first factor
  rowTerms.forEach((p,r)=>{
    s += `<text x="${x0-14}" y="${rowY[r]+rowHeights[r]/2+5}" fill="${ACCENT}" font-size="14" text-anchor="end" font-family="sans-serif">${areaTermLabel(p)}</text>`;
  });

  // factor expressions along the outer edges
  const factor1 = `${areaTermLabel(rowTerms[0])}${rowTerms[1].coef<0?'':'+'}${areaTermLabel(rowTerms[1])}`;
  const factor2 = `${areaTermLabel(colTerms[0])}${colTerms[1].coef<0?'':'+'}${areaTermLabel(colTerms[1])}`;
  s += `<text x="${x0+gridW/2}" y="18" fill="${TXT}" font-size="13" text-anchor="middle" font-family="sans-serif">(${factor2})</text>`;
  s += `<text x="16" y="${y0+gridH/2+5}" fill="${TXT}" font-size="13" text-anchor="middle" font-family="sans-serif" transform="rotate(-90 16 ${y0+gridH/2+5})">(${factor1})</text>`;

  // combine like-degree terms into the total polynomial caption
  const totals = {2:0, 1:0, 0:0};
  cells.forEach(({cell})=>{ totals[cell.deg] += cell.coef; });
  let expr = '';
  [2,1,0].forEach(deg=>{
    const coef = totals[deg];
    if(coef===0 && !(deg===0 && expr==='')) return;
    const suffix = deg===2?'x²':deg===1?'x':'';
    let piece;
    if(suffix){
      const mag = Math.abs(coef);
      piece = (mag===1?'':String(mag))+suffix;
    } else {
      piece = String(Math.abs(coef));
    }
    if(expr===''){
      expr = (coef<0?'-':'')+piece;
    } else {
      expr += (coef<0?' - ':' + ')+piece;
    }
  });
  if(expr==='') expr='0';

  const h = y0+gridH+56;
  s += `<text x="${x0+gridW/2}" y="${y0+gridH+30}" fill="${GOOD}" font-size="14" text-anchor="middle" font-family="sans-serif">Total area = ${expr}</text>`;
  return svgWrap(s, `0 0 ${x0+gridW+40} ${h}`, 220);
}

// twoWayTableDiagram: renders a REAL two-way frequency table with actual
// row/column labels, cell counts, and computed row/column/grand totals.
//
// Payload format (semicolon-separated fields, order doesn't matter):
//   "rows=RowLabel1,RowLabel2;cols=ColLabel1,ColLabel2;data=r1c1,r1c2,r2c1,r2c2"
// - rows: comma-separated row category labels
// - cols: comma-separated column category labels
// - data: comma-separated cell counts in row-major order
//         (row1col1, row1col2, ..., row2col1, row2col2, ...)
// Example: "twowaytable:rows=Freshmen,Sophomores;cols=Job,No Job;data=18,62,32,38"
function twoWayTableDiagram(payload){
  const w=340, h=220;

  const fields = {};
  payload.split(';').forEach(part=>{
    const eq = part.indexOf('=');
    if(eq===-1) return;
    fields[part.slice(0,eq).trim()] = part.slice(eq+1).trim();
  });

  const rows = fields.rows ? fields.rows.split(',').map(x=>x.trim()) : ['Row 1','Row 2'];
  const cols = fields.cols ? fields.cols.split(',').map(x=>x.trim()) : ['Col 1','Col 2'];
  const nums = fields.data ? fields.data.split(',').map(x=>parseFloat(x.trim())) : [0,0,0,0];

  const nRows = rows.length, nCols = cols.length;
  // Build the data grid (nRows x nCols) from the flat row-major list.
  const grid = [];
  for(let r=0;r<nRows;r++){
    const row = [];
    for(let c=0;c<nCols;c++) row.push(nums[r*nCols+c] || 0);
    grid.push(row);
  }
  const rowTotals = grid.map(row => row.reduce((a,b)=>a+b,0));
  const colTotals = cols.map((_,c) => grid.reduce((sum,row)=>sum+row[c],0));
  const grandTotal = rowTotals.reduce((a,b)=>a+b,0);

  // Layout: label column + one column per category + totals column,
  // and header row + one row per category + totals row.
  const labelColW = 100, totalColW = 70;
  const dataColW = (w-20-labelColW-totalColW)/nCols;
  const headerRowH = 30, dataRowH = 34, totalRowH = 34;
  const x0 = 10, y0 = 10;
  const colX = i => x0 + labelColW + i*dataColW;
  const totalX = x0 + labelColW + nCols*dataColW;
  const rowY = i => y0 + headerRowH + i*dataRowH;
  const totalRowY = y0 + headerRowH + nRows*dataRowH;
  const tableW = labelColW + nCols*dataColW + totalColW;
  const tableH = headerRowH + nRows*dataRowH + totalRowH;

  let s = '';
  s += `<rect x="${x0}" y="${y0}" width="${tableW}" height="${tableH}" fill="none" stroke="${DIM}" stroke-width="1.5"/>`;
  // vertical lines
  s += `<line x1="${x0+labelColW}" y1="${y0}" x2="${x0+labelColW}" y2="${y0+tableH}" stroke="${DIM}" stroke-width="1"/>`;
  for(let c=1;c<nCols;c++) s += `<line x1="${colX(c)}" y1="${y0}" x2="${colX(c)}" y2="${y0+tableH}" stroke="${DIM}" stroke-width="1"/>`;
  s += `<line x1="${totalX}" y1="${y0}" x2="${totalX}" y2="${y0+tableH}" stroke="${DIM}" stroke-width="1"/>`;
  // horizontal lines
  s += `<line x1="${x0}" y1="${y0+headerRowH}" x2="${x0+tableW}" y2="${y0+headerRowH}" stroke="${DIM}" stroke-width="1"/>`;
  for(let r=1;r<nRows;r++) s += `<line x1="${x0}" y1="${rowY(r)}" x2="${x0+tableW}" y2="${rowY(r)}" stroke="${DIM}" stroke-width="1"/>`;
  s += `<line x1="${x0}" y1="${totalRowY}" x2="${x0+tableW}" y2="${totalRowY}" stroke="${DIM}" stroke-width="1"/>`;

  // header labels
  cols.forEach((label,c)=>{
    s += `<text x="${colX(c)+dataColW/2}" y="${y0+headerRowH/2+4}" fill="${ACCENT}" font-size="11" text-anchor="middle" font-family="sans-serif">${label}</text>`;
  });
  s += `<text x="${totalX+totalColW/2}" y="${y0+headerRowH/2+4}" fill="${ACCENT}" font-size="11" text-anchor="middle" font-family="sans-serif">Total</text>`;

  // row labels + cell values
  rows.forEach((label,r)=>{
    s += `<text x="${x0+8}" y="${rowY(r)+dataRowH/2+4}" fill="${ACCENT}" font-size="11" font-family="sans-serif">${label}</text>`;
    grid[r].forEach((val,c)=>{
      s += `<text x="${colX(c)+dataColW/2}" y="${rowY(r)+dataRowH/2+4}" fill="${TXT}" font-size="13" text-anchor="middle" font-family="sans-serif">${val}</text>`;
    });
    s += `<text x="${totalX+totalColW/2}" y="${rowY(r)+dataRowH/2+4}" fill="${GOOD}" font-size="13" text-anchor="middle" font-family="sans-serif">${rowTotals[r]}</text>`;
  });

  // column totals row + grand total
  s += `<text x="${x0+8}" y="${totalRowY+totalRowH/2+4}" fill="${ACCENT}" font-size="11" font-family="sans-serif">Total</text>`;
  colTotals.forEach((val,c)=>{
    s += `<text x="${colX(c)+dataColW/2}" y="${totalRowY+totalRowH/2+4}" fill="${GOOD}" font-size="13" text-anchor="middle" font-family="sans-serif">${val}</text>`;
  });
  s += `<text x="${totalX+totalColW/2}" y="${totalRowY+totalRowH/2+4}" fill="${ACCENT}" font-size="13" text-anchor="middle" font-family="sans-serif">${grandTotal}</text>`;

  return svgWrap(s, `0 0 ${w} ${h}`, 190);
}

function fallbackDiagram(code){
  return svgWrap(`<text x="150" y="150" fill="${TXT}" font-size="14" text-anchor="middle" font-family="sans-serif">${code}</text>`, `0 0 300 300`);
}


function renderDiagram(code){
  if(!code) return '';
  const idx = code.indexOf(':');
  const prefix = idx===-1?code:code.slice(0,idx);
  const payload = idx===-1?'':code.slice(idx+1);
  try{
    if(prefix==='coordgrid') return coordGrid(payload);
    if(prefix==='numberline') return numberlineDiagram(payload);
    if(prefix==='slopetriangle') return slopeTriangleDiagram(payload);
    if(prefix==='expgrowth') return expDiagram(payload);
    if(prefix==='parabola') return parabolaDiagram(payload);
    if(prefix==='scatter') return scatterDiagram(payload);
    if(prefix==='areamodel') return areaModelDiagram(payload);
    if(prefix==='twowaytable') return twoWayTableDiagram(payload);
    return fallbackDiagram(code);
  }catch(e){
    return fallbackDiagram(code);
  }
}

function testItem(item, tier, idx, areaId){
  const uid = `${areaId}-${tier}-${idx}`;
  return `<div class="testitem" id="ti-${uid}">
    <div class="ti-q"><b>Q${idx+1}.</b> ${esc(item.q)}</div>
    ${item.diagram?`<div class="ti-diagram">${renderDiagram(item.diagram)}</div>`:''}
    <button class="reveal-btn" onclick="revealAnswer('${uid}')">Reveal Answer</button>
    <div class="ti-a" id="ta-${uid}" style="display:none"><b>Answer:</b> ${esc(item.a)}
      ${item.explain?`<p style="margin-top:6px"><b>Why:</b> ${esc(item.explain)}</p>`:''}
      <div class="fixthis">Missed it? <a href="#/area/${areaId}/blueprint">FIX THIS → Back to Blueprint</a></div>

}

function renderTestMe(a){
  const tiers = ['foundation','proficient','advanced','honors'];
  const tierLabels = {foundation:'FOUNDATION',proficient:'PROFICIENT',advanced:'ADVANCED',honors:'HONORS'};
  const sections = tiers.map(t => `<div class="tier-section">
    <h3>${tierLabels[t]}</h3>
    ${a.testMe[t].map((item,i)=>testItem(item,t,i,a.id)).join('')}
  </div>`).join('');
  return `<div class="page">
  <h2>${a.area} — Test Me</h2>
  <p class="hint">Work each tier, then reveal to check. Every answer includes a "Why" explanation, not just the final number. Missed one? Use FIX THIS to jump straight back to the exact Blueprint concept.</p>
  ${sections}
  </div>`;
}

function renderHonorsLayer(a){
  const items = a.honorsLayer.items.map((h,i)=>{
    const uid = `${a.id}-honors-${i}`;
    return `<div class="testitem">
      <div class="ti-q"><b>Honors Prompt ${i+1}.</b> ${esc(h.prompt)}</div>
      <button class="reveal-btn" onclick="revealAnswer('${uid}')">Reveal Response</button>
      <div class="ti-a" id="ta-${uid}" style="display:none">${esc(h.response)}</div>
    </div>`;
  }).join('');
  return `<div class="page">
  <h2>${a.area} — Honors Layer <span class="pagebadge">Why · What-If · Prove · Generalize · Defend</span></h2>

  <div class="cs-page"><h3>Honors Prompts</h3>${items}</div>
  </div>`;
}

function flipCard(inner){
  const card = inner.parentElement;
  card.classList.toggle('flipped');
  inner.setAttribute('aria-pressed', card.classList.contains('flipped') ? 'true' : 'false');
}

function revealAnswer(uid){
  const el = document.getElementById('ta-'+uid);
  if(el) el.style.display = el.style.display==='none' ? 'block' : 'none';
}

function copyTutorPrompt(areaId, btn){
  const a = AREAS.find(x => x.id === areaId);
  if(!a) return;
  const text = a.khanmigoPrompt;
  const status = btn ? btn.nextElementSibling : null;
  const done = () => { if(status){ status.textContent='COPIED'; setTimeout(()=>status.textContent='',1800); } };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta=document.createElement('textarea');
  ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ if(document.execCommand('copy')) done(); }catch(e){}
  document.body.removeChild(ta);
}

function route(){
  const hash = (!location.hash || location.hash==='#/' || location.hash==='#') ? '#/home' : location.hash;
  const parts = hash.replace('#/','').split('/');
  const app = document.getElementById('app');
  if(parts[0]==='cover' || hash==='#/' || hash===''){ app.innerHTML = renderCover(); return; }
  if(parts[0]==='how'){ app.innerHTML = navBar()+renderHow(); window.scrollTo(0,0); return; }
  if(parts[0]==='home'){ app.innerHTML = navBar()+renderHome(); window.scrollTo(0,0); return; }
  if(parts[0]==='backmatter'){ app.innerHTML = navBar()+renderBackmatter(); window.scrollTo(0,0); return; }
  if(parts[0]==='area'){
    const a = findArea(parts[1]);
    if(!a){ app.innerHTML = navBar()+'<div class="page">Area not found. <a href="#/home">Go Home</a></div>'; return; }
    const tab = parts[2]||'cheatsheet';
    let body = '';
    if(tab==='cheatsheet') body = renderCheatSheet(a);
    else if(tab==='blueprint') body = renderBlueprint(a);
    else if(tab==='flashcards') body = renderFlashcards(a);
    else if(tab==='testme') body = renderTestMe(a);
    else if(tab==='honors') body = renderHonorsLayer(a);
    else if(tab==='interactive') body = renderInteractive(a);
    app.innerHTML = navBar(a.id, tab) + `<div class="area-tabbar">
      <a href="#/area/${a.id}/cheatsheet" class="${tab==='cheatsheet'?'on':''}">⚡ Cheat Sheet</a>
      <a href="#/area/${a.id}/blueprint" class="${tab==='blueprint'?'on':''}">🧭 Blueprint</a>
      <a href="#/area/${a.id}/flashcards" class="${tab==='flashcards'?'on':''}">🗂️ Flashcards</a>
      <a href="#/area/${a.id}/testme" class="${tab==='testme'?'on':''}">✅ Test Me</a>
      <a href="#/area/${a.id}/honors" class="${tab==='honors'?'on':''}">🎓 Honors Layer</a>
      <a href="#/area/${a.id}/interactive" class="${tab==='interactive'?'on':''}">🎬 Interactive</a>
    </div>` + body;
    window.scrollTo(0,0);
    return;
  }
  app.innerHTML = navBar()+renderHome();
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

: adding or subtracting a quantity, or multiplying or dividing by a nonzero number, preserves the solution set.","L_solving-equations_w":"Each inverse operation undoes one layer of what was done to x, in reverse order — like taking off your shoes before your socks.","L_linear-equations_p":"A nonvertical line has a constant rate of change: every time x increases by 1, y changes by the same amount — the slope m. A vertical line has undefined slope and is not y as a function of x.","L_linear-equations_w":"For a nonvertical line, any two distinct points give the same slope, and one point plus that slope determines the entire line.","L_linear-absvalue-functions_p":"|x| means the distance from zero, so it is never negative. Its graph is a V that turns at the vertex.","L_linear-absvalue-functions_w":"In y = a|x − h| + k, a change inside the absolute value moves the graph left or right (opposite the sign), and a change outside moves it up or down (same sign).","L_systems-equations_p":"A solution of a system makes every equation true at the same time — a common point of all its graphs. The graphs may intersect once, coincide, or have no common point.","L_systems-equations_w":"If two expressions are equal to the same quantity, they are equal to each other. Substitution and elimination are two ways to use that fact to remove one variable.","L_exponents-exponential_p":"Positive integer exponents count repeated factors: xᵃ · xᵇ has a factors of x followed by b more, giving xᵃ⁺ᵇ. Zero, negative and fractional exponents extend this pattern with the appropriate domain restrictions.","L_exponents-exponential_w":"Counting factors explains positive integer exponent rules. Requiring consistent nonzero-base rules gives zero and negative powers; fractional powers use roots with real-domain restrictions. Exponential growth multiplies by the same positive factor at every step.","L_polynomials-factoring_p":"Factoring is multiplication run backward — it is the distributive property read from right to left.","L_polynomials-factoring_w":"When a · c splits into two numbers whose product is a · c and whose sum is b, you can split the middle term and group, which reveals the common binomial factor.","L_quadratic-functions_p":"The graph of a quadratic is a parabola, which is symmetric about a vertical line through its vertex.","L_quadratic-functions_w":"For y = ax² + bx + c with a ≠ 0, the line of symmetry is x = −b/(2a): inputs equally far to its left and right give the same output. Substitute that x to find the vertex height.","L_solving-quadratics_p":"If a product equals zero, then at least one of its factors must equal zero. This is the Zero Product Property.","L_solving-quadratics_w":"Every method — factoring, square roots, completing the square, and the quadratic formula — rewrites the equation so this property (or a square root) can finish the job. The discriminant b² − 4ac tells you how many real solutions to expect before you start.","L_working-with-functions_p":"A function assigns exactly one output to each input.","L_working-with-functions_w":"Each domain input has exactly one output, so evaluation is unambiguous. Composition is defined only when the inner output is in the outer function's domain. A single-valued inverse exists on the range only for a one-to-one function; otherwise restrict the domain before reversing it.","L_analyzing-data_p":"Data has a center, a spread, and a shape. Residuals help judge fit; a useful model must also respect context, assumptions and the limits of its data. A close fit alone does not establish causation or reliable extrapolation.","L_analyzing-data_w":"The mean is the balance point of the data, the median splits the data in half, and a residual (actual − predicted) measures how far a prediction misses."},"es":{"_name":"Español","hub_title":"Centro de Dominio Byrdway","hub_sub":"Diagnosticar → Recetar → Aprender desde los primeros principios → Demostrar dominio en los Exámenes EOC.","lang_label":"Idioma","lang_not ":"Halla la altura del vértice","op_zeros":"Halla los ceros","op_discrim":"Usa el discriminante para contar soluciones","op_factor":"Factoriza","op_zeroprod":"Iguala cada factor a cero","op_solveeach":"Resuelve cada ecuación","op_inner":"Evalúa primero la función de adentro","op_outer":"Pasa ese resultado a la función de afuera","op_swap":"Intercambia x y y","op_mean":"Halla la media","op_median":"Halla la mediana","op_compare":"Compara: el valor atípico jala la media","op_residual":"Halla el residuo: real − predicho","L_solving-equations_p":"Una ecuación es una balanza. Lo que hagas en un lado, debes hacerlo en el otro, así la solución nunca cambia.","L_solving-equations_w":"Cada operación inversa deshace una capa de lo que se le hizo a x, en orden inverso, como quitarte los zapatos antes que los calcetines.","L_linear-equations_p":"Una recta tiene una razón de cambio constante: cada vez que x aumenta 1, y cambia la misma cantidad: la pendiente m.","L_linear-equations_w":"Como la razón nunca cambia, cualquier par de puntos de la recta da la misma pendiente, y un punto más la pendiente determinan toda la recta.","L_linear-absvalue-functions_p":"|x| significa la distancia a cero, así que nunca es negativo. Su gráfica es una V que gira en el vértice.","L_linear-absvalue-functions_w":"En y = a|x − h| + k, un cambio dentro del valor absoluto mueve la gráfica a la izquierda o a la derecha (signo contrario), y un cambio afuera la mueve hacia arriba o hacia abajo (mismo signo).","L_systems-equations_p":"Una solución de un sistema es un punto que hace verdaderas todas las ecuaciones al mismo tiempo: el punto donde se cruzan las gráficas.","L_systems-equations_w":"Si dos expresiones son iguales a la misma cantidad, son iguales entre sí. La sustitución y la eliminación son dos maneras de usar ese hecho para quitar una variable.","L_exponents-exponential_p":"Un exponente cuenta una multiplicación repetida: xᵃ · xᵇ son a factores de x seguidos de b más, es decir, xᵃ⁺ᵇ.","L_exponents-exponential_w":"Cada regla de exponentes viene de contar factores. El crecimiento exponencial es la misma idea en el tiempo: multiplicar por el mismo factor en cada paso.","L_polynomials-factoring_p":"Factorizar es multiplicar al revés: es la propiedad distributiva leída de derecha a izquierda.","L_polynomials-factoring_w":"Cuando a · c se separa en dos números cuyo producto es a · c y cuya suma es b, puedes separar el término del medio y agrupar, lo que revela el binomio común.","L_quadratic-functions_p":"La gráfica de una cuadrática es una parábola, simétrica respecto a una recta vertical que pasa por su vértice.","L_quadratic-functions_w":"Para y = ax² + bx + c, el eje de simetría es x = −b/(2a), porque las entradas a la misma distancia a la izquierda y a la derecha dan la misma salida. Sustituye esa x para hallar la altura del vértice.","L_solving-quadratics_p":"Si un producto es igual a cero, al menos uno de sus factores debe ser igual a cero. Esta es la Propiedad del Producto Cero.","L_solving-quadratics_w":"Cada método (factorizar, raíces cuadradas, completar el cuadrado y la fórmula cuadrática) reescribe la ecuación para que esta propiedad (o una raíz cuadrada) termine el trabajo. El discriminante b² − 4ac te dice cuántas soluciones reales esperar antes de empezar.","L_working-with-functions_p":"Una función asigna exactamente una salida a cada entrada.","L_working-with-functions_w":"Como cada entrada tiene una sola salida, puedes evaluar una función, componer funciones pasando una salida a otra función e invertir una función con su inversa, sin ambigüedad.","L_analyzing-data_p":"Los datos tienen un centro, una dispersión y una forma. Un modelo es tan bueno como sus residuos.","L_analyzing-data_w":"La media es el punto de equilibrio de los datos, la mediana los divide por la mitad, y un residuo (real − predicho) mide cuánto falla una predicción."},"zh":{"_name":"中文 (简体)","hub_title":"Byrdway 精通中心","hub_sub":"诊断 → 制定方案 → 从第一性原理学习 → 在 EOC 检测中证明掌握。","lang_ vey":"解出 y","op_vertex":"读出顶点","op_direction":"判断开口方向","op_setzero":"令 y = 0","op_twocases":"分成两种情况","op_addeq":"两式相加，消去 y","op_substitute":"代回求值","op_power":"幂的乘方：指数相乘","op_product":"同底数幂相乘：指数相加","op_growth":"增长：每一步乘以同一个因子","op_findac":"求 a · c，并找出和为 b 的一对数","op_split":"拆分中间项","op_group":"分组并分别提取公因式","op_commonbin":"提取公共二项式","op_axis":"求对称轴","op_height":"求顶点的高度","op_zeros":"求零点","op_discrim":"用判别式判断解的个数","op_factor":"因式分解","op_zeroprod":"令每个因式等于零","op_solveeach":"分别解每个方程","op_inner":"先求内层函数的值","op_outer":"把这个输出代入外层函数","op_swap":"交换 x 和 y","op_mean":"求平均数","op_median":"求中位数","op_compare":"比较：异常值会拉动平均数","op_residual":"求残差：实际值 − 预测值","L_solving-equations_p":"方程就像一架天平。你对一边做什么，就必须对另一边做同样的事，所以解永远不会改变。","L_solving-equations_w":"每一个逆运算都按相反的顺序撤销对 x 所做的一层运算——就像先脱鞋，再脱袜子。","L_linear-equations_p":"直线的变化率是恒定的：x 每增加 1，y 都改变同样的量——这就是斜率 m。","L_linear-equations_w":"因为变化率永远不变，直线上任意两点算出的斜率都相同；一个点加上斜率就能确定整条直线。","L_linear-absvalue-functions_p":"|x| 表示到零的距离，所以它永远不是负数。它的图像是一个在顶点处转折的 V 形。","L_linear-absvalue-functions_w":"在 y = a|x − h| + k 中，绝对值里面的变化使图像左右移动（方向与符号相反），绝对值外面的变化使图像上下移动（方向与符号相同）。","L_systems-equations_p":"方程组的解是同时使每个方程都成立的点——也就是图像相交的点。","L_systems-equations_w":"如果两个式子等于同一个量，那么它们彼此相等。代入法和消元法是利用这一事实消去一个变量的两种方法。","L_exponents-exponential_p":"指数表示重复相乘：xᵃ · xᵇ 是先有 a 个 x 相乘，再乘 b 个，所以等于 xᵃ⁺ᵇ。","L_exponents-exponential_w":"每一条指数法则都来自数因子的个数。指数增长是同一个道理在时间上的体现：每一步都乘以同一个因子。","L_polynomials-factoring_p":"因式分解就是倒过来的乘法——把分配律从右往左读。","L_polynomials-factoring_w":"当 a · c 可以拆成两个数，它们的积是 a · c、和是 b 时，就可以拆分中间项并分组，从而露出公共的二项式因式。","L_quadratic-functions_p":"二次函数的图像是抛物线，它关于经过顶点的一条竖直直线对称。","L_quadratic-functions_w":"对于 y = ax² + bx + c，对称轴是 x = −b/(2a)，因为在它左右距离相等的输入会得到相同的输出。把这个 x 代入即可求出顶点的高度。","L_solving-quadratics_p":"如果一个乘积等于零，那么至少有一个因式等于零。这就是零积性质。","L_solving-quadratics_w":"每一种方法——因式分解、开平方、配方法和求根公式——都是把方程改写，好让这个性质（或开平方）来完成求解。判别式 b² − 4ac 能在开始前告诉你会有几个实数解。","L_working-with-functions_p":"函数为每一个输入指定恰好一个输出。","L_working-with-functions_w":"因为每个输入只有一个输出，你可以求函数值、把一个函数的输出代入另一个函数进行复合，还可以用反函数把函数倒过来——都不会产生歧义。","L ons_w":"यदि दो व्यंजक एक ही राशि के बराबर हैं, तो वे आपस में बराबर हैं। प्रतिस्थापन और विलोपन इसी तथ्य से एक चर हटाने के दो तरीके हैं।","L_exponents-exponential_p":"घातांक बार-बार के गुणा को गिनता है: xᵃ · xᵇ का अर्थ है x के a गुणनखंड और फिर b और, यानी xᵃ⁺ᵇ।","L_exponents-exponential_w":"घातांक का हर नियम गुणनखंड गिनने से आता है। चरघातांकी वृद्धि समय के साथ वही विचार है: हर चरण में समान गुणक से गुणा करना।","L_polynomials-factoring_p":"गुणनखंडन उल्टा गुणा है — यह वितरण गुण को दाएँ से बाएँ पढ़ना है।","L_polynomials-factoring_w":"जब a · c को ऐसी दो संख्याओं में तोड़ा जा सके जिनका गुणनफल a · c और योग b हो, तो आप बीच के पद को तोड़कर समूह बना सकते हैं, जिससे सामान्य द्विपद गुणनखंड सामने आ जाता है।","L_quadratic-functions_p":"द्विघात फलन का आलेख एक परवलय होता है, जो अपने शीर्ष से होकर जाने वाली ऊर्ध्वाधर रेखा के प्रति सममित होता है।","L_quadratic-functions_w":"y = ax² + bx + c के लिए सममिति रेखा x = −b/(2a) है, क्योंकि इसके बाएँ और दाएँ समान दूरी पर स्थित इनपुट समान आउटपुट देते हैं। शीर्ष की ऊँचाई जानने के लिए वही x रखें।","L_solving-quadratics_p":"यदि किसी गुणनफल का मान शून्य है, तो उसका कम से कम एक गुणनखंड शून्य होना चाहिए। यही शून्य गुणनफल गुण है।","L_solving-quadratics_w":"हर विधि — गुणनखंडन, वर्गमूल, वर्ग पूरा करना और द्विघात सूत्र — समीकरण को इस तरह फिर से लिखती है कि यह गुण (या वर्गमूल) काम पूरा कर दे। विविक्तकर b² − 4ac शुरू करने से पहले ही बता देता है कि कितने वास्तविक हल होंगे।","L_working-with-functions_p":"फलन हर इनपुट को ठीक एक आउटपुट देता है।","L_working-with-functions_w":"क्योंकि हर इनपुट का केवल एक आउटपुट होता है, आप फलन का मान निकाल सकते हैं, एक आउटपुट को दूसरे फलन में डालकर फलनों का संयोजन कर सकते हैं, और व्युत्क्रम से फलन को उलट सकते हैं — बिना किसी अस्पष्टता के।","L_analyzing-data_p":"आँकड़ों का एक केंद्र, एक फैलाव और एक आकार होता है। कोई मॉडल उतना ही अच्छा है जितने उसके अवशेष।","L_analyzing-data_w":"माध्य आँकड़ों का संतुलन बिंदु है, माध्यिका आँकड़ों को आधे में बाँटती है, और अवशेष (वास्तविक − अनुमानित) मापता है कि अनुमान कितना चूकता है।"},"ar":{"_name": ي نقطتين على المستقيم تعطيان الميل نفسه، ونقطة واحدة مع الميل تحددان المستقيم كله.","L_linear-absvalue-functions_p":"|x| تعني المسافة عن الصفر، لذا فهي ليست سالبة أبدًا. تمثيلها البياني على شكل V ينعطف عند الرأس.","L_linear-absvalue-functions_w":"في y = a|x − h| + k، التغيير داخل القيمة المطلقة يحرّك التمثيل يمينًا أو يسارًا (عكس الإشارة)، والتغيير خارجها يحرّكه إلى الأعلى أو الأسفل (مع الإشارة).","L_systems-equations_p":"حل النظام نقطة تجعل كل المعادلات صحيحة في الوقت نفسه — النقطة التي تتقاطع فيها التمثيلات البيانية.","L_systems-equations_w":"إذا كان تعبيران يساويان الكمية نفسها فهما متساويان. التعويض والحذف طريقتان لاستخدام هذه الحقيقة للتخلص من متغيّر.","L_exponents-exponential_p":"الأس يعدّ الضرب المتكرر: xᵃ · xᵇ تعني a عاملًا من x يتبعها b عاملًا آخر، أي xᵃ⁺ᵇ.","L_exponents-exponential_w":"كل قاعدة من قواعد الأسس تأتي من عدّ العوامل. والنمو الأسي هو الفكرة نفسها عبر الزمن: الضرب في العامل نفسه في كل خطوة.","L_polynomials-factoring_p":"التحليل إلى عوامل هو الضرب معكوسًا — إنه خاصية التوزيع مقروءة من اليمين إلى اليسار.","L_polynomials-factoring_w":"عندما يمكن تجزئة a · c إلى عددين حاصل ضربهما a · c ومجموعهما b، يمكنك تجزئة الحد الأوسط والتجميع، فيظهر العامل الثنائي المشترك.","L_quadratic-functions_p":"التمثيل البياني للدالة التربيعية قطع مكافئ متماثل حول مستقيم رأسي يمر برأسه.","L_quadratic-functions_w":"في y = ax² + bx + c يكون محور التماثل x = −b/(2a)، لأن المدخلات التي تبعد المسافة نفسها يمينه ويساره تعطي المخرجات نفسها. عوّض بقيمة x هذه لتجد ارتفاع الرأس.","L_solving-quadratics_p":"إذا كان حاصل ضرب يساوي صفرًا، فإن أحد عوامله على الأقل يساوي صفرًا. هذه هي خاصية الضرب الصفري.","L_solving-quadratics_w":"كل طريقة — التحليل، والجذور التربيعية، وإكمال المربع، والقانون العام — تعيد كتابة المعادلة لكي تُنهي هذه الخاصية (أو الجذر التربيعي) المهمة. والمميّز b² − 4ac يخبرك بعدد الحلول الحقيقية قبل أن تبدأ.","L_working-with-functions_p":"الدالة تربط كل مُدخل بمُخرج واحد بالضبط.","L_working-with-functions_w":"لأن لكل مُدخل مُخرجًا واحدًا فقط، يمكنك إيجاد قيمة الدالة، وتركيب الدوال بإدخال مُخرج دالة في دالة أخرى، وعكس الدالة بدالتها العكسية — دون أي التباس.","L_analyzing-data_p":"للبيانات مركز وانتشار وشكل. وجودة النموذج تساوي جودة بواقيه.","L_analyzing-data_w":"الوسط الحسابي نقطة توازن البيانات، والوسيط يقسمها نصفين، والباقي (الفعلي − المتوقَّع) يقيس مقدار ابتعاد التنبؤ."},"fr":{"_name":"Français","hub_title":"Centre de Maîtrise Byrdway","hub_sub":"Diagnostiquer → Prescrire → Apprendre à partir des premiers principes → Prouver sa maîtrise aux examens EOC.","lang_label":"Langue","lang_note":"Les mots changent dans ta langue. Les mathématiques ne changent jamais.","lang_disclaimer":"Les traductions aident à comprendre. Si une formulation n'est pas claire, demande à ton enseignant — les mathématiques restent toujours exactement les mêmes.","card_diag_t":"Test Diagnostique","card_diag_d":"20 questions sur les 10 domaines. Découvre exactement où tu en es.","card_plan_t":"Mon Plan Personnalisé","card_plan_d":"Tes domaines classés du plus faible au plus fort, avec l'étape suivante précise pour chacun.","card_learn_t":"Leçons des Premiers Principes","card_learn_d":"Un enseignement pas à pas qui part de la vérité fondamentale sur laquelle repose chaque thème.","card_eoc_t":"Examens EOC","card_eoc_d":"Cinq examens de fin de cours qui montent du DOK 2.5 jusqu'à la Maîtrise Extrême.","open":"Ouvrir","start":"Commencer","nav_hub":"Centre de Maîtrise","tab_learn":"Premiers Principes","back_hub":"← Retour au Centre de Maîtrise","q_of":"Question {n} sur {t}","prev":"← Précédente","next":"Suivante →","finish":"Terminer et noter","answered":"{n} sur {t} répondues","confirm_unanswered":"{n} question(s) sont encore sans réponse. Noter le test quand même ?","results":"Résultats","score":"Score","by_area":"Résultats par domaine","retake":"Recommencer","see_plan":"Voir mon plan personnalisé","review":"Revoir chaque question","your_answer":"Ta réponse","correct_answer":"Bonne réponse","solution":"Solution pas à pas","correct":"Correct","incorrect":"Pas e  après 3 ans ?","c1_12":"Une balle est lancée vers le haut. Sa hauteur en pieds après t secondes est donnée par la fonction. Quelle est la hauteur maximale de la balle ?","c1_15":"La droite d'ajustement entre les heures d'étude (x) et la note (y) est donnée. Un élève a étudié 6 heures et a obtenu 85. Quel est le résidu pour cet élève ?","c2_1":"Un élève a résolu l'équation comme indiqué. À quelle étape a-t-il fait sa première erreur ?","c2_2":"Pour quelle valeur de k l'équation n'a-t-elle aucune solution ?","c2_3":"La droite ℓ passe par les deux points donnés. Quel point est aussi sur la droite ℓ ?","c2_4":"Le tableau montre une relation linéaire. Quelle est la valeur manquante de y ?","c2_5":"Quelle fonction a exactement les mêmes abscisses à l'origine que g(x) ?","c2_6":"Pour quelles valeurs de a et b le système a-t-il une infinité de solutions ?","c2_7":"Un bateau parcourt 36 miles en descendant le courant en 2 heures. Le retour en remontant le courant prend 3 heures. Quelle est la vitesse du courant ?","c2_8":"Le compte A rapporte des intérêts simples et le compte B des intérêts composés, comme indiqué, où t est en années. Après combien d'années entières le compte B a-t-il pour la première fois plus d'argent que le compte A ?","c2_9":"Une quantité est modélisée par la fonction, où t est le temps. De quel pourcentage environ la quantité diminue-t-elle pour chaque 1 unité de t ?","c2_10":"(x + 3) est un facteur du polynôme. Quelle est la valeur de k ?","c2_11":"Une parabole a son sommet au premier point et passe par le second point. Quelle équation représente la parabole ?","c2_12":"La longueur d'un rectangle est égale au double de sa largeur plus 3. L'aire du rectangle est de 65 unités carrées. Quelle est la largeur ?","c2_13":"Pour quelles valeurs de x l'équation est-elle vraie ?","c2_14":"Quand on retire la valeur aberrante 60 de la série, de combien la moyenne diminue-t-elle ?","c2_15":"Un rectangle a une aire A et une largeur w, comme indiqué. Son périmètre est 48. Quelle est la valeur de x ?","c3_1":"Pour quelles valeurs de a l'inéquation a-t-elle la solution indiquée ?","c3_2":"Combien de nombres entiers sont solutions de l'inéquation ?","c3_3":"Les points A, B et C sont alignés. Quelle est la valeur de k ?","c3_4":"Les deux graphiques se coupent en deux points. Quelle est la somme des abscisses des points d'intersection ?","c3_5":"Pour combien de valeurs entières de x a-t-on f(x) > 0 ?","c3_6":"Pour quelle valeur de k le système n'a-t-il aucune solution ?","c3_7":"Quelle est l'aire de la région qui vérifie les deux inéquations ?","c3_9":"Une colonie de 150 bactéries double toutes les 20 minutes. Combien de temps faudra-t-il pour que la colonie atteigne 9,600 bactéries ?","c3_10":"Utilise les deux équations pour trouver la valeur de x.","c3_12":"Une parabole a les abscisses à l'origine indiquées et passe par le point donné. Quelle est son ordonnée à l'origine ?","c3_13":"Pour quelles valeurs de c l'équation a-t-elle deux solutions réelles distinctes ?","c3_15":"Dans un groupe de 120 élèves, 70 pratiquent un sport. Parmi les élèves qui ne pratiquent pas de sport, 20 ont un emploi à temps partiel. Quel pourcentage des élèves qui ne pratiquent pas de sport ont un emploi à temps partiel ?","c4_1":"Pour quelle valeur de k l'équation a-t-elle une infinité de solutions ?","c4_2":"Une droite passe par le point donné. Son abscisse à l'origine a et son ordonnée à l'origine b sont positives et égales. Combien vaut a + b ?","c4_3":"Pour quelles valeurs de m la droite coupe-t-elle le graphique en exactement deux points ?","c4_4":"Un chimiste mélange une solution acide à 20 % avec une solution acide à 50 % pour obtenir 60 litres d'une solution acide à 30 %. Combien de litres de la solution à 20 % sont utilisés ?","c4_5":"La quantité d'un médicament dans le corps diminue de moitié toutes les 6 heures. Un patient prend une dose de 200 mg toutes les 6 heures. Quelle quantité de médicament y a-t-il dans le corps juste après la 4e dose ?","c4_6":"Deux modèles prédisent la taille d'une population après t années. Quel est le plus petit nombre entier t pour lequel g(t) > f(t) ?","c4_8":"(x − 2) est un facteur de p(x). Quels sont tous les zéros de p(x) ?","c4_9":"Pour toute valeur de k, le sommet de cette parabole se trouve sur la même droite. Quelle est cette droite ?","c4_10":"Une solution de l'équation est x = 3. Quelle est l'autre solution ?","c4_11":"f est une fonction affine qui vérifie les conditions indiquées. Trouve la valeur.","c4_12":"Quelle fonction est la réciproque de h ?","c4_13":"Une série de données a la moyenne et l'écart type indiqués. Chaque valeur est multipliée par 3, puis augmentée de 5. Quels sont la nouvelle moyenne et le nouvel écart type ?","c4_14":"Une série de données compte 5 valeurs de moyenne 10. On ajoute la valeur 22 à la série. Quelle est la nouvelle moyenne ?","c4_15":"Deux compagnies de taxi facturent les montants indiqués, en dollars, pour un trajet de d miles. Pour quelles longueurs de trajet la compagnie A est-elle moins chère ?","c5_3":"Les deux droites sont perpendiculaires. Quelle est la valeur de k ?","c5_4":"Quelle est l'aire de la région délimitée par les deux graphiques ?","c5_5":"Pour quelle valeur de a le système n'a-t-il aucune solution ?","c5_8":"Quand on divise le polynôme par (x − 2), le reste est 7. Quelle est la valeur de k ?","c5_10":"Un agriculteur a 120 mètres de clôture pour construire un enclos rectangulaire le long d'un mur droit. Le mur forme un côté, donc seuls trois côtés ont besoin d'une clôture. Quelle est la plus grande aire possible de l'enclos ?","c5_11":"L'équation a exactement une solution réelle. Quelles sont toutes les valeurs possibles de k ?","c5_12":"Quelle est la somme des carrés de toutes les solutions réelles de l'équation ?","c5_14":"La fonction f vérifie la règle indiquée pour toute valeur de x. Trouve la valeur.","c5_15":"La moyenne de cinq notes est 80. Quand on retire la note la plus basse, la moyenne des quatre autres notes est 86. Quelle était la note la plus basse ?","op_distribute":"Développe (distributivité)","op_combine":"Regroupe les termes semblables","op_subboth":"Soustrais la même quantité des deux côtés","op_addboth":"Ajoute la même quantité des deux côtés","op_divboth":"Divise les deux côtés par le même nombre","op_slope":"Trouve la pente","op_pointslope":"Écris la forme point-pente","op_solvey":"Isole y","op_vertex":"Lis le sommet","op_direction":"Détermine dans quel sens il s'ouvre","op_setzero":"Pose y = 0","op_twocases":"Sépare en deux cas","op_addeq":"Additionne les équations pour éliminer y","op_substitute":"Remplace dans une équation","op_power":"Règle de la puissance : multiplie les exposants","op_product":"Règle du produit : additionne les exposants","op_growth":"Croissance : multiplie par le même facteur à chaque étape","op_findac":"Trouve a · c et la paire dont la somme est b","op_split":"Décompose le terme du milieu","op_group":"Regroupe et factorise chaque paire","op_commonbin":"Mets le binôme commun en facteur","op_axis":"Trouve l'axe de symétrie","op_height":"Trouve la hauteur du sommet","op_zeros":"Trouve les zéros","op_discrim":"Utilise le discriminant pour compter les solutions","op_factor":"Factorise","op_zeroprod":"Pose chaque facteur égal à zéro","op_solveeach":"Résous chaque équation","op_inner":"Calcule d'abord la fonction intérieure","op_outer":"Place ce résultat dans la fonction extérieure","op_swap":"Échange x et y","op_mean":"Trouve la moyenne","op_median":"Trouve la médiane","op_compare":"Compare : la valeur aberrante tire la moyenne","op_residual":"Trouve le résidu : réel − prédit","L_solving-equations_p":"Une équation est une balance. Tout ce que tu fais d'un côté, tu dois le faire de l'autre, donc la solution ne change jamais.","L_solving-equations_w":"Chaque opération inverse défait une couche de ce qui a été fait à x, dans l'ordre inverse — comme enlever ses chaussures avant ses chaussettes.","L_linear-equations_p":"Une droite a un taux de variation constant : chaque fois que x augmente de 1, y change de la même quantité — la pente m.","L_linear-equations_w":"Comme le taux ne change jamais, deux points quelconques de la droite donnent la même pente, et un point avec la pente détermine toute la droite.","L_linear-absvalue-functions_p":"|x| est la distance à zéro, donc elle n'est jamais négative. Son graphique est un V qui tourne au sommet.","L_linear-absvalue-functions_w":"Dans y = a|x − h| + k, un changement à l'intérieur de la valeur absolue déplace le graphique vers la gauche ou la droite (signe opposé), et un changement à l'extérieur le déplace vers le haut ou le bas (même signe).","L_systems-equations_p":"Une solution d'un système est un point qui rend toutes les équations vraies en même temps — le point où les graphiques se croisent.","L_systems-equations_w":"Si deux expressions sont égales à la même quantité, elles sont égales entre elles. La substitution et l'élimination sont deux façons d'utiliser ce fait pour supprimer une variable.","L_exponents-exponential_p":"Un exposant compte une multiplication répétée : xᵃ · xᵇ, c'est a facteurs x suivis de b autres, donc xᵃ⁺ᵇ.","L_exponents-exponential_w":"Chaque règle des exposants vient du comptage des facteurs. La croissance exponentielle est la même idée dans le temps : multiplier par le même facteur à chaque étape.","L_polynomials-factoring_p":"Factoriser, c'est multiplier à l'envers — c'est la distributivité lue de droite à gauche.","L_polynomials-factoring_w":"Quand a · c se décompose en deux nombres dont le produit est a · c et la somme est b, tu peux décomposer le terme du milieu et regrouper, ce qui fait apparaître le binôme commun.","L_quadratic-functions_p":"Le graphique d'une fonction du second degré est une parabole, symétrique par rapport à une droite verticale qui passe par son sommet.","L_quadratic-functions_w":"Pour y = ax² + bx + c, l'axe de symétrie est x = −b/(2a), car des entrées situées à la même distance à gauche et à droite donnent la même sortie. Remplace x par cette valeur pour trouver la hauteur du sommet.","L_solving-quadratics_p":"Si un produit est égal à zéro, alors au moins un de ses facteurs est égal à zéro. C'est la propriété du produit nul.","L_solving-quadratics_w":"Chaque méthode — factorisation, racines carrées, complétion du carré et formule quadratique — réécrit l'équation pour que cette propriété (ou une racine carrée) termine le travail. Le discriminant b² − 4ac t'indique combien de solutions réelles attendre avant de commencer.","L_working-with-functions_p":"Une fonction associe exactement une sortie à chaque entrée.","L_working-with-functions_w":"Comme chaque entrée n'a qu'une seule sortie, tu peux évaluer une fonction, composer des fonctions en plaçant une sortie dans une autre fonction, et inverser une fonction avec sa réciproque — sans ambiguïté.","L_analyzing-data_p":"Les données ont un centre, une dispersion et une forme. Un modèle ne vaut que ce que valent ses résidus.","L_analyzing-data_w":"La moyenne est le point d'équilibre des données, la médiane les coupe en deux, et un résidu (réel − prédit) mesure de combien une prédiction se trompe."},"pt":{"_name":"Português","hub_title":"Central de Domínio Byrdway","hub_sub":"Diagnosticar → Prescrever → Aprender pelos primeiros princípios → Provar domínio nos Exames EOC.","lang_label":"Idioma","lang_note":"As palavras mudam para o seu idioma. A matemática nunca muda.","lang_disclaimer":"As traduções ajudam na compreensão. Se alguma frase não estiver clara, pergunte ao seu professor — a matemática é sempre exatamente a mesma.","card_diag_t":"Teste Diagnóstico","card_diag_d":"20 questões das 10 áreas. Descubra exatamente onde você está.","card_plan_t":"Meu Plano Personalizado","card_plan_d":"Suas áreas da mais fraca para a mais forte, com o próximo passo exato para cada uma.","card_learn_t":"Aulas de Primeiros Princípios","card_learn_d":"Instrução passo a passo que começa pela verdade fundamental em que cada tema se a
