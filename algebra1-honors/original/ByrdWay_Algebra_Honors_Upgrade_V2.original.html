const BWM_COMPLETE_LESSONS = {"solving-equations":{"id":"solving-equations","title":"Solving Equations & Inequalities","language":"en","centralPrinciple":"An equation is a balance. Reversible operations on both sides preserve its solution set. An inequality orders numbers, so a negative scale reverses the order.","whyItWorks":["If A=B, adding c to each side gives A+c=B+c; subtracting c reverses the move. Multiplying by a nonzero c is also reversible. Multiplying by zero loses information.","If 2<5, then −2>−5. A negative scale reflects the number line, which explains the sign reversal. Adding a negative number only shifts both positions and never reverses order.","Absolute value measures distance: |u|=k has u=k or u=−k when k>0, one branch when k=0, and no branch when k<0."],"prerequisites":["Signed-number arithmetic","Distribution","Fractions and common denominators","Equality and order"],"representation":{"type":"numberline","description":"For −3x+6≤15, shade x≥−3: filled point at −3 and a ray to the right.","min":-6,"max":3,"boundary":-3,"closed":true,"direction":"right"},"originalWorkedExample":{"ex":"4(x − 2) + 3 = 2x + 15","steps":[["op_distribute","4x − 8 + 3 = 2x + 15"],["op_combine","4x − 5 = 2x + 15"],["op_subboth","4x − 2x − 5 = 2x − 2x + 15  →  2x − 5 = 15"],["op_addboth","2x − 5 + 5 = 15 + 5  →  2x = 20"],["op_divboth","2x ÷ 2 = 20 ÷ 2  →  x = 10"]],"check":"4(10 − 2) + 3 = 35   ✓   2(10) + 15 = 35","tq":"5(x + 1) − 2 = 3x + 11","ta":"x = 4","tw":["5x + 3 = 3x + 11","2x = 8","x = 4"]},"workedExample":{"prompt":"Clear fractions and solve x/2 + 1/3 = 5/6. Then solve −3x+6≤15.","steps":["The LCD is 6. Multiply EVERY term by 6: 3x+2=5.","Subtract 2, then divide by 3: x=1.","For the inequality subtract 6: −3x≤9. Divide by −3 and reverse: x≥−3."],"check":"x=1 gives 1/2+1/3=5/6. At x=−3 the inequality gives 15≤15; x=0 gives 6≤15, while x=−4 fails."},"guidedPractice":[{"prompt":"Solve 5(x+1)−2=3x+11.","answer":"x=4","explanation":"Distribute: 5x+3=3x+11. Subtract 3x and 3: 2x=8. Divide by 2. Check: both sides are 23.","hint":"Distribute into both terms first."},{"prompt":"Solve |2x−5|=7.","answer":"x=6 or x=−1","explanation":"2x−5=7 gives x=6; 2x−5=−7 gives x=−1. Substitution gives distance 7 for each.","hint":"Distance 7 has two directions."}],"independentPractice":[{"prompt":"Solve −4x+9≤21.","answer":"x≥−3","explanation":"Subtract 9 to get −4x≤12; division by −4 reverses the symbol.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Solve 3(x−2)=3x+1.","answer":"No solution","explanation":"Distribution gives 3x−6=3x+1, hence −6=1, a false statement.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Solve −3<2x+1≤9.","answer":"−2<x≤4","explanation":"Subtract 1 from all three parts, then divide all three by positive 2.","hint":"Recognize the structure before choosing an operation."}],"misconceptions":[{"error":"3(x+5)=3x+5","correction":"Hit every term: 3x+15. Draw one arrow to each term."},{"error":"Dividing −2x>8 gives x>−4","correction":"Reflect the order: x<−4. Test x=−5."},{"error":"An OR always means disjoint rays","correction":"OR means union; its sets may overlap or cover all real numbers. AND means intersection and may be empty."}],"domainRestrictions":["Division requires a nonzero divisor. For A=bh/2, h=2A/b requires b≠0. If b=0 and A=0 every h works; if b=0 and A≠0 no h works.","For |u|<k, k≤0 yields no solution. For |u|>k, k<0 yields all allowed inputs; k=0 excludes u=0."],"honorsExtension":{"prompt":"Classify ax+b=cx+d for every real parameter choice. Prove your classification.","solution":"Subtract cx and b: (a−c)x=d−b. If a≠c there is one solution x=(d−b)/(a−c). If a=c and b=d the equation is an identity; if a=c and b≠d there is no solution.","bridge":"Systems use exactly this classification after elimination.","rubric":"Give all three cases and justify why division is forbidden when a−c=0."},"masteryCheck":[{"prompt":"Solve 2x−7=9.","options":["x=8","x=1","x=−8","x=16"],"correctIndex":0,"explanation":"2x=16, so x=8; 16−7=9.","skill":"inverse operations"},{"prompt":"Solve −2x>8.","options":["x<−4","x>−4","x<4","x>4"],"correctIndex":0,"explanation":"Divide by a negative and reverse the order.","skill":"inequality reversal"},{"prompt":"Solve |x−3|=2.","options":["x=1 or x=5","x=5 only","x=−1 or x=−5","No solution"],"correctIndex":0,"explanation":"Distance 2 from 3 gives 3±2.","skill":"absolute value branches"},{"prompt":"Solve 4x+1=4x+1.","options":["All real numbers","No solution","x=0 only","x=1 only"],"correctIndex":0,"explanation":"Subtract 4x+1; 0=0 is true for every input.","skill":"identity"},{"prompt":"A=bh/2 can be solved as h=2A/b under which condition?","options":["b≠0","b=0","A≠0 only","h≠0"],"correctIndex":0,"explanation":"Division by b requires b nonzero.","skill":"domain restriction"}],"nextAction":{"belowThreshold":"Correct each missed skill, redo the guided practice without opening the answer, then try fresh Test Me questions.","atThreshold":"Explain one answer aloud, complete the honors extension, then reassess with fresh questions.","links":[{"label":"Cheat Sheet","href":"#/area/solving-equations/cheatsheet"},{"label":"Blueprint","href":"#/area/solving-equations/blueprint"},{"label":"Flashcards","href":"#/area/solving-equations/flashcards"},{"label":"Test Me","href":"#/area/solving-equations/testme"},{"label":"Honors","href":"#/area/solving-equations/honors"}]},"rubric":{"pointsPerItem":1,"total":5,"provisionalThreshold":4,"description":"4 of 5 correct is a successful lesson check, not certification of durable area mastery. Require a second successful attempt with fresh questions and a justified transfer solution before claiming secure proficiency.","reasoningCriteria":["Recognize the structure and state restrictions.","Explain why the chosen move preserves the mathematical relationship.","Execute with signs and units intact.","Check against the original statement.","Transfer the principle to the honors task."]}},"linear-equations":{"id":"linear-equations","title":"Linear Equations","language":"en","centralPrinciple":"A nonvertical line has a constant rate of change: m=Δy/Δx. One point and that rate determine the entire line.","whyItWorks":["Equal horizontal changes produce equal vertical changes. From a fixed point (x₁,y₁), y−y₁=m(x−x₁).","The slope is a ratio, so scaling both changes leaves it unchanged. Reversing the order of BOTH differences also preserves it.","A vertical line has Δx=0 and cannot be written y=mx+b. A horizontal line has m=0."],"prerequisites":["Coordinate pairs","Signed fractions","Solving for a variable"],"representation":{"type":"coordinate","description":"Plot (1,4) and (3,10). Draw the right triangle with run 2 and rise 6; extend the line y=3x+1.","points":[[1,4],[3,10]],"segments":[[[1,4],[3,4]],[[3,4],[3,10]]],"equation":"y=3x+1"},"originalWorkedExample":{"ex":"(1, 4)   (3, 10)","steps":[["op_slope","m = (10 − 4)/(3 − 1) = 6/2 = 3"],["op_pointslope","y − 4 = 3(x − 1)"],["op_distribute","y − 4 = 3x − 3"],["op_solvey","y = 3x + 1"]],"check":"3(3) + 1 = 10   ✓","tq":"(2, 1)   (6, 9)","ta":"y = 2x − 3","tw":["m = 8/4 = 2","y − 1 = 2(x − 2)","y = 2x − 3"]},"workedExample":{"prompt":"Find the line perpendicular to y=2x+5 through (4,1).","steps":["The original slope is 2. A perpendicular nonvertical line has slope −1/2.","Use the point: y−1=−(x−4)/2.","Distribute and add 1: y=−x/2+3."],"check":"At x=4, y=−2+3=1. The slope product is 2(−1/2)=−1."},"guidedPractice":[{"prompt":"Find the line through (2,1) and (6,9).","answer":"y=2x−3","explanation":"m=(9−1)/(6−2)=2. Then y−1=2(x−2), so y=2x−3. Both given points check.","hint":"Keep the same order in numerator and denominator."},{"prompt":"Find the x- and y-intercepts of 2x+3y=12.","answer":"(6,0) and (0,4)","explanation":"At the x-intercept y=0 gives x=6. At the y-intercept x=0 gives y=4.","hint":"An intercept is a point, not just a number."}],"independentPractice":[{"prompt":"Find a line parallel to y=−3x+2 through (1,5).","answer":"y=−3x+8","explanation":"Same slope −3; 5=−3+ b gives b=8.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Find the slope through (2,−1) and (2,7).","answer":"Undefined; line x=2","explanation":"The run is zero, so no finite slope exists.","hint":"Recognize the structure before choosing an operation."},{"prompt":"A taxi costs $5 plus $2 per mile. Model C(d) and interpret both constants.","answer":"C(d)=2d+5, d≥0","explanation":"2 is dollars per mile and 5 is the initial charge. Negative travel distance is excluded.","hint":"Recognize the structure before choosing an operation."}],"misconceptions":[{"error":"Mixing point order in the slope ratio","correction":"Use y₂−y₁ over x₂−x₁, with matching subscripts."},{"error":"Calling a vertical line slope zero","correction":"Zero rise means horizontal. Zero run means undefined slope."},{"error":"Using the negative reciprocal for parallel lines","correction":"Parallel lines keep slope; perpendicular nonvertical lines have product −1."}],"domainRestrictions":["The slope formula requires x₂≠x₁.","Negative reciprocals require a nonzero finite slope. A line perpendicular to a horizontal line is vertical.","A contextual model may restrict the otherwise real domain; distance is nonnegative."],"honorsExtension":{"prompt":"Why do perpendicular nonvertical lines have slopes with product −1?","solution":"A direction vector for slope m is (1,m). For slope n it is (1,n). Their dot product is 1+mn; perpendicular direction vectors have zero dot product, so mn=−1. A vertical/horizontal pair is the separate case.","bridge":"This connects line equations to geometric direction.","rubric":"Explain the vectors and include the vertical/horizontal exception."},"masteryCheck":[{"prompt":"Slope through (0,2) and (3,8)?","options":["2","1/2","3","6"],"correctIndex":0,"explanation":"Rise 6 divided by run 3 is 2.","skill":"slope"},{"prompt":"Line of slope 3 through (2,1)?","options":["y=3x−5","y=3x+1","y=2x+3","y=−3x+7"],"correctIndex":0,"explanation":"1=6+b gives b=−5.","skill":"point and slope"},{"prompt":"Slope of x=4?","options":["Undefined","0","4","1/4"],"correctIndex":0,"explanation":"Its run is zero.","skill":"vertical line"},{"prompt":"x-intercept of y=2x−6?","options":["(3,0)","(0,−6)","(−3,0)","(0,3)"],"correctIndex":0,"explanation":"Set y=0: 2x=6.","skill":"intercepts"},{"prompt":"A perpendicular slope to 4 is","options":["−1/4","4","1/4","−4"],"correctIndex":0,"explanation":"4(−1/4)=−1.","skill":"perpendicularity"}],"nextAction":{"belowThreshold":"Correct each missed skill, redo the guided practice without opening the answer, then try fresh Test Me questions.","atThreshold":"Explain one answer aloud, complete the honors extension, then reassess with fresh questions.","links":[{"label":"Cheat Sheet","href":"#/area/linear-equations/cheatsheet"},{"label":"Blueprint","href":"#/area/linear-equations/blueprint"},{"label":"Flashcards","href":"#/area/linear-equations/flashcards"},{"label":"Test Me","href":"#/area/linear-equations/testme"},{"label":"Honors","href":"#/area/linear-equations/honors"}]},"rubric":{"pointsPerItem":1,"total":5,"provisionalThreshold":4,"description":"4 of 5 correct is a successful lesson check, not certification of durable area mastery. Require a second successful attempt with fresh questions and a justified transfer solution before claiming secure proficiency.","reasoningCriteria":["Recognize the structure and state restrictions.","Explain why the chosen move preserves the mathematical relationship.","Execute with signs and units intact.","Check against the original statement.","Transfer the principle to the honors task."]}},"linear-absvalue-functions":{"id":"linear-absvalue-functions","title":"Linear & Absolute Value Functions","language":"en","centralPrinciple":"A function assigns one output to each input. Absolute value folds a line at its zero because |u| is the distance of u from zero.","whyItWorks":["For u≥0, |u|=u. For u<0, |u|=−u. These two linear rules meet at u=0.","For y=a|x−h|+k with a≠0 the folding point is x=h, so the vertex is (h,k). Outside multiplication controls steepness and reflection; outside addition controls vertical movement.","For f(x−h), the old input 0 occurs at the new input h. This explains the apparently opposite sign of a horizontal shift."],"prerequisites":["Linear graphs","Distance and signed numbers","Equation solving"],"representation":{"type":"coordinate","description":"Plot the V y=2|x−3|−4 through (1,0), (3,−4), (5,0). Join the points and extend both rays.","points":[[1,0],[3,-4],[5,0]],"equation":"y=2|x−3|−4"},"originalWorkedExample":{"ex":"y = 2|x − 3| − 4","steps":[["op_vertex","y = a|x − h| + k  →  h = 3, k = −4  →  (3, −4)"],["op_direction","a = 2 > 0  →  ∨,  m = ±2"],["op_setzero","2|x − 3| − 4 = 0  →  |x − 3| = 2"],["op_twocases","x − 3 = 2  or  x − 3 = −2  →  x = 5  or  x = 1"]],"check":"2|5 − 3| − 4 = 0   ✓   2|1 − 3| − 4 = 0   ✓","tq":"y = −|x + 1| + 3","ta":"(−1, 3);   x = 2,  x = −4","tw":["h = −1, k = 3","|x + 1| = 3","x = 2 or x = −4"]},"workedExample":{"prompt":"Analyze g(x)=−|x+1|+3: vertex, range, zeros and piecewise rule.","steps":["x+1=0 at x=−1, so vertex (−1,3); the minus sign reflects downward.","Since |x+1|≥0, g(x)≤3. Domain is all real numbers; range y≤3.","Zeros: |x+1|=3, hence x=2 or x=−4.","For x<−1, |x+1|=−x−1, so g=x+4. For x≥−1, g=−x+2."],"check":"g(−4)=0, g(2)=0, and each piece gives 3 at the joining point x=−1."},"guidedPractice":[{"prompt":"Find vertex and zeros of y=2|x−3|−4.","answer":"Vertex (3,−4); zeros 1 and 5","explanation":"The vertex input makes x−3 zero. Setting y=0 gives |x−3|=2, so x=3±2.","hint":"First locate the fold, then solve distance."},{"prompt":"For f(x)=2x+1, evaluate f(−3).","answer":"−5","explanation":"Replace the input everywhere: 2(−3)+1=−5.","hint":"f(x) is an output, not f multiplied by x."}],"independentPractice":[{"prompt":"Describe g(x)=|x+2|−5.","answer":"Left 2 and down 5; vertex (−2,−5)","explanation":"x+2=0 at −2 and the outside constant is −5.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Find the range of y=−2|x−1|+4.","answer":"y≤4","explanation":"A nonnegative distance multiplied by −2 is nonpositive, then 4 is added.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Solve |x−2|<3.","answer":"−1<x<5","explanation":"Distance less than 3 from 2 means the open interval 2−3 to 2+3.","hint":"Recognize the structure before choosing an operation."}],"misconceptions":[{"error":"Reading x+2 as right 2","correction":"Set the inside to zero: the vertex is at −2."},{"error":"Assuming negative a makes negative inputs invalid","correction":"It changes output orientation; the domain remains all real numbers."},{"error":"Giving only one x-intercept","correction":"Distance equations generally need both branches unless the distance is zero."}],"domainRestrictions":["For a≠0, a|x−h|+k has domain R and range y≥k when a>0 or y≤k when a<0.","When a=0 the function is constant y=k; it is not a V and its range is {k}."],"honorsExtension":{"prompt":"Classify the number of intersections of y=|x| and y=mx+b for b>0.","solution":"On x≥0: (1−m)x=b gives x=b/(1−m), admissible exactly when m<1. On x<0: (−1−m)x=b gives x=−b/(1+m), admissible exactly when m>−1. Thus −1<m<1 gives two intersections; m≤−1 or m≥1 gives one. At m=±1 the corresponding parallel branch has no intersection because b>0.","bridge":"Use systems and branch restrictions instead of guessing from a sketch.","rubric":"Solve both pieces, check signs, and handle m=±1."},"masteryCheck":[{"prompt":"Vertex of |x−4|+2?","options":["(4,2)","(−4,2)","(4,−2)","(2,4)"],"correctIndex":0,"explanation":"The inside vanishes at 4 and the output there is 2.","skill":"transformation"},{"prompt":"Range of −|x|+3?","options":["y≤3","y≥3","All real numbers","y<3"],"correctIndex":0,"explanation":"The maximum is 3 and it is attained at x=0.","skill":"range"},{"prompt":"Zeros of |x−1|−2?","options":["−1 and 3","1 and 2","3 only","−3 and 1"],"correctIndex":0,"explanation":"x−1=±2.","skill":"zeros"},{"prompt":"For x<0, |x| equals","options":["−x","x","0","x²"],"correctIndex":0,"explanation":"A negative input needs its opposite to make a distance.","skill":"piecewise rule"},{"prompt":"g(x)=f(x−3) shifts the graph","options":["Right 3","Left 3","Up 3","Down 3"],"correctIndex":0,"explanation":"An old input u occurs at new input x=u+3.","skill":"horizontal shift"}],"nextAction":{"belowThreshold":"Correct each missed skill, redo the guided practice without opening the answer, then try fresh Test Me questions.","atThreshold":"Explain one answer aloud, complete the honors extension, then reassess with fresh questions.","links":[{"label":"Cheat Sheet","href":"#/area/linear-absvalue-functions/cheatsheet"},{"label":"Blueprint","href":"#/area/linear-absvalue-functions/blueprint"},{"label":"Flashcards","href":"#/area/linear-absvalue-functions/flashcards"},{"label":"Test Me","href":"#/area/linear-absvalue-functions/testme"},{"label":"Honors","href":"#/area/linear-absvalue-functions/honors"}]},"rubric":{"pointsPerItem":1,"total":5,"provisionalThreshold":4,"description":"4 of 5 correct is a successful lesson check, not certification of durable area mastery. Require a second successful attempt with fresh questions and a justified transfer solution before claiming secure proficiency.","reasoningCriteria":["Recognize the structure and state restrictions.","Explain why the chosen move preserves the mathematical relationship.","Execute with signs and units intact.","Check against the original statement.","Transfer the principle to the honors task."]}},"systems-equations":{"id":"systems-equations","title":"Systems of Linear Equations & Inequalities","language":"en","centralPrinciple":"A system requires all its statements at once. A solution is an intersection, not a point that satisfies only one equation.","whyItWorks":["Substitution replaces one quantity by an equal quantity, so the same ordered pairs survive.","Adding equations preserves every common solution. To preserve equivalence, keep an original equation along with the sum, allowing the move to be reversed.","Two distinct nonparallel lines intersect once. Distinct parallel lines never intersect. Coincident lines share every point. For inequalities, intersect the allowed half-planes."],"prerequisites":["Solving linear equations","Graphing lines","Ordered-pair substitution"],"representation":{"type":"coordinate","description":"Graph y=10−x and y=2x−5. Their shared point is (5,5).","points":[[5,5]],"equations":["y=10−x","y=2x−5"]},"originalWorkedExample":{"ex":"x + y = 10\n2x − y = 5","steps":[["op_addeq","3x = 15"],["op_divboth","x = 5"],["op_substitute","5 + y = 10  →  y = 5"]],"check":"2(5) − 5 = 5   ✓   →   (5, 5)","tq":"y = 3x − 2\nx + y = 14","ta":"(4, 10)","tw":["x + (3x − 2) = 14","4x = 16  →  x = 4","y = 3(4) − 2 = 10"]},"workedExample":{"prompt":"Solve 2x+y=11 and x−y=1 by elimination.","steps":["Add the equations: 3x=12. Keep x−y=1 for back-substitution.","Divide by 3: x=4.","Substitute in x−y=1: 4−y=1, so y=3."],"check":"2(4)+3=11 and 4−3=1. The ordered pair (4,3) satisfies both."},"guidedPractice":[{"prompt":"Solve y=3x−2 and x+y=14.","answer":"(4,10)","explanation":"Substitute: x+3x−2=14, hence 4x=16 and x=4. Then y=10.","hint":"Replace y by the entire expression."},{"prompt":"Classify x+y=3 and 2x+2y=8.","answer":"No solution","explanation":"Doubling the first gives 2x+2y=6, which contradicts the second.","hint":"Compare equations with matching coefficients."}],"independentPractice":[{"prompt":"Solve x+y=9 and x−y=3.","answer":"(6,3)","explanation":"Add for 2x=12, then substitute for y=3.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Classify y=2x+1 and 2y=4x+2.","answer":"Infinitely many solutions","explanation":"The second is twice the first, so they describe the same line.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Does (1,2) satisfy y>x and x+y≤4?","answer":"Yes","explanation":"2>1 and 1+2=3≤4. Both conditions hold.","hint":"Recognize the structure before choosing an operation."}],"misconceptions":[{"error":"Adding coefficients but not right-hand constants","correction":"Add whole equalities; both sides need the same operation."},{"error":"Checking only one equation","correction":"A point must satisfy every equation in the original system."},{"error":"Shading a union for AND inequalities","correction":"Keep only the overlapping half-planes; test a point in each candidate region."}],"domainRestrictions":["Elimination division requires a nonzero remaining coefficient. A zero coefficient triggers identity/contradiction analysis.","Strict inequality boundaries are dashed and excluded; inclusive boundaries are solid and included.","In context, counts are nonnegative integers even when the unrestricted algebra yields fractions."],"honorsExtension":{"prompt":"For ax+by=e and cx+dy=f, explain why ad−bc≠0 guarantees exactly one solution.","solution":"Multiply the first by d and second by b; subtract to get (ad−bc)x=ed−bf. Nonzero ad−bc yields x=(ed−bf)/(ad−bc). Eliminating x likewise gives y=(af−ce)/(ad−bc). These values satisfy both originals. If the determinant is zero, rows are dependent (including zero-row cases); consistency must be checked to distinguish no solution from infinitely many.","bridge":"This is the determinant idea behind linear algebra.","rubric":"Derive both formulas and avoid claiming determinant zero always means no solution."},"masteryCheck":[{"prompt":"Solve x+y=7 and x−y=1.","options":["(4,3)","(3,4)","(7,1)","(1,7)"],"correctIndex":0,"explanation":"Add to get 2x=8, then y=3.","skill":"elimination"},{"prompt":"y=2x and y=2x+3 have","options":["No solution","One solution","Infinitely many solutions","Two solutions"],"correctIndex":0,"explanation":"Same slope with different intercepts gives parallel lines.","skill":"classification"},{"prompt":"x+y=2 and 2x+2y=4 have","options":["Infinitely many solutions","No solution","Exactly one solution","Exactly two solutions"],"correctIndex":0,"explanation":"The equations are equivalent.","skill":"dependent system"},{"prompt":"Does (2,1) satisfy y≥x−1 and x+y<4?","options":["Yes","Only the first","Only the second","Neither"],"correctIndex":0,"explanation":"1≥1 and 3<4 both hold.","skill":"inequality intersection"},{"prompt":"To eliminate y in 2x+3y=9 and x−y=1, multiply the second by","options":["3","−3","2","1/3"],"correctIndex":0,"explanation":"3x−3y=3 cancels +3y when added.","skill":"elimination multiplier"}],"nextAction":{"belowThreshold":"Correct each missed skill, redo the guided practice without opening the answer, then try fresh Test Me questions.","atThreshold":"Explain one answer aloud, complete the honors extension, then reassess with fresh questions.","links":[{"label":"Cheat Sheet","href":"#/area/systems-equations/cheatsheet"},{"label":"Blueprint","href":"#/area/systems-equations/blueprint"},{"label":"Flashcards","href":"#/area/systems-equations/flashcards"},{"label":"Test Me","href":"#/area/systems-equations/testme"},{"label":"Honors","href":"#/area/systems-equations/honors"}]},"rubric":{"pointsPerItem":1,"total":5,"provisionalThreshold":4,"description":"4 of 5 correct is a successful lesson check, not certification of durable area mastery. Require a second successful attempt with fresh questions and a justified transfer solution before claiming secure proficiency.","reasoningCriteria":["Recognize the structure and state restrictions.","Explain why the chosen move preserves the mathematical relationship.","Execute with signs and units intact.","Check against the original statement.","Transfer the principle to the honors task."]}},"exponents-exponential":{"id":"exponents-exponential","title":"Exponents & Exponential Functions","language":"en","centralPrinciple":"Positive integer exponents count repeated factors. Exponent laws extend that pattern consistently; an exponential model repeatedly multiplies by the same positive factor.","whyItWorks":["x³x² contains five factors of x, so it is x⁵. (x³)² contains six, so it is x⁶.","For x≠0, x³/x³=1; the quotient pattern gives x⁰=1. To keep x²/x³=x⁻¹ consistent, x⁻¹ must mean 1/x.","In A(t)=A₀bᵗ, A(t+1)/A(t)=b when A₀≠0. Constant ratio distinguishes exponential change from the constant difference of linear change."],"prerequisites":["Multiplication and fractions","Percent to decimal conversion","Substitution"],"representation":{"type":"table","description":"Doubling model A(t)=100·2ᵗ: equal time steps produce equal ratios, not equal differences.","headers":["t","A(t)","Next-step ratio"],"rows":[[0,100,2],[1,200,2],[2,400,2],[3,800,"—"]]},"originalWorkedExample":{"ex":"(3x²)³ · x⁻⁴","steps":[["op_power","(3x²)³ = 3³ · x²·³ = 27x⁶"],["op_product","27x⁶ · x⁻⁴ = 27x⁶⁺⁽⁻⁴⁾ = 27x²"],["op_growth","A(t) = 200(1.05)ᵗ   →   1 + 0.05 = 1.05"]],"check":"x = 1:   (3)³ · 1 = 27 = 27(1)²   ✓","tq":"(2x⁴)² ÷ (4x³)","ta":"x⁵","tw":["(2x⁴)² = 4x⁸","4x⁸ ÷ 4x³ = x⁸⁻³","= x⁵"]},"workedExample":{"prompt":"A quantity starts at 500 and decreases 20% each year. Write the model and find its value after 3 years.","steps":["Keeping 80% means multiplying by 1−0.20=0.80 each year.","A(t)=500(0.8)ᵗ, with t≥0 for this context.","A(3)=500(0.512)=256."],"check":"Year-by-year: 500 → 400 → 320 → 256. Each value is 80% of the preceding one."},"guidedPractice":[{"prompt":"Simplify (2x⁴)²/(4x³).","answer":"x⁵, x≠0","explanation":"The numerator is 4x⁸. Divide coefficients and subtract exponents: x⁸⁻³=x⁵. The original denominator forbids x=0.","hint":"Restrictions survive simplification."},{"prompt":"A population of 200 grows 5% yearly. Model it and evaluate at year 2.","answer":"A(t)=200(1.05)ᵗ; A(2)=220.5","explanation":"A 5% increase retains the old 100% plus 5%, so the multiplier is 1.05.","hint":"Percent growth is not the base itself."}],"independentPractice":[{"prompt":"Evaluate 2⁻³.","answer":"1/8","explanation":"A negative exponent means reciprocal: 1/2³.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Simplify (3x²)³x⁻⁴.","answer":"27x², x≠0","explanation":"Cube coefficient and power: 27x⁶. Multiply by x⁻⁴ to obtain 27x²; x=0 was excluded.","hint":"Recognize the structure before choosing an operation."},{"prompt":"A culture doubles every 20 minutes from 150 cells. How long to reach 9600?","answer":"120 minutes","explanation":"9600/150=64=2⁶. Six doubling intervals of 20 minutes give 120.","hint":"Recognize the structure before choosing an operation."}],"misconceptions":[{"error":"x³+x²=x⁵","correction":"Exponent addition applies to multiplication with the same base, not addition."},{"error":"2⁻³=−8","correction":"The negative exponent is an instruction to reciprocate: 1/8."},{"error":"20% decrease uses base 0.20","correction":"The remaining fraction is 0.80; use 1−r."}],"domainRestrictions":["Negative exponents and quotient laws require nonzero bases. 0⁰ is undefined in this Algebra 1 convention.","For real exponents in bᵗ, require b>0; a genuine nonconstant exponential has b≠1.","Even roots require nonnegative real radicands. √(x²)=|x|; it equals x only for x≥0."],"honorsExtension":{"prompt":"Compare L(t)=100+50t and E(t)=100·2ᵗ for nonnegative integer t. Determine when E first exceeds L and prove it stays larger afterward.","solution":"At t=0 they tie. At t=1, E=200>L=150, so the first integer is 1. If E(t)>L(t) for t≥1, then E(t+1)=2E(t)>2L(t). Since 2L(t)−L(t+1)=50+50t>0, E(t+1)>L(t+1). Induction proves continued dominance for integer times.","bridge":"Use recurrence and induction rather than extrapolating a few plotted points.","rubric":"Check t=0 and t=1 and justify the induction step with an inequality."},"masteryCheck":[{"prompt":"x³·x⁴ equals","options":["x⁷","x¹²","2x⁷","x"],"correctIndex":0,"explanation":"Seven repeated factors.","skill":"product law"},{"prompt":"2⁻² equals","options":["1/4","−4","4","−1/4"],"correctIndex":0,"explanation":"The reciprocal of 2² is 1/4.","skill":"negative exponent"},{"prompt":"An 8% growth model uses base","options":["1.08","0.08","0.92","8"],"correctIndex":0,"explanation":"100%+8%=108%=1.08.","skill":"growth multiplier"},{"prompt":"400(0.5)³ equals","options":["50","200","100","800"],"correctIndex":0,"explanation":"400/8=50.","skill":"evaluation"},{"prompt":"Simplify x³/x, retaining its original domain.","options":["x², x≠0","x², all real x","x⁴, x≠0","x², x>0"],"correctIndex":0,"explanation":"Cancel one factor only when the divisor x is nonzero.","skill":"domain restriction"}],"nextAction":{"belowThreshold":"Correct each missed skill, redo the guided practice without opening the answer, then try fresh Test Me questions.","atThreshold":"Explain one answer aloud, complete the honors extension, then reassess with fresh questions.","links":[{"label":"Cheat Sheet","href":"#/area/exponents-exponential/cheatsheet"},{"label":"Blueprint","href":"#/area/exponents-exponential/blueprint"},{"label":"Flashcards","href":"#/area/exponents-exponential/flashcards"},{"label":"Test Me","href":"#/area/exponents-exponential/testme"},{"label":"Honors","href":"#/area/exponents-exponential/honors"}]},"rubric":{"pointsPerItem":1,"total":5,"provisionalThreshold":4,"description":"4 of 5 correct is a successful lesson check, not certification of durable area mastery. Require a second successful attempt with fresh questions and a justified transfer solution before claiming secure proficiency.","reasoningCriteria":["Recognize the structure and state restrictions.","Explain why the chosen move preserves the mathematical relationship.","Execute with signs and units intact.","Check against the original statement.","Transfer the principle to the honors task."]}},"polynomials-factoring":{"id":"polynomials-factoring","title":"Polynomials & Factoring","language":"en","centralPrinciple":"Factoring reverses distribution: a sum is rewritten as a product without changing its value.","whyItWorks":["(x+p)(x+q)=x²+(p+q)x+pq. The middle coefficient is a sum; the constant is a product.","For ax²+bx+c, splitting b into two terms whose product is ac permits grouping into a common binomial.","A common factor is removed from EVERY term. Re-expanding is an identity check for all inputs, stronger than checking one number."],"prerequisites":["Distribution","Like terms","Integer factor pairs","Exponent laws"],"representation":{"type":"area","description":"The product (2x+1)(x+3) partitions a rectangle into 2x², 6x, x, and 3. Positive x gives a literal area; the polynomial identity holds for every real x.","rowLabels":["2x","1"],"columnLabels":["x","3"],"cells":[["2x²","6x"],["x","3"]]},"originalWorkedExample":{"ex":"2x² + 7x + 3","steps":[["op_findac","a · c = 2 · 3 = 6   →   6 · 1,  6 + 1 = 7"],["op_split","2x² + 6x + x + 3"],["op_group","2x(x + 3) + 1(x + 3)"],["op_commonbin","(2x + 1)(x + 3)"]],"check":"(2x + 1)(x + 3) = 2x² + 6x + x + 3 = 2x² + 7x + 3   ✓","tq":"x² − 3x − 28","ta":"(x − 7)(x + 4)","tw":["−7 · 4 = −28","−7 + 4 = −3","(x − 7)(x + 4)"]},"workedExample":{"prompt":"Factor 3x²−12 completely, then distinguish this expression from the equation 3x²−12=0.","steps":["First take the GCF: 3(x²−4).","Difference of squares: 3(x−2)(x+2).","The expression is a product. If it is set equal to zero, then x−2=0 or x+2=0, yielding ±2."],"check":"3(x−2)(x+2)=3(x²−4)=3x²−12. At x=0 the expression is −12, so it is not always zero."},"guidedPractice":[{"prompt":"Factor 2x²+7x+3.","answer":"(2x+1)(x+3)","explanation":"ac=6; 6 and 1 sum to 7. Split 7x, group 2x(x+3)+(x+3), then factor the common binomial.","hint":"Check product ac and sum b."},{"prompt":"Factor x²−3x−28.","answer":"(x−7)(x+4)","explanation":"−7·4=−28 and −7+4=−3. Expansion confirms the result.","hint":"The negative constant needs opposite signs."}],"independentPractice":[{"prompt":"Expand (x−3)(x+5).","answer":"x²+2x−15","explanation":"Distribute to get x²+5x−3x−15.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Factor 6x²−9x.","answer":"3x(2x−3)","explanation":"The GCF of both terms is 3x.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Factor x²+9 over the real numbers.","answer":"Irreducible over the reals","explanation":"It has no real roots and no real linear factors; a sum of squares is not a difference of squares.","hint":"Recognize the structure before choosing an operation."}],"misconceptions":[{"error":"Stopping after a GCF leaves a factorable binomial","correction":"Inspect each remaining factor for another pattern."},{"error":"x²+9=(x+3)(x−3)","correction":"That product is x²−9. Re-expand to expose the sign."},{"error":"Factoring an expression and declaring its zeros as its value","correction":"Zeros are solutions only when the expression is set equal to zero."}],"domainRestrictions":["Polynomial identities have domain all real inputs. Rational cancellation retains the original denominator exclusions.","Factoring depends on the coefficient system: x²+9 has complex factors (x−3i)(x+3i), but no real linear factors."],"honorsExtension":{"prompt":"Prove the factor theorem for a polynomial p: p(r)=0 exactly when x−r is a factor.","solution":"Polynomial division gives p(x)=(x−r)q(x)+c, where the remainder c is constant. Substituting x=r gives p(r)=c. Thus p(r)=0 exactly when the remainder is zero, which is exactly divisibility by x−r.","bridge":"This turns an evaluation into a factoring test and explains the remainder theorem.","rubric":"Use the division identity and explicitly justify why the remainder is constant."},"masteryCheck":[{"prompt":"Factor x²+5x+6.","options":["(x+2)(x+3)","(x+1)(x+6)","(x−2)(x−3)","(x+5)(x+1)"],"correctIndex":0,"explanation":"2+3=5 and 2·3=6.","skill":"trinomial factoring"},{"prompt":"Factor x²−16.","options":["(x−4)(x+4)","(x−4)²","(x+4)²","x(x−16)"],"correctIndex":0,"explanation":"Difference of squares.","skill":"special pattern"},{"prompt":"Expand (x+2)².","options":["x²+4x+4","x²+4","x²+2x+4","2x²+4"],"correctIndex":0,"explanation":"Both cross products contribute 2x.","skill":"binomial square"},{"prompt":"GCF of 8x³ and 12x²?","options":["4x²","4x³","8x²","24x⁵"],"correctIndex":0,"explanation":"Coefficient GCF 4 and minimum common exponent 2.","skill":"GCF"},{"prompt":"What must be true if x−3 is a factor of p(x)?","options":["p(3)=0","p(−3)=0","p(0)=3","p(3)=3"],"correctIndex":0,"explanation":"Substituting 3 zeros the factor.","skill":"factor theorem"}],"nextAction":{"belowThreshold":"Correct each missed skill, redo the guided practice without opening the answer, then try fresh Test Me questions.","atThreshold":"Explain one answer aloud, complete the honors extension, then reassess with fresh questions.","links":[{"label":"Cheat Sheet","href":"#/area/polynomials-factoring/cheatsheet"},{"label":"Blueprint","href":"#/area/polynomials-factoring/blueprint"},{"label":"Flashcards","href":"#/area/polynomials-factoring/flashcards"},{"label":"Test Me","href":"#/area/polynomials-factoring/testme"},{"label":"Honors","href":"#/area/polynomials-factoring/honors"}]},"rubric":{"pointsPerItem":1,"total":5,"provisionalThreshold":4,"description":"4 of 5 correct is a successful lesson check, not certification of durable area mastery. Require a second successful attempt with fresh questions and a justified transfer solution before claiming secure proficiency.","reasoningCriteria":["Recognize the structure and state restrictions.","Explain why the chosen move preserves the mathematical relationship.","Execute with signs and units intact.","Check against the original statement.","Transfer the principle to the honors task."]}},"quadratic-functions":{"id":"quadratic-functions","title":"Quadratic Functions","language":"en","centralPrinciple":"A quadratic is a shifted, scaled square. Squares give symmetry and a vertex; the sign of the scale decides whether the vertex is a minimum or maximum.","whyItWorks":["Complete the square: ax²+bx+c=a(x+b/(2a))²+c−b²/(4a), for a≠0. Thus h=−b/(2a) and k=c−b²/(4a).","At x=h+d and x=h−d, the square is d² in both cases, so the outputs match.","A square is nonnegative. Therefore a>0 gives y≥k; a<0 gives y≤k. The axis is x=h, not y=k."],"prerequisites":["Squares","Factoring","Function evaluation","Coordinate graphs"],"representation":{"type":"coordinate","description":"Plot y=(x−2)²−9 at (−1,0), (0,−5), (2,−9), (4,−5), (5,0). Equal-distance points are paired across x=2.","points":[[-1,0],[0,-5],[2,-9],[4,-5],[5,0]],"equation":"y=(x−2)²−9","axis":2},"originalWorkedExample":{"ex":"y = x² − 4x − 5","steps":[["op_axis","x = −b/(2a) = 4/2 = 2"],["op_height","y = 2² − 4(2) − 5 = −9   →   (2, −9)"],["op_direction","a = 1 > 0   →   ∪,  min = −9"],["op_zeros","(x − 5)(x + 1) = 0   →   x = 5,  x = −1"]],"check":"(5 + (−1)) / 2 = 2   ✓","tq":"y = −x² + 6x − 1","ta":"(3, 8)","tw":["x = −6/(2·(−1)) = 3","y = −9 + 18 − 1 = 8"]},"workedExample":{"prompt":"Analyze f(x)=−x²+6x−1 by completing the square.","steps":["Factor the negative from the variable terms: −(x²−6x)−1.","x²−6x=(x−3)²−9, so f(x)=−(x−3)²+8.","Vertex (3,8), axis x=3, maximum 8, range y≤8, and real domain R.","For zeros, (x−3)²=8 gives x=3±2√2. The y-intercept is (0,−1)."],"check":"f(2)=7=f(4), showing symmetry; f(3)=8. Substituting x=3±2√2 into vertex form gives zero."},"guidedPractice":[{"prompt":"Find vertex, axis and zeros of x²−4x−5.","answer":"(2,−9), x=2, zeros −1 and 5","explanation":"Complete square: (x−2)²−9. Factoring gives (x−5)(x+1).","hint":"Use vertex form for shape, factored form for zeros."},{"prompt":"A parabola has vertex (1,−2) and passes through (3,6). Find its equation.","answer":"y=2(x−1)²−2","explanation":"Use y=a(x−1)²−2. Substitute (3,6): 6=4a−2, hence a=2.","hint":"Find the scale only after locating the vertex."}],"independentPractice":[{"prompt":"Find the minimum of 2(x+1)²+5.","answer":"5 at x=−1","explanation":"The square is zero at −1 and nonnegative everywhere.","hint":"Recognize the structure before choosing an operation."},{"prompt":"For y=(x−4)²−1, find y when x=2 and x=6.","answer":"Both are 3","explanation":"Both inputs are distance 2 from the axis, so each gives 4−1.","hint":"Recognize the structure before choosing an operation."},{"prompt":"A ball has h(t)=−5t²+20t+1. Find the maximum height for t≥0.","answer":"21 at t=2","explanation":"Complete square: h=−5(t−2)²+21. The vertex time is admissible.","hint":"Recognize the structure before choosing an operation."}],"misconceptions":[{"error":"Calling −b/(2a) the maximum value","correction":"It is the vertex INPUT. Substitute it to get the height."},{"error":"Reading (x+1)² as vertex x=1","correction":"Its zero is at x=−1."},{"error":"Assuming a quadratic always crosses the x-axis twice","correction":"The vertex and opening may give zero, one, or two real zeros."}],"domainRestrictions":["A quadratic requires a≠0. Its real algebraic domain is R.","Physical domains may start at t=0 and end when the object reaches the ground; only an admissible vertex gives a physical maximum."],"honorsExtension":{"prompt":"Using 120 m of fencing for three sides against a wall, maximize a rectangular enclosure.","solution":"Let w be each of the two perpendicular sides and l the side along the wall. 2w+l=120 gives l=120−2w. Area A=w(120−2w)=−2(w−30)²+1800. For 0≤w≤60 the maximum is 1800 m² at w=30 and l=60. Nondegenerate rectangles use 0<w<60 and the same optimizer.","bridge":"A geometric constraint becomes a quadratic optimization problem.","rubric":"Define variables, restrict the domain, derive the square form, and state both dimensions and units."},"masteryCheck":[{"prompt":"Vertex of (x−2)²+3?","options":["(2,3)","(−2,3)","(2,−3)","(3,2)"],"correctIndex":0,"explanation":"The square vanishes at x=2.","skill":"vertex form"},{"prompt":"Range of −2(x+1)²+5?","options":["y≤5","y≥5","All real numbers","y<5"],"correctIndex":0,"explanation":"Negative scale makes the vertex a maximum, included.","skill":"range"},{"prompt":"Axis of x²−6x+2?","options":["x=3","x=−3","y=3","x=6"],"correctIndex":0,"explanation":"−b/(2a)=6/2=3.","skill":"axis"},{"prompt":"y-intercept of x²+4x−2?","options":["(0,−2)","(−2,0)","(0,4)","(2,0)"],"correctIndex":0,"explanation":"Set input x=0.","skill":"intercept"},{"prompt":"Minimum of x²−4x+1?","options":["−3","2","1","3"],"correctIndex":0,"explanation":"(x−2)²−3 is at least −3.","skill":"optimization"}],"nextAction":{"belowThreshold":"Correct each missed skill, redo the guided practice without opening the answer, then try fresh Test Me questions.","atThreshold":"Explain one answer aloud, complete the honors extension, then reassess with fresh questions.","links":[{"label":"Cheat Sheet","href":"#/area/quadratic-functions/cheatsheet"},{"label":"Blueprint","href":"#/area/quadratic-functions/blueprint"},{"label":"Flashcards","href":"#/area/quadratic-functions/flashcards"},{"label":"Test Me","href":"#/area/quadratic-functions/testme"},{"label":"Honors","href":"#/area/quadratic-functions/honors"}]},"rubric":{"pointsPerItem":1,"total":5,"provisionalThreshold":4,"description":"4 of 5 correct is a successful lesson check, not certification of durable area mastery. Require a second successful attempt with fresh questions and a justified transfer solution before claiming secure proficiency.","reasoningCriteria":["Recognize the structure and state restrictions.","Explain why the chosen move preserves the mathematical relationship.","Execute with signs and units intact.","Check against the original statement.","Transfer the principle to the honors task."]}},"solving-quadratics":{"id":"solving-quadratics","title":"Solving Quadratic Equations","language":"en","centralPrinciple":"To solve a quadratic, rewrite it so a square or a product exposes the possible inputs. A zero product has at least one zero factor.","whyItWorks":["If uv=0 and u≠0, division by u gives v=0; otherwise u=0 already. This proves the zero-product rule over real numbers.","For (x−h)²=k, positive k gives two square-root branches, zero gives one, and negative k gives no real solution.","Completing the square for ax²+bx+c=0 yields (x+b/(2a))²=(b²−4ac)/(4a²), which produces x=(−b±√(b²−4ac))/(2a)."],"prerequisites":["Equation balance","Factoring","Square roots","Quadratic graphs"],"representation":{"type":"concept","description":"The horizontal level k intersects y=(x−h)² twice when k>0, touches once when k=0, and misses when k<0. The discriminant controls that same count."},"originalWorkedExample":{"ex":"x² − x − 12 = 0","steps":[["op_discrim","b² − 4ac = 1 + 48 = 49 > 0   →   2"],["op_factor","(x − 4)(x + 3) = 0"],["op_zeroprod","x − 4 = 0   or   x + 3 = 0"],["op_solveeach","x = 4   or   x = −3"]],"check":"4² − 4 − 12 = 0   ✓   (−3)² + 3 − 12 = 0   ✓","tq":"2x² − 3x − 2 = 0","ta":"x = 2,  x = −1/2","tw":["(2x + 1)(x − 2) = 0","x = −1/2 or x = 2"]},"workedExample":{"prompt":"Solve x²−6x+5=0 by completing the square and verify both roots.","steps":["Move the constant: x²−6x=−5.","Add 9 to both sides: (x−3)²=4.","Take both square-root branches: x−3=±2, so x=1 or x=5.","Check against factoring: (x−1)(x−5)=0 gives the same roots."],"check":"1−6+5=0 and 25−30+5=0. Both are solutions of the original."},"guidedPractice":[{"prompt":"Solve 2x²−3x−2=0.","answer":"x=2 or x=−1/2","explanation":"Factor (2x+1)(x−2)=0. Each factor may be zero, so x=−1/2 or 2.","hint":"First put zero on one side."},{"prompt":"Solve (x−2)²=9.","answer":"x=5 or x=−1","explanation":"x−2=3 or −3, then add 2 in each branch.","hint":"√9 is the principal root 3; solving a square equation uses ±3."}],"independentPractice":[{"prompt":"Solve x²+4x+4=0.","answer":"x=−2","explanation":"(x+2)²=0 gives one repeated root.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Solve x²−2x−1=0.","answer":"x=1±√2","explanation":"(x−1)²=2 after completing the square.","hint":"Recognize the structure before choosing an operation."},{"prompt":"How many real roots does 3x²+2x+1=0 have?","answer":"None","explanation":"Discriminant 4−12=−8<0, so the square-root term is not real.","hint":"Recognize the structure before choosing an operation."}],"misconceptions":[{"error":"Applying zero-product rule to (x−1)(x+2)=6","correction":"Move 6 to the left and refactor; the product is not zero."},{"error":"Dividing x²=3x by x loses x=0","correction":"Rewrite x(x−3)=0 to preserve the zero root."},{"error":"Squaring always preserves the solution set","correction":"Squaring can introduce extraneous roots. Substitute each candidate into the original radical equation."}],"domainRestrictions":["Quadratic formula requires a≠0. For real solutions, its discriminant must be nonnegative.","For √(x+2)=x, require x≥0; squaring gives x=2 or −1, but −1 is extraneous.","In a context such as a rectangle, discard algebraic roots that violate positive length."],"honorsExtension":{"prompt":"For x²+kx+9=0, classify the real roots and relate their sum and product to k.","solution":"D=k²−36. Two distinct real roots when |k|>6; one repeated root when k=±6; no real roots when |k|<6. If roots are r,s, expansion (x−r)(x−s)=x²−(r+s)x+rs gives r+s=−k and rs=9. For k>6 both roots are negative; for k<−6 both are positive.","bridge":"Discriminants and coefficient relationships support parameter reasoning without computing every root.","rubric":"Give all parameter ranges and derive the sum/product identities."},"masteryCheck":[{"prompt":"Solve x²−9=0.","options":["x=−3 or 3","x=3 only","x=9","No real solution"],"correctIndex":0,"explanation":"x²=9 has both signs.","skill":"square root branches"},{"prompt":"Solve x²−x−6=0.","options":["x=−2 or 3","x=2 or −3","x=−6 or 1","x=6 only"],"correctIndex":0,"explanation":"(x−3)(x+2)=0.","skill":"zero product"},{"prompt":"D for x²+2x+5=0 is","options":["−16","16","−6","24"],"correctIndex":0,"explanation":"2²−4·1·5=−16.","skill":"discriminant"},{"prompt":"Solve x²=4x without losing a root.","options":["x=0 or 4","x=4 only","x=0 only","x=−4 or 4"],"correctIndex":0,"explanation":"x(x−4)=0; do not divide by x.","skill":"zero-root preservation"},{"prompt":"Real solutions of √(x+2)=x?","options":["x=2 only","x=2 or −1","x=−1 only","No solution"],"correctIndex":0,"explanation":"Squaring gives (x−2)(x+1)=0; the original requires x≥0, and only 2 checks.","skill":"extraneous root"}],"nextAction":{"belowThreshold":"Correct each missed skill, redo the guided practice without opening the answer, then try fresh Test Me questions.","atThreshold":"Explain one answer aloud, complete the honors extension, then reassess with fresh questions.","links":[{"label":"Cheat Sheet","href":"#/area/solving-quadratics/cheatsheet"},{"label":"Blueprint","href":"#/area/solving-quadratics/blueprint"},{"label":"Flashcards","href":"#/area/solving-quadratics/flashcards"},{"label":"Test Me","href":"#/area/solving-quadratics/testme"},{"label":"Honors","href":"#/area/solving-quadratics/honors"}]},"rubric":{"pointsPerItem":1,"total":5,"provisionalThreshold":4,"description":"4 of 5 correct is a successful lesson check, not certification of durable area mastery. Require a second successful attempt with fresh questions and a justified transfer solution before claiming secure proficiency.","reasoningCriteria":["Recognize the structure and state restrictions.","Explain why the chosen move preserves the mathematical relationship.","Execute with signs and units intact.","Check against the original statement.","Transfer the principle to the honors task."]}},"working-with-functions":{"id":"working-with-functions","title":"Working with Functions","language":"en","centralPrinciple":"A function gives each allowed input exactly one output. Composition feeds one output into the next rule; an inverse reverses the assignment only when the output identifies a unique input.","whyItWorks":["The vertical-line test checks whether one x has more than one y. Repeated outputs are allowed.","f(g(x)) means execute g first, then use its output as f’s input. Order matters because the rules may change different quantities.","An inverse function requires one-to-one behavior. Switching input/output works only after verifying uniqueness, often by restricting the original domain."],"prerequisites":["Function notation","Substitution","Solving literal equations","Domain and range"],"representation":{"type":"mapping","description":"g sends 3 to 9; f sends 9 to 19. The composition sends 3 to 19. f inverse sends 19 back to 9.","arrows":[["3","9","g(x)=x²"],["9","19","f(x)=2x+1"],["19","9","f⁻¹(x)=(x−1)/2"]]},"originalWorkedExample":{"ex":"f(x) = 2x + 1\ng(x) = x²","steps":[["op_inner","g(3) = 3² = 9"],["op_outer","f(g(3)) = f(9) = 2(9) + 1 = 19"],["op_swap","y = 2x + 1   →   x = 2y + 1"],["op_solvey","f⁻¹(x) = (x − 1)/2"]],"check":"f⁻¹(19) = (19 − 1)/2 = 9   ✓","tq":"f(x) = 3x − 2\ng(x) = x + 4\nf(g(1)) = ?","ta":"13","tw":["g(1) = 5","f(5) = 15 − 2 = 13"]},"workedExample":{"prompt":"Let f(x)=3x−2 and g(x)=x+4. Find both compositions, then invert f.","steps":["f(g(x))=3(x+4)−2=3x+10.","g(f(x))=(3x−2)+4=3x+2. These are different.","To invert, start y=3x−2; solve x=(y+2)/3. Rename the input: f⁻¹(x)=(x+2)/3."],"check":"f⁻¹(f(x))=(3x−2+2)/3=x. Also f(f⁻¹(x))=3(x+2)/3−2=x."},"guidedPractice":[{"prompt":"For f(x)=2x+1 and g(x)=x², find f(g(3)).","answer":"19","explanation":"g(3)=9 then f(9)=19.","hint":"Work from the inner parentheses outward."},{"prompt":"Find domain of h(x)=√(x−2)/(x−5).","answer":"x≥2 and x≠5","explanation":"The square root needs x−2≥0; the denominator forbids x=5. Both conditions are required.","hint":"Intersect restrictions rather than choosing just one."}],"independentPractice":[{"prompt":"Is {(1,2),(2,2),(3,4)} a function?","answer":"Yes","explanation":"Each input has a single output; repeating the output 2 is allowed.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Find the inverse of f(x)=5x+3.","answer":"f⁻¹(x)=(x−3)/5","explanation":"Undo +3, then ×5; the original is one-to-one on R.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Let f(x)=1/(x−1), g(x)=x². Find domain of f(g(x)).","answer":"x≠−1 and x≠1","explanation":"The composition is 1/(x²−1); exclude inputs whose inner output is 1.","hint":"Recognize the structure before choosing an operation."}],"misconceptions":[{"error":"f⁻¹(x) means 1/f(x)","correction":"Superscript −1 names the inverse function; it is not a reciprocal."},{"error":"Reversing composition order","correction":"Compute the inside function first and label its output."},{"error":"Inverting x² on all reals as √x","correction":"Both x and −x share the output. Restrict original domain to x≥0 to obtain inverse √x."}],"domainRestrictions":["For f∘g, x must belong to domain(g) AND g(x) must belong to domain(f).","For x² restricted to x≥0, inverse √x has domain x≥0 and range y≥0. On all R, x² has no inverse function.","A simplified rational function retains holes from the original denominator."],"honorsExtension":{"prompt":"Restrict f(x)=(x−2)²+3 to x≥2 and derive its inverse, including domain and range.","solution":"The restricted function is increasing from vertex (2,3), with domain [2,∞) and range [3,∞). Solve y−3=(x−2)² using x−2≥0: x=2+√(y−3). Thus f⁻¹(x)=2+√(x−3), with domain [3,∞) and range [2,∞). The negative branch belongs to the other domain restriction. Check: f⁻¹(f(x))=2+√((x−2)²)=x for x≥2, while f(f⁻¹(y))=(√(y−3))²+3=y for y≥3.","bridge":"Domain restriction makes a symmetric quadratic reversible.","rubric":"Use the selected branch, specify both domains/ranges, and verify one composition."},"masteryCheck":[{"prompt":"f(x)=2x−1. Find f(4).","options":["7","8","6","3"],"correctIndex":0,"explanation":"2·4−1=7.","skill":"evaluation"},{"prompt":"f(x)=2x, g(x)=x+3. Find f(g(1)).","options":["8","5","2","4"],"correctIndex":0,"explanation":"g(1)=4 and f(4)=8.","skill":"composition"},{"prompt":"Inverse of 2x+1?","options":["(x−1)/2","1/(2x+1)","2x−1","(x+1)/2"],"correctIndex":0,"explanation":"Undo +1 then multiply by 1/2.","skill":"inverse"},{"prompt":"Domain of 1/(x−4)?","options":["All real x except 4","All real x","x≥4","All real x except 0"],"correctIndex":0,"explanation":"The denominator cannot be zero.","skill":"domain"},{"prompt":"Can x² on all real inputs have an inverse function?","options":["No; opposite nonzero inputs have the same output","Yes; inverse is √x","Yes; inverse is 1/x²","No; x² is not a function"],"correctIndex":0,"explanation":"It is a function but fails one-to-one behavior.","skill":"one-to-one"}],"nextAction":{"belowThreshold":"Correct each missed skill, redo the guided practice without opening the answer, then try fresh Test Me questions.","atThreshold":"Explain one answer aloud, complete the honors extension, then reassess with fresh questions.","links":[{"label":"Cheat Sheet","href":"#/area/working-with-functions/cheatsheet"},{"label":"Blueprint","href":"#/area/working-with-functions/blueprint"},{"label":"Flashcards","href":"#/area/working-with-functions/flashcards"},{"label":"Test Me","href":"#/area/working-with-functions/testme"},{"label":"Honors","href":"#/area/working-with-functions/honors"}]},"rubric":{"pointsPerItem":1,"total":5,"provisionalThreshold":4,"description":"4 of 5 correct is a successful lesson check, not certification of durable area mastery. Require a second successful attempt with fresh questions and a justified transfer solution before claiming secure proficiency.","reasoningCriteria":["Recognize the structure and state restrictions.","Explain why the chosen move preserves the mathematical relationship.","Execute with signs and units intact.","Check against the original statement.","Transfer the principle to the honors task."]}},"analyzing-data":{"id":"analyzing-data","title":"Analyzing Data","language":"en","centralPrinciple":"Data have center, spread and shape. A model predicts; a residual compares the observation with that prediction. Association alone does not prove causation.","whyItWorks":["The mean balances deviations: if mean μ=Σx/n, then Σ(x−μ)=Σx−nμ=0. Every value contributes, so outliers can pull it.","The median divides sorted observations into two halves; its position gives resistance to extreme changes.","A residual is observed minus predicted. A positive residual means the point lies above the model. A pattern in residuals warns that the model misses structure."],"prerequisites":["Arithmetic and fractions","Ordered data","Coordinate graphs","Linear models"],"representation":{"type":"table","description":"For model ŷ=2x+1, compare predictions and observations and compute signed residuals.","headers":["x","Observed y","Predicted ŷ","Residual"],"rows":[[1,4,3,1],[2,4,5,-1],[3,8,7,1]]},"originalWorkedExample":{"ex":"2, 4, 4, 5, 10\nŷ = 2x + 1,   (3, 8)","steps":[["op_mean","(2 + 4 + 4 + 5 + 10) ÷ 5 = 25 ÷ 5 = 5"],["op_median","2, 4, [4], 5, 10   →   4"],["op_compare","5 > 4   ←   10"],["op_residual","ŷ = 2(3) + 1 = 7   →   8 − 7 = 1"]],"check":"5 · 5 = 25   ✓","tq":"3, 5, 6, 6, 10","ta":"x̄ = 6,   median = 6","tw":["30 ÷ 5 = 6","3, 5, [6], 6, 10"]},"workedExample":{"prompt":"For data 2,4,4,5,10 find center and range. For ŷ=2x+1 and observation (3,8), find the residual.","steps":["Mean=(2+4+4+5+10)/5=5. Sorted middle value is 4, so median=4.","Range=maximum−minimum=10−2=8. The high value 10 pulls mean above median.","At x=3, predicted y is 7. Residual=8−7=1, so the point is one unit above the line."],"check":"Sum of deviations from 5: −3−1−1+0+5=0. Predicted 7 plus residual 1 reconstructs observed 8."},"guidedPractice":[{"prompt":"For 3,5,6,6,10 find mean and median.","answer":"Mean 6; median 6","explanation":"Sum 30 divided by 5 is 6. The ordered middle entry is 6.","hint":"Sort before locating the median."},{"prompt":"Model ŷ=3x+2 predicts an observation (4,11). Find the residual.","answer":"−3","explanation":"Prediction is 14; observed minus predicted is 11−14=−3.","hint":"Keep the subtraction order fixed."}],"independentPractice":[{"prompt":"For 2,3,5,8 find the median.","answer":"4","explanation":"The two central entries are 3 and 5; their average is 4.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Five scores average 80. Four of them total 330. Find the fifth.","answer":"70","explanation":"Total is 5·80=400; missing score=400−330=70.","hint":"Recognize the structure before choosing an operation."},{"prompt":"Among 50 nonsport students, 20 have jobs. Find the conditional percentage with jobs.","answer":"40%","explanation":"Use the specified group as denominator: 20/50=0.40. Do not divide by the total school.","hint":"Recognize the structure before choosing an operation."}],"misconceptions":[{"error":"Subtracting actual from predicted for a residual","correction":"Use actual−predicted; check whether the point is above or below the model."},{"error":"A strong correlation proves cause","correction":"A confounder or selection effect may explain association; experiments provide stronger causal evidence."},{"error":"Using the whole sample as a conditional denominator","correction":"First select the conditioned subgroup, then count within it."}],"domainRestrictions":["A mean needs n>0. The denominator of a conditional proportion must also be positive.","Population standard deviation divides squared deviations by n; sample standard deviation divides by n−1 and requires n≥2. State the convention.","Correlation r is undefined when either variable has zero spread. Restrict prediction to appropriate contexts; extrapolation can fail."],"honorsExtension":{"prompt":"Prove how replacing each datum x by y=3x+5 changes the mean and standard deviation.","solution":"Mean(y)=Σ(3x+5)/n=3μ+5. Each deviation y−mean(y)=3(x−μ), so squared deviations multiply by 9. With the same population or sample convention, variance multiplies by 9 and standard deviation by 3. More generally y=ax+b changes standard deviation to |a| times the old one.","bridge":"Center responds to shift and scale; spread responds only to magnitude of scale.","rubric":"Derive the mean and deviations, then explain why standard deviation cannot become negative."},"masteryCheck":[{"prompt":"Mean of 2,4,6?","options":["4","6","3","12"],"correctIndex":0,"explanation":"The sum 12 divided by 3 is 4.","skill":"mean"},{"prompt":"Median of 1,3,7,9?","options":["5","7","3","4"],"correctIndex":0,"explanation":"Average the two central values 3 and 7.","skill":"median"},{"prompt":"Actual y=9, predicted y=11. Residual?","options":["−2","2","20","−20"],"correctIndex":0,"explanation":"9−11=−2.","skill":"residual"},{"prompt":"A correlation of −0.92 indicates","options":["Strong negative linear association","Weak negative association","Strong positive association","Proof that x causes y"],"correctIndex":0,"explanation":"Magnitude near 1 is strong; sign negative gives direction, not cause.","skill":"correlation"},{"prompt":"20 of 50 members of a specified subgroup have jobs. Conditional percentage?","options":["40%","20%","50%","70%"],"correctIndex":0,"explanation":"20/50×100%=40%.","skill":"conditional proportion"}],"nextAction":{"belowThreshold":"Correct each missed skill, redo the guided practice without opening the answer, then try fresh Test Me questions.","atThreshold":"Explain one answer aloud, complete the honors extension, then reassess with fresh questions.","links":[{"label":"Cheat Sheet","href":"#/area/analyzing-data/cheatsheet"},{"label":"Blueprint","href":"#/area/analyzing-data/blueprint"},{"label":"Flashcards","href":"#/area/analyzing-data/flashcards"},{"label":"Test Me","href":"#/area/analyzing-data/testme"},{"label":"Honors","href":"#/area/analyzing-data/honors"}]},"rubric":{"pointsPerItem":1,"total":5,"provisionalThreshold":4,"description":"4 of 5 correct is a successful lesson check, not certification of durable area mastery. Require a second successful attempt with fresh questions and a justified transfer solution before claiming secure proficiency.","reasoningCriteria":["Recognize the structure and state restrictions.","Explain why the chosen move preserves the mathematical relationship.","Execute with signs and units intact.","Check against the original statement.","Transfer the principle to the honors task."]}}};

const EOC_PERFORMANCE_TASKS=[{"id":"eoc-performance-1","checkout":1,"title":"Compare two rental plans","cognitiveDemand":"DOK 2: multi-step application","suggestedProcess":"One lesson with a written explanation","prompt":"Plan A charges $18 plus $4 per hour. Plan B charges $6 per hour. Rentals allow whole hours from 1 through 10.","stages":[{"id":"stage-1","title":"Represent","prompt":"Define variables and domain. Build a table for 1, 3, 6, 9, and 10 hours and equations for both plans."},{"id":"stage-2","title":"Compare and explain","prompt":"Solve when prices are equal. Recommend a plan for 5 and 10 hours; show how the table and equation agree."},{"id":"stage-3","title":"Check and transfer","prompt":"A customer has $42. Find the maximum whole hours under each plan. If Plan A adds a $3 fee, revise your break-even recommendation."}],"rubric":[{"criterion":"Representations","points":4,"descriptor":"Accurate equations, units, domain, and table."},{"criterion":"Reasoning","points":4,"descriptor":"Correct comparison with equality boundary and checks."},{"criterion":"Transfer","points":4,"descriptor":"Budget inequality and revised fee recommendation justified."}],"workedAnswer":["A(h)=18+4h; B(h)=6h. At h=1,3,6,9,10: A=22,30,42,54,58; B=6,18,36,54,60.","Equal at h=9. B is cheaper at 5 hours ($30 versus $38); A is cheaper at 10 ($58 versus $60).","A<=42 permits h<=6; B<=42 permits h<=7. New A=21+4h equals B at 10.5, so B is cheaper at every allowed whole-hour rental."],"independentMathProof":["A-B=18-2h changes sign at 9; substitution gives 54 in both formulas.","21-2h>0 for every integer 1<=h<=10, proving the transferred recommendation."],"transfer":"Changed setup fee","reviewPolicy":"Student self-review is formative only. No automatic or AI grading. A teacher must review the process, reasoning, and evidence to certify performance; this browser does not issue performance certification."},{"id":"eoc-performance-2","checkout":2,"title":"Audit a ticket-sales claim","cognitiveDemand":"DOK 3: strategic reasoning and error analysis","suggestedProcess":"One or two lessons","prompt":"A play sells 150 tickets. Adult tickets cost $12 and student tickets $8. Reported revenue is $1,480. Someone claims 90 adults and 60 students were sold.","stages":[{"id":"stage-1","title":"Model and audit","prompt":"Write and solve a system. Audit the claim by checking BOTH constraints. Explain why checking only the ticket total is insufficient."},{"id":"stage-2","title":"Alternative evidence","prompt":"Show a second solution method. Explain what information would be lost if only the revenue equation were known."},{"id":"stage-3","title":"Revisit","prompt":"The office corrects revenue to $1,500. Decide whether that total is possible with 150 tickets. Generalize all possible revenues for 150 tickets."}],"rubric":[{"criterion":"Model and solution","points":4,"descriptor":"Accurate constraints and independently checked solution."},{"criterion":"Critique","points":4,"descriptor":"Claim tested against both conditions with logical explanation."},{"criterion":"Generalization","points":4,"descriptor":"Feasibility and revenue pattern proved, including bounds and integer condition."}],"workedAnswer":["a+s=150 and 12a+8s=1480 imply 4a=280, a=70,s=80. Claim revenue=1560, so claim fails.","Start from 150 student tickets: $1200. Each adult replacement adds $4; 280/4=70 replacements.","Revenue R=1200+4a for integer 0<=a<=150: possible totals are multiples of $4 from $1200 to $1800. $1500 is possible with a=75,s=75.","Revenue alone does not uniquely determine both counts: (a,s)=(0,185) and (70,80) both yield $1480, but only (70,80) totals 150 tickets."],"independentMathProof":["Eliminating 8(a+s)=1200 from revenue leaves 4a=280; substituting 70,80 gives both original constraints.","The map a ->1200+4a is both necessary and sufficient: each integer a in the domain constructs a valid ticket mix."],"transfer":"Changed revenue and feasibility","reviewPolicy":"Student self-review is formative only. No automatic or AI grading. A teacher must review the process, reasoning, and evidence to certify performance; this browser does not issue performance certification."},{"id":"eoc-performance-3","checkout":3,"title":"Design a fenced garden","cognitiveDemand":"DOK 3: non-routine reasoning across representations","suggestedProcess":"Two lessons with model critique","prompt":"A rectangular garden uses a straight wall as one side and all 120 m of fencing for the other three sides. The width perpendicular to the wall is x.","stages":[{"id":"stage-1","title":"Build and connect","prompt":"Develop an area equation, a table, and a sketch description. State the physically meaningful domain. Use factoring and vertex form to explain the same model."},{"id":"stage-2","title":"Optimize and justify","prompt":"Find the best dimensions. Prove your recommendation globally over the domain rather than checking only a few cases."},{"id":"stage-3","title":"Transfer and critique","prompt":"A path requires width x>=35 m. Revise the optimum and compare lost area. Explain why using 60 m for every side is invalid."}],"rubric":[{"criterion":"Model","points":4,"descriptor":"A=x(120-2x), domain and connected representations correct."},{"criterion":"Justification","points":4,"descriptor":"Vertex/completing-square proof of global maximum."},{"criterion":"Transfer","points":4,"descriptor":"Constrained optimum and invalid alternative explained."}],"workedAnswer":["Length=120-2x; domain 0<x<60. A=-2x²+120x=-2(x-30)²+1800. Table at x=10,20,30,40,50: A=1000,1600,1800,1600,1000.","Maximum 1800 m² at x=30 m, length 60 m.","For 35<=x<60, (x-30)² grows with x; best x=35, length=50, area=1750, loss=50 m². Three 60 m fenced sides need 180 m, violating the budget."],"independentMathProof":["Because a square is nonnegative, A<=1800 with equality exactly at x=30.","For x>=35, write x=35+d with d>=0: A=1750-20d-2d²<=1750."],"transfer":"Additional physical constraint","reviewPolicy":"Student self-review is formative only. No automatic or AI grading. A teacher must review the process, reasoning, and evidence to certify performance; this browser does not issue performance certification."},{"id":"eoc-performance-4","checkout":4,"title":"Investigate competing growth models","cognitiveDemand":"DOK 4: extended investigation, synthesis, revision","suggestedProcess":"At least two sessions: initial investigation, then new evidence and revision. Save an initial recommendation BEFORE consulting Stage 4.","prompt":"A club records memberships at years t=0,1,2,3 as 100,110,121,133. Two proposed models are L(t)=100+11t and E(t)=100(1.1)^t. The board needs a defensible year-8 forecast, not just one calculated number.","stages":[{"id":"stage-1","title":"Plan and initial investigation","prompt":"State what evidence would support each model and your comparison method. Compute predictions and signed residuals observed-minus-predicted at t=0..3. Compare sums of squared residuals; connect constant differences and ratios to model structure."},{"id":"stage-2","title":"Initial recommendation","prompt":"Write an initial model recommendation and year-8 forecast, with assumptions and limitations. Record what later observation would make you reconsider. Save this response before proceeding."},{"id":"stage-3","title":"Independent verification and boundary","prompt":"Use a second representation or calculation to verify forecasts. Compare model divergence at years 4 and 8. Explain why a better fit to four early observations does not prove the mechanism or justify indefinite growth."},{"id":"stage-4","title":"New evidence and revision","prompt":"NEW EVIDENCE: year-4 membership is 138 after a recruitment policy change. Recalculate each residual and total squared residual. Revisit your saved recommendation: retain, revise, or use a new piecewise model. Justify with numerical evidence AND context. Specify two further observations and a future review point."},{"id":"stage-5","title":"Transfer","prompt":"A second club starts with 200 members and the same proportional growth assumption. Transfer your model, contrast doubling the start with doubling the growth percentage, and explain what evidence is needed before accepting the transferred forecast."}],"rubric":[{"criterion":"Investigation design","points":4,"descriptor":"Documents an evidence-based plan and reproducible comparison in multiple representations."},{"criterion":"Synthesis and verification","points":4,"descriptor":"Correct residuals, forecasts, independent checks, and structural explanation."},{"criterion":"Revision","points":4,"descriptor":"Explicitly compares initial and revised recommendations using new evidence and context."},{"criterion":"Transfer and limits","points":4,"descriptor":"Justified transfer, uncertainty, data collection plan, and review trigger."}],"workedAnswer":["L predictions:100,111,122,133; residuals:0,-1,-1,0; SSE=2. E predictions:100,110,121,133.1; residuals:0,0,0,-0.1; SSE=0.01. Initial E fits better.","At t=4 L=144,E=146.41; at t=8 L=188,E=214.358881. Initial E year-8 forecast approximately 214, conditional on stable growth.","New t=4 residual: L=-6,E=-8.41. Revised SSE L=38; E=70.7381. L now has smaller total SSE, but policy change may invalidate both; a justified piecewise proposal anchored at (4,138) needs new post-change evidence, not an invented rate.","Transfer under same 10% growth: 200(1.1)^t, year8=428.717762. Doubling rate instead gives 100(1.2)^t and year8=429.981696; near coincidence at year8 does not make the models equivalent."],"independentMathProof":["E(t+1)/E(t)=1.1 and L(t+1)-L(t)=11 identify different mechanisms. E(8)=100*(11/10)^8=214.358881 verifies repeated multiplication independently.","New SSE values:2+36=38 and 0.01+8.41²=70.7381. Starting population scaling multiplies every prediction by 2; changing rate multiplies time-t prediction by (1.2/1.1)^t, which depends on t."],"transfer":"New baseline and changed rate; model monitoring","reviewPolicy":"Student self-review is formative only. No automatic or AI grading. A teacher must review the process, reasoning, and evidence to certify performance; this browser does not issue performance certification."},{"id":"eoc-performance-5","checkout":5,"title":"Develop and defend a general design rule","cognitiveDemand":"DOK 4: extended proof, sensitivity, constraints, transfer","suggestedProcess":"Three phases over at least two sessions: conjecture, proof, constraint revision. Preserve the initial design before Stage 4.","prompt":"A community plans a rectangular garden beside a wall. Three sides require fencing. Available fencing is F metres, with F>0. Develop a general design rule and defend its use when real constraints change.","stages":[{"id":"stage-1","title":"Investigate and conjecture","prompt":"Choose at least three different F values. Compare multiple feasible widths for each, organize normalized ratios x/F and area/F², and conjecture an optimum rule. Record the initial design recommendation and uncertainty."},{"id":"stage-2","title":"General proof and model comparison","prompt":"Prove or refute your conjecture for every F>0 using algebra. Compare your result with the claim that three equal fenced sides maximize area. Connect table, factored, and vertex forms; explain admissible domain."},{"id":"stage-3","title":"Sensitivity investigation","prompt":"Explore a 10% change in F and derive the exact effect on optimal dimensions and area. Explain why percentage change in area differs from percentage change in fence. Include an independent numerical check."},{"id":"stage-4","title":"New constraints and revision","prompt":"NEW CONSTRAINT: access requires width at least w metres; w>0. Classify every case relating w and F, including the feasibility boundary. Derive a piecewise rule and revisit your initial recommendation. For F=120,w=35 give a concrete revised plan."},{"id":"stage-5","title":"Transfer and defense","prompt":"The wall becomes unavailable and all four sides need fencing. Derive the new optimum independently. Compare best areas under the two models. Write a decision memo specifying which assumptions need site verification and how the design should be revised if they fail."}],"rubric":[{"criterion":"Sustained investigation","points":4,"descriptor":"Records multiple cases, normalized evidence, conjecture and initial recommendation."},{"criterion":"General proof","points":4,"descriptor":"Valid global proof, domains, and critique of equal-side alternative."},{"criterion":"Revision and cases","points":4,"descriptor":"Complete constrained piecewise rule and evidence-based recommendation revision."},{"criterion":"Transfer and sensitivity","points":4,"descriptor":"Independent four-side model, exact scaling, checks, and justified site verification."}],"workedAnswer":["A largest-area positive rectangle uses the full fencing budget: if fencing remains unused, length can increase while width stays fixed, increasing area. Thus 2x+length=F at the optimum.","A=x(F-2x)=F²/8-2(x-F/4)², with 0<x<F/2. Optimum width F/4, length F/2, area F²/8. Normalized optimum x/F=1/4,A/F²=1/8.","Equal fenced sides give x=length=F/3, area F²/9, smaller than F²/8 by F²/72.","Multiplying F by1.1 multiplies dimensions by1.1 and area by1.21 (21% gain). F=120 gives1800;F=132 gives2178, confirming gain378=0.21*1800.","If 0<w<=F/4: original optimum. If F/4<w<F/2: x=w, length=F-2w, area=w(F-2w). If w>=F/2: no positive-length garden. F=120,w=35 gives width35,length50,area1750.","Four sides: length=F/2-x; area=F²/16-(x-F/4)², 0<x<F/2. Optimum square side F/4, area F²/16, half the wall model maximum."],"independentMathProof":["Completing-square identities hold by expansion for every real x,F, not only sampled values. Nonnegative square proves uniqueness of maximum.","For constrained x=w+d with d>=0 and w>F/4: A(x)=A(w)+(F-4w)d-2d²<=A(w). If w>=F/2 the domain intersection is empty.","The four-side identity expands to (F/2)x-x²; square nonnegativity proves its global optimum independently."],"transfer":"General constraint rule and four-side model","reviewPolicy":"Student self-review is formative only. No automatic or AI grading. A teacher must review the process, reasoning, and evidence to certify performance; this browser does not issue performance certification."}];

const BWM_KEY = 'byrdway.mastery.v1';
const BWM_PASS = 0.8;

function bwmLoad(){
 try {const raw=JSON.parse(localStorage.getItem(BWM_KEY));
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return {};
 if(raw.schemaVersion===2)return validateBackup(raw);
 const safe={lang:BWM_LANGS.some(l=>l[0]===raw.lang)?raw.lang:'en',progress:{},results:{},best:{}};
 for(const bucket of ['progress','results'])if(raw[bucket]&&typeof raw[bucket]==='object')for(const [key,r] of Object.entries(raw[bucket])){
 if(!/^(diag|co[1-5])$/.test(key)||!r||typeof r!=='object'||!r.answers||typeof r.answers!=='object')continue;
 const items=key==='diag'?BWM_DIAGNOSTIC:BWM_CHECKOUTS[Number(key.slice(2))-1].items;const answers={};
 for(const q of items){const v=r.answers[q.id];if(Number.isInteger(v)&&v>=0&&v<q.o.length)answers[q.id]=v;}
 const c=items.filter(q=>answers[q.id]===0).length;
 safe[bucket][key]={answers,idx:Number.isInteger(r.idx)?Math.max(0,Math.min(items.length-1,r.idx)):0,correct:c,total:items.length,at:Number.isFinite(r.at)?r.at:Date.now()};
 if(bucket==='results')safe.best[key]=c/items.length;
 }return safe;
 }catch(e){return {};}
}
const DB = bwmLoad();
DB.lang = DB.lang || 'en';
DB.progress = DB.progress || {};   // examKey -> {idx, answers:{qid: optionIndex}}
DB.results = DB.results || {};     // examKey -> {answers, correct, total, at}
DB.best = DB.best || {};           // examKey -> best fraction
function bwmSave(){try{localStorage.setItem(BWM_KEY,JSON.stringify(DB));}catch(e){const el=document.getElementById('bwm-storage-status');if(el)el.textContent='Progress could not be saved. Export a JSON backup now.';else alert('Progress could not be saved. Export a JSON backup from the Mastery Hub.');}}

function t(key, vars){
  let s = (BWM_I18N[DB.lang] && BWM_I18N[DB.lang][key]) || BWM_I18N.en[key] || key;
  if(vars) Object.keys(vars).forEach(k => { s = s.split('{'+k+'}').join(vars[k]); });
  return s;
}
function langDir(){ const l = BWM_LANGS.find(x => x[0]===DB.lang); return l ? l[2] : 'ltr'; }
function math(m){ return `<span class="bwm-math" translate="no" dir="ltr">${esc(m).replace(/\n/g,'<br>')}</span>`; }
function optHTML(o){ return o.charAt(0)==='@' ? `<span>${esc(t(o.slice(1)))}</span>` : math(o); }
function wrap(inner){ return `<div class="bwm page" lang="${DB.lang}" dir="${langDir()}">${inner}</div>`; }
function areaName(id){ return t('area_'+id); }
function pct(x){ return Math.round(x*100)+'%'; }

/* deterministic shuffle so the correct answer (authored as o[0]) is not always first */
function order(q){
  let h = 2166136261; for(const ch of q.id){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const idx = q.o.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ h = Math.imul(h ^ (h>>>13), 1274126177); const j = Math.abs(h) % (i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx;
}

function examDef(key){
  if(key==='diag') return {key, items:diagnosticItems(), title:t('card_diag_t'), base:'#/diagnostic'};
  const n = +key.replace('co','');
  const co = BWM_CHECKOUTS.find(c => c.n===n);
  if(!co) return null;
  return {key, items:co.items, title:t('co'+n+'_n'), dok:co.dok, base:'#/eoc/'+n};
}
function dokLabel(d){ return d.charAt(0)==='@' ? t(d.slice(1)) : d; }
