Ученик решил уравнение, как показано. На каком шаге он впервые ошибся?","c2_2":"При каком значении k уравнение не имеет решений?","c2_3":"Прямая ℓ проходит через две данные точки. Какая точка тоже лежит на прямой ℓ?","c2_4":"Таблица задаёт линейную зависимость. Какое значение y пропущено?","c2_5":"У какой функции точки пересечения с осью x в точности такие же, как у g(x)?","c2_6":"При каких значениях a и b система имеет бесконечно много решений?","c2_7":"Лодка проходит 36 миль по течению за 2 часа. Обратный путь против течения занимает 3 часа. Какова скорость течения?","c2_8":"На счёт A начисляются простые проценты, а на счёт B — сложные, как показано; t — время в годах. Через сколько полных лет на счёте B впервые окажется больше денег, чем на счёте A?","c2_9":"Величина описывается функцией, где t — время. Примерно на сколько процентов уменьшается величина за каждую 1 единицу t?","c2_10":"(x + 3) — множитель многочлена. Чему равно k?","c2_11":"Вершина параболы находится в первой точке, и парабола проходит через вторую точку. Какое уравнение задаёт параболу?","c2_12":"Длина прямоугольника на 3 больше удвоенной ширины. Площадь прямоугольника равна 65 квадратным единицам. Какова ширина?","c2_13":"При каких значениях x равенство верно?","c2_14":"На сколько уменьшится среднее, если убрать из набора данных выброс 60?","c2_15":"У прямоугольника площадь A и ширина w, как показано. Его периметр равен 48. Чему равен x?","c3_1":"При каких значениях a решение неравенства имеет показанный вид?","c3_2":"Сколько целых чисел являются решениями неравенства?","c3_3":"Точки A, B и C лежат на одной прямой. Чему равно k?","c3_4":"Два графика пересекаются в двух точках. Чему равна сумма абсцисс точек пересечения?","c3_5":"При скольких целых значениях x выполняется f(x) > 0?","c3_6":"При каком значении k система не имеет решений?","c3_7":"Какова площадь области, удовлетворяющей обоим неравенствам?","c3_9":"Колония из 150 бактерий удваивается каждые 20 минут. За какое время колония достигнет 9,600 бактерий?","c3_10":"С помощью двух уравнений найдите значение x.","c3_12":"Парабола пересекает ось x в показанных точках и проходит через данную точку. В какой точке она пересекает ось y?","c3_13":"При каких значениях c уравнение имеет два различных действительных решения?","c3_15":"В группе из 120 учеников 70 занимаются спортом. Из тех, кто не занимается спортом, 20 подрабатывают. Какой процент учеников, не занимающихся спортом, подрабатывает?","c4_1":"При каком значении k уравнение имеет бесконечно много решений?","c4_2":"Прямая проходит через данную точку. Её отрезки на осях — a на оси x и b на оси y — положительны и равны. Чему равно a + b?","c4_3":"При каких значениях m прямая пересекает график ровно в двух точках?","c4_4":"Химик смешивает 20% раствор кислоты с 50% раствором кислоты и получает 60 литров 30% раствора. Сколько литров 20% раствора использовано?","c4_5":"Количество лекарства в организме уменьшается вдвое каждые 6 часов. Пациент принимает дозу 200 mg каждые 6 часов. Сколько лекарства в организме сразу после 4-й дозы?","c4_6":"Две модели предсказывают численность популяции через t лет. При каком наименьшем целом t выполняется g(t) > f(t)?","c4_8":"(x − 2) — множитель p(x). Каковы все нули p(x)?","c4_9":"При любом значении k вершина этой параболы лежит на одной и той же прямой. Что это за прямая?","c4_10":"Один из корней уравнения равен x = 3. Чему равен другой корень?","c4_11":"f — линейная функция, удовлетворяющая показанным условиям. Найдите значение.","c4_12":"Какая функция является обратной к h?","c4_13":"У набора данных указаны среднее и стандартное отклонение. Каждое значение умножают на 3, а затем прибавляют 5. Каковы новое среднее и новое стандартное отклонение?","c4_14":"В наборе 5 значений со средним 10. В набор добавляют значение 22. Чему равно новое среднее?","c4_15":"Две службы такси берут показанные суммы в долларах за поездку длиной d миль. При какой длине поездки служба A дешевле?","c5_3":"Две прямые перпендикулярны. Чему равно k?","c5_4":"Какова площадь области, ограниченной двумя графиками?","c5_5":"При каком значении a система не имеет решений?","c5_8":"При делении многочлена на (x − 2) остаток равен 7. Чему равно k?","c5_10":"У фермера есть 120 метров забора, чтобы построить прямоугольный загон вдоль прямой стены. Стена служит одной стороной, поэтому забор нужен только с трёх сторон. Какова наибольшая возможная площадь загона?","c5_11":"Уравнение имеет ровно одно действительное решение. Каковы все возможные значения k?","c5_12":"Чему равна сумма квадратов всех действительных решений уравнения?","c5_14":"Функция f удовлетворяет показанному правилу при любом x. Найдите значение.","c5_15":"Среднее пяти оценок за тесты равно 80. Если убрать самую низкую оценку, среднее остальных четырёх станет 86. Какой была самая низкая оценка?","op_distribute":"Раскройте скобки","op_combine":"Приведите подобные слагаемые","op_subboth":"Вычтите одно и то же из обеих частей","op_addboth":"Прибавьте одно и то же к обеим частям","op_divboth":"Разделите обе части на одно и то же число","op_slope":"Найдите угловой коэффициент","op_pointslope":"Запишите уравнение через точку и угловой коэффициент","op_solvey":"Выразите y","op_vertex":"Определите вершину","op_direction":"Определите направление ветвей","op_setzero":"Положите y = 0","op_twocases":"Рассмотрите два случая","op_addeq":"Сложите уравнения, чтобы исключить y","op_substitute":"Подставьте обратно","op_power":"Степень степени: показатели перемножаются","op_product":"Произведение степеней: показатели складываются","op_growth":"Рост: на каждом шаге умножаем на один и тот же множитель","op_findac":"Найдите a · c и пару чисел с суммой b","op_split":"Разбейте средний член","op_group":"Сгруппируйте и вынесите множитель из каждой пары","op_commonbin":"Вынесите общий двучлен","op_axis":"Найдите ось симметрии","op_height":"Найдите высоту вершины","op_zeros":"Найдите нули","op_discrim":"По дискриминанту определите число решений","op_factor":"Разложите на множители","op_zeroprod":"Приравняйте каждый множитель к нулю","op_solveeach":"Решите каждое уравнение","op_inner":"Сначала вычислите внутреннюю функцию","op_outer":"Подставьте результат во внешнюю функцию","op_swap":"Поменяйте x и y местами","op_mean":"Найдите среднее","op_median":"Найдите медиану","op_compare":"Сравните: выброс тянет среднее за собой","op_residual":"Найдите остаток: фактическое − предсказанное","L_solving-equations_p":"Уравнение — это весы. Что делаете с одной частью, то же делайте и с другой, поэтому решение никогда не меняется.","L_solving-equations_w":"Каждое обратное действие снимает один слой того, что сделали с x, в обратном порядке — как снять ботинки раньше носков.","L_linear-equations_p":"У прямой постоянная скорость изменения: каждый раз, когда x увеличивается на 1, y меняется на одну и ту же величину — угловой коэффициент m.","L_linear-equations_w":"Поскольку скорость не меняется, любые две точки прямой дают один и тот же угловой коэффициент, а одна точка и угловой коэффициент задают всю прямую.","L_linear-absvalue-functions_p":"|x| — это расстояние до нуля, поэтому оно никогда не бывает отрицательным. Его график — буква V с поворотом в вершине.","L_linear-absvalue-functions_w":"В y = a|x − h| + k изменение внутри модуля сдвигает график влево или вправо (против знака), а изменение снаружи — вверх или вниз (по знаку).","L_systems-equations_p":"Решение системы — это точка, в которой все уравнения верны одновременно, то есть точка пересечения графиков.","L_systems-equations_w":"Если два выражения равны одной и той же величине, то они равны друг другу. Подстановка и сложение — два способа использовать этот факт, чтобы исключить переменную.","L_exponents-exponential_p":"Показатель степени считает повторное умножение: xᵃ · xᵇ — это a множителей x и ещё b, то есть xᵃ⁺ᵇ.","L_exponents-exponential_w":"Каждое правило степеней следует из подсчёта множителей. Показательный рост — та же идея во времени: на каждом шаге умножаем на один и тот же множитель.","L_polynomials-factoring_p":"Разложение на множители — это умножение наоборот: распределительный закон, прочитанный справа налево.","L_polynomials-factoring_w":"Если a · c раскладывается на два числа, произведение которых равно a · c, а сумма равна b, можно разбить средний член и сгруппировать — и появится общий двучлен.","L_quadratic-functions_p":"График квадратичной функции — парабола, симметричная относительно вертикальной прямой, проходящей через её вершину.","L_quadratic-functions_w":"Для y = ax² + bx + c ось симметрии — x = −b/(2a), потому что значения x, одинаково удалённые от неё влево и вправо, дают одинаковый результат. Подставьте этот x, чтобы найти высоту вершины.","L_solving-quadratics_p":"Если произведение равно нулю, то хотя бы один из множителей равен нулю. Это свойство нулевого произведения.","L_solving-quadratics_w":"Каждый метод — разложение на множители, извлечение корня, выделение полного квадрата и формула корней — переписывает уравнение так, чтобы это свойство (или квадратный корень) завершило решение. Дискриминант b² − 4ac заранее показывает, сколько будет действительных решений.","L_working-with-functions_p":"Функция ставит в соответствие каждому входу ровно один выход.","L_working-with-functions_w":"Поскольку у каждого входа только один выход, функцию можно вычислять, составлять композицию, подставляя выход одной функции в другую, и обращать с помощью обратной функции — без двусмысленности.","L_analyzing-data_p":"У данных есть центр, разброс и форма. Модель хороша ровно настолько, насколько хороши её остатки.","L_analyzing-data_w":"Среднее — точка равновесия данных, медиана делит их пополам, а остаток (фактическое − предсказанное) показывает, насколько промахнулся прогноз."},"ht":{"_name":"Kreyòl Ayisyen","hub_title":"Sant Metriz Byrdway","hub_sub":"Fè dyagnostik → Preskri yon plan → Aprann apati premye prensip yo → Pwouve metriz ou nan Egzamen EOC yo.","lang_label":"Lang","lang_note":"Mo yo chanje nan lang ou. Matematik la pa janm chanje.", ","step_learn":"Leson Premye Prensip","step_cheat":"Fèy Rezime","step_blueprint":"Blueprint","step_flash":"Kat Memwa","step_test":"Teste Mwen","step_honors":"Nivo Onè","step_practice":"Pratike l","plan_next_checkout":"Pwochen egzamen nou rekòmande:","learn_title":"Leson Premye Prensip","learn_pick":"Chwazi yon domèn. Chak leson kòmanse ak lide tout rès la depann de li.","l_example":"Egzanp","l_principle":"Premye Prensip la","l_why":"Poukisa Li Vre","l_build":"Bati l Etap pa Etap","l_check":"Verifye l","l_try":"Se Tou Pa w","l_reveal":"Montre Repons lan","l_next":"Ale pi fon nan domèn sa a:","eoc_title":"Egzamen EOC","eoc_intro":"Senk egzamen fen kou, chak youn pi difisil pase sa ki anvan l. Fè 80% oswa plis pou montre metriz ou nan nivo sa a.","co1_n":"Egzamen En","co2_n":"Egzamen De","co3_n":"Egzamen Twa","co4_n":"Egzamen Kat","co5_n":"Egzamen Senk","co5_l":"Metriz Ekstrèm","co1_d":"Konpetans ak konsèp plizyè etap aplike nan yon kontèks.","co2_d":"Panse estratejik: rezònman, analiz erè, ak jistifikasyon.","co3_d":"Pwoblèm ki pa abityèl ki konekte plizyè reprezantasyon.","co4_d":"Rezònman pwolonje: jeneralize, sentetize, epi pwouve atravè sijè yo.","co5_d":"Defi nivo onè pou elèv ki vle vin enarètab.","best":"Pi bon nòt: {s}","mastered":"Metriz pwouve","not_taken":"Poko pran","questions_n":"{n} kesyon","area_solving-equations":"Rezoud Ekwasyon ak Inegalite","area_linear-equations":"Ekwasyon Lineyè","area_linear-absvalue-functions":"Fonksyon Lineyè ak Valè Absoli","area_systems-equations":"Sistèm Ekwasyon ak Inegalite Lineyè","area_exponents-exponential":"Ekspozan ak Fonksyon Eksponansyèl","area_polynomials-factoring":"Polinòm ak Faktorizasyon","area_quadratic-functions":"Fonksyon Kwadratik","area_solving-quadratics":"Rezoud Ekwasyon Kwadratik","area_working-with-functions":"Travay ak Fonksyon","area_analyzing-data":"Analize Done","tok_nosol":"Pa gen solisyon","tok_inf":"Yon enfinite solisyon","tok_one":"Egzakteman yon solisyon","tok_two":"Egzakteman de solisyon","tok_noreal":"Pa gen solisyon reyèl","tok_onereal":"Egzakteman yon solisyon reyèl","tok_tworeal":"De solisyon reyèl","tok_allreal":"Tout nonb reyèl","tok_never":"Janm","tok_noval":"Pa gen valè konsa ki egziste","tok_everyk":"Nenpòt valè k","tok_strongneg":"Asosyasyon lineyè negatif fò","tok_weakneg":"Asosyasyon lineyè negatif fèb","tok_strongpos":"Asosyasyon lineyè pozitif fò","tok_noassoc":"Pa gen asosyasyon lineyè","s_solvex":"Jwenn x.","s_solveineq":"Rezoud inegalite a.","s_solve":"Rezoud.","s_slope2":"Ki pant liy ki pase nan de pwen sa yo?","s_vertex":"Ki somè grafik la?","s_evalf":"Kalkile valè fonksyon an.","s_system":"Rezoud sistèm ekwasyon an.","s_howmany":"Konbyen solisyon sistèm nan genyen?","s_simplify":"Senplifye.","s_evaluate":"Kalkile.","s_factor":"Faktorize nèt.","s_multiply":"Miltipliye.","s_maxval":"Ki valè maksimòm fonksyon an?","s_axis":"Ki aks simetri a?","s_howmanyreal":"Konbyen solisyon reyèl ekwasyon an genyen?","s_fog2":"Jwenn f(g(2)).","s_mean":"Ki mwayèn done yo?","s_xints":"Ki kote grafik la travèse aks x la?","s_complsq":"Rezoud lè w konplete kare a.","s_finv":"Sèvi ak fonksyon envès la pou jwenn valè a.","s_whichfactor":"Ki ekspresyon ki se yon faktè polinòm nan?","s_evalexpr":"Jwenn valè a.","d5":"Ki ekwasyon, nan fòm pant-entèsepsyon, ki dekri liy ki gen pant 3 epi ki pase nan pwen yo bay la?","d6":"Ki liy ki paralèl ak liy yo bay la epi ki pase nan pwen (6, 3)?","d11":"Ki pwen ki se yon solisyon sistèm inegalite a?","d13":"Yon vil 500 moun grandi 6% chak ane. Ki fonksyon ki modèl popilasyon an apre t ane?","d23":"Ki ansanm pè òdone ki reprezante yon fonksyon?","d25":"Yon grafik nwaj pwen gen yon koyefisyan korelasyon r = −0.92. Ki fraz ki pi byen dekri asosyasyon an?","c1_3":"Yon plonbye mande yon frè fiks plis yon pri pa èdtan. Yon travay 2 èdtan koute $170 epi yon travay 5 èdtan koute $350. Ki ekwasyon ki bay pri C a, an dola, pou yon travay ki pran h èdtan?","c1_4":"Ki liy ki pèpandikilè ak liy yo bay la epi ki pase nan pwen yo bay la?","c1_5":"Yo reflete grafik fonksyon an sou aks x la, epi yo deplase l 3 inite adwat ak 2 inite anba. Ki fonksyon g(x) ki soti?","c1_7":"Yon lekòl vann 150 tikè pou yon pyès teyat pou yon total $1,480. Tikè granmoun koute $12 epi tikè elèv koute $8. Konbyen tikè elèv yo vann?","c1_9":"Yon machin ki vo $24,000 pèdi 15% nan valè l chak ane. Awondi nan dola ki pi pre a, konbyen li vo apre 3 ane?","c1_12":"Yo voye yon boul anlè. Wotè l an pye apre t segonn bay pa fonksyon an. Ki wotè maksimòm boul la?","c1_15":"Yo montre liy ki pi byen ajiste pou èdtan etid (x) ak nòt egzamen (y). Yon elèv etidye 6 èdtan epi li fè 85. Ki rezidi pou elèv sa a?","c2_1":"Yon elèv rezoud ekwasyon an jan yo montre l la. Nan ki etap li fè premye erè a?","c2_2":"Pou ki valè k ekwasyon an pa gen solisyon?","c2_3":"Liy ℓ pase nan de pwen yo bay yo. Ki pwen ki sou liy ℓ tou?","c2_4":"Tablo a montre yon relasyon lineyè. Ki valè y ki manke a?","c2_5":"Ki fonksyon ki gen egzakteman menm entèsepsyon x ak g(x)?","c2_6":"Pou ki valè a ak b sistèm nan gen yon enfinite solisyon?","c2_7":"Yon bato fè 36 mil ak kouran an nan 2 èdtan. Vwayaj retou kont kouran an pran 3 èdtan. Ki vitès kouran an?","c2_8":"Kont A touche enterè senp epi kont B touche enterè konpoze, jan yo montre l la, kote t an ane. Apre konbyen ane konplè kont B gen plis lajan pase kont A pou premye fwa?","c2_9":"Yo modèl yon kantite ak fonksyon an, kote t se tan an. Apeprè ki pousantaj kantite a diminye pou chak 1 inite t?","c2_10":"(x + 3) se yon faktè polinòm nan. Ki valè k?","c2_11":"Yon parabòl gen somè l nan premye pwen an epi li pase nan dezyèm pwen an. Ki ekwasyon ki reprezante parabòl la?","c2_12":"Longè yon rektang se 3 plis pase de fwa lajè l. Sifas rektang lan se 65 inite kare. Ki lajè a?","c2_13":"Pou ki valè x ekwasyon an vre?","c2_14":"Lè yo retire valè ekstrèm 60 nan done yo, konbyen mwayèn nan diminye?","c2_15":"Yon rektang gen sifas A ak lajè w, jan yo montre l la. Perimèt li se 48. Ki valè x?","c3_1":"Pou ki valè a inegalite a gen solisyon yo montre a?","c3_2":"Konbyen nonb antye ki se solisyon inegalite a?","c3_3":"Pwen A, B ak C sou menm liy lan. Ki valè k?","c3_4":"De grafik yo kwaze nan de pwen. Ki sòm kowòdone x pwen kwazman yo?","c3_5":"Pou konbyen valè antye x f(x) > 0?","c3_6":"Pou ki valè k sistèm nan pa gen solisyon?","c3_7":"Ki sifas rejyon ki satisfè tou de inegalite yo?","c3_9":"Yon koloni 150 bakteri double chak 20 minit. Konbyen tan koloni an ap pran pou l rive 9,600 bakteri?","c3_10":"Sèvi ak de ekwasyon yo pou jwenn valè x.","c3_12":"Yon parabòl gen entèsepsyon x yo montre yo epi li pase nan pwen yo bay la. Ki entèsepsyon y li?","c3_13":"Pou ki valè c ekwasyon an gen de solisyon reyèl diferan?","c3_15":"Nan yon gwoup 120 elèv, 70 fè espò. Pami elèv ki pa fè espò yo, 20 gen yon travay a tan pasyèl. Ki pousantaj elèv ki pa fè espò ki gen yon travay a tan pasyèl?","c4_1":"Pou ki valè k ekwasyon an gen yon enfinite solisyon?","c4_2":"Yon liy pase nan pwen yo bay la. Entèsepsyon x li, a, ak entèsepsyon y li, b, pozitif epi egal. Konbyen a + b fè?","c4_3":"Pou ki valè m liy lan kwaze grafik la nan egzakteman de pwen?","c4_4":"Yon chimis melanje yon solisyon asid 20% ak yon solisyon asid 50% pou fè 60 lit solisyon asid 30%. Konbyen lit solisyon 20% la yo itilize?","c4_5":"Kantite yon medikaman nan kò a diminye pa mwatye chak 6 èdtan. Yon pasyan pran yon dòz 200 mg chak 6 èdtan. Konbyen medikaman ki nan kò a touswit apre 4yèm dòz la?","c4_6":"De modèl prevwa gwosè yon popilasyon apre t ane. Ki pi piti nonb antye t pou g(t) > f(t)?","c4_8":"(x − 2) se yon faktè p(x). Ki tout zewo p(x) yo?","c4_9":"Pou chak valè k, somè parabòl sa a sou menm liy lan. Ki liy sa a?","c4_10":"Yon solisyon ekwasyon an se x = 3. Ki lòt solisyon an?","c4_11":"f se yon fonksyon lineyè ki satisfè kondisyon yo montre yo. Jwenn valè a.","c4_12":"Ki fonksyon ki se envès h?","c4_13":"Yon ansanm done gen mwayèn ak ekar tip yo montre yo. Yo miltipliye chak valè pa 3 epi yo ajoute 5. Ki nouvo mwayèn ak nouvo ekar tip la?","c4_14":"Yon ansanm done gen 5 valè ak yon mwayèn 10. Yo ajoute valè 22 nan ansanm nan. Ki nouvo mwayèn nan?","c4_15":"De konpayi taksi mande kantite yo montre yo, an dola, pou yon vwayaj d mil. Pou ki longè vwayaj konpayi A pi bon mache?","c5_3":"De liy yo pèpandikilè. Ki valè k?","c5_4":"Ki sifas rejyon de grafik yo fèmen an?","c5_5":"Pou ki valè a sistèm nan pa gen solisyon?","c5_8":"Lè yo divize polinòm nan pa (x − 2), rès la se 7. Ki valè k?","c5_10":"Yon kiltivatè gen 120 mèt kloti pou bati yon pak rektangilè bò yon miray dwat. Miray la fè yon kote, kidonk se sèlman twa kote ki bezwen kloti. Ki pi gwo sifas posib pak la?","c5_11":"Ekwasyon an gen egzakteman yon solisyon reyèl. Ki tout valè posib k?","c5_12":"Ki sòm kare tout solisyon reyèl ekwasyon an?","c5_14":"Fonksyon f satisfè règ yo montre a pou chak valè x. Jwenn valè a.","c5_15":"Mwayèn senk nòt egzamen se 80. Lè yo retire pi ba nòt la, mwayèn kat lòt nòt yo vin 86. Ki pi ba nòt la te ye?","op_distribute":"Distribye","op_combine":"Konbine tèm ki sanble yo","op_subboth":"Retire menm kantite a sou tou de bò","op_addboth":"Ajoute menm kantite a sou tou de bò","op_divboth":"Divize tou de bò pa menm nonb lan","op_slope":"Jwenn pant lan","op_pointslope":"Ekri fòm pwen-pant lan","op_solvey":"Izole y","op_vertex":"Li somè a","op_direction":"Deside ki bò li louvri","op_setzero":"Mete y = 0","op_twocases":"Separe an de ka","op_addeq":"Adisyone ekwasyon yo pou elimine y","op_substitute":"Ranplase ankò","op_power":"Règ pisans: miltipliye ekspozan yo","op_product":"Règ pwodui: adisyone ekspozan yo","op_growth":"Kwasans: miltipliye pa menm faktè a nan chak etap","op_findac":"Jwenn a · c ak pè ki fè b lè w adisyone yo","op_split":"Separe tèm nan mitan an","op_group":"Gwoupe epi faktorize chak pè","op_commonbin":"Fè binòm komen an soti","op_axis":"Jwenn aks simetri a","op_height":"Jwenn wotè somè a","op_zeros":"Jwenn zewo yo","op_discrim":"Sèvi ak diskriminan an pou konte solisyon yo","op_factor":"Faktorize","op_zeroprod":"Mete chak faktè egal a zewo","op_solveeach":"Rezoud chak ekwasyon","op_inner":"Kalkile fonksyon anndan an an premye","op_outer":"Mete rezilta sa a nan fonksyon deyò a","op_swap":"Chanje plas x ak y","op_mean":"Jwenn mwayèn nan","op_median":"Jwenn medyàn nan","op_compare":"Konpare: valè ekstrèm nan rale mwayèn nan","op_residual":"Jwenn rezidi a: reyèl − prevwa","L_solving-equations_p":"Yon ekwasyon se yon balans. Kèlkeswa sa w fè sou yon bò, ou dwe fè l sou lòt bò a tou, konsa solisyon an pa janm chanje.","L_solving-equations_w":"Chak operasyon envès defèt yon kouch nan sa yo te fè x, nan lòd envès — tankou retire soulye w anvan chosèt ou.","L_linear-equations_p":"Yon liy gen yon to chanjman konstan: chak fwa x ogmante 1, y chanje menm kantite a — se pant m lan.","L_linear-equations_w":"Paske to a pa janm chanje, nenpòt de pwen sou liy lan bay menm pant lan, epi yon pwen plis pant lan detèmine tout liy lan.","L_linear-absvalue-functions_p":"|x| vle di distans ak zewo, kidonk li pa janm negatif. Grafik li se yon V ki vire nan somè a.","L_linear-absvalue-functions_w":"Nan y = a|x − h| + k, yon chanjman anndan valè absoli a deplase grafik la agoch oswa adwat (opoze siy lan), epi yon chanjman deyò a deplase l anlè oswa anba (menm siy).","L_systems-equations_p":"Yon solisyon yon sistèm se yon pwen ki fè chak ekwasyon vre an menm tan — pwen kote grafik yo kwaze a.","L_systems-equations_w":"Si de ekspresyon egal ak menm kantite a, yo egal youn ak lòt. Sibstitisyon ak eliminasyon se de fason pou sèvi ak verite sa a pou retire yon varyab.","L_exponents-exponential_p":"Yon ekspozan konte yon miltiplikasyon ki repete: xᵃ · xᵇ se a faktè x swiv pa b lòt, sa vle di xᵃ⁺ᵇ.","L_exponents-exponential_w":"Chak règ ekspozan soti nan konte faktè. Kwasans eksponansyèl se menm lide a atravè tan: miltipliye pa menm faktè a nan chak etap.","L_polynomials-factoring_p":"Faktorize se miltipliye lanvè — se pwopriyete distribitif la li depi adwat rive agoch.","L_polynomials-factoring_w":"Lè a · c separe an de nonb ki bay a · c lè w miltipliye yo epi b lè w adisyone yo, ou ka separe tèm nan mitan an epi gwoupe, sa ki fè binòm komen an parèt.","L_quadratic-functions_p":"Grafik yon fonksyon kwadratik se yon parabòl, ki simetrik sou yon liy vètikal ki pase nan somè l.","L_quadratic-functions_w":"Pou y = ax² + bx + c, aks simetri a se x = −b/(2a), paske antre ki menm distans agoch ak adwat li bay menm rezilta. Ranplase x sa a pou jwenn wotè somè a.","L_solving-quadratics_p":"Si yon pwodui egal a zewo, omwen youn nan faktè li yo dwe egal a zewo. Se Pwopriyete Pwodui Zewo a.","L_solving-quadratics_w":"Chak metòd — faktorizasyon, rasin kare, konplete kare a, ak fòmil kwadratik la — reekri ekwasyon an pou pwopriyete sa a (oswa yon rasin kare) ka fini travay la. Diskriminan b² − 4ac la di w konbyen solisyon reyèl pou w tann anvan ou kòmanse.","L_working-with-functions_p":"Yon fonksyon bay chak antre egzakteman yon sèl rezilta.","L_working-with-functions_w":"Paske chak antre gen yon sèl rezilta, ou ka kalkile yon fonksyon, konpoze fonksyon lè w mete rezilta youn nan yon lòt, epi ranvèse yon fonksyon ak envès li — san okenn konfizyon.","L_analyzing-data_p":"Done gen yon sant, yon dispèsyon, ak yon fòm. Yon modèl bon menm jan ak rezidi li yo.","L_analyzing-data_w":"Mwayèn nan se pwen ekilib done yo, medyàn nan koupe done yo an de, epi yon rezidi (reyèl − prevwa) mezire konbyen yon prediksyon rate."},"vi":{"_name":"Tiếng Việt","hub_title":"Trung Tâm Thành Thạo Byrdway","hub_sub":"Chẩn đoán → Kê lộ trình → Học từ nguyên lý gốc → Chứng minh thành thạo qua các Bài Thi EOC.","lang_label":"Ngôn ngữ","lang_note":"Lời văn đổi sang ngôn ngữ của bạn. Toán học không bao giờ thay đổi.","lang_disclaimer":"Bản dịch giúp bạn hiểu bài. Nếu câu chữ nào chưa rõ, hãy hỏi giáo viên — phần toán luôn giữ nguyên hoàn toàn.","card_diag_t":"Bài Kiểm Tra Chẩn Đoán","card_diag_d":"20 câu hỏi trải đều 10 mảng. Biết chính xác bạn đang ở đâu.","card_plan_t":"Lộ Trình Riêng Của , rồi dịch sang phải 3 đơn vị và xuống dưới 2 đơn vị. Hàm số g(x) thu được là hàm nào?","c1_7":"Một trường bán được 150 vé xem kịch với tổng số tiền $1,480. Vé người lớn giá $12 và vé học sinh giá $8. Đã bán bao nhiêu vé học sinh?","c1_9":"Một chiếc xe trị giá $24,000 mất 15% giá trị mỗi năm. Làm tròn đến đô la gần nhất, sau 3 năm xe trị giá bao nhiêu?","c1_12":"Một quả bóng được ném lên. Độ cao tính bằng feet sau t giây được cho bởi hàm số. Độ cao lớn nhất của quả bóng là bao nhiêu?","c1_15":"Đường thẳng phù hợp nhất cho số giờ học (x) và điểm kiểm tra (y) được cho. Một học sinh học 6 giờ và được 85 điểm. Phần dư của học sinh này là bao nhiêu?","c2_1":"Một học sinh giải phương trình như hình. Học sinh mắc lỗi đầu tiên ở bước nào?","c2_2":"Với giá trị nào của k thì phương trình vô nghiệm?","c2_3":"Đường thẳng ℓ đi qua hai điểm đã cho. Điểm nào cũng nằm trên đường thẳng ℓ?","c2_4":"Bảng cho thấy một quan hệ tuyến tính. Giá trị còn thiếu của y là bao nhiêu?","c2_5":"Hàm số nào có các giao điểm với trục x giống hệt g(x)?","c2_6":"Với giá trị nào của a và b thì hệ có vô số nghiệm?","c2_7":"Một chiếc thuyền đi xuôi dòng 36 dặm trong 2 giờ. Chuyến về ngược dòng mất 3 giờ. Vận tốc dòng nước là bao nhiêu?","c2_8":"Tài khoản A hưởng lãi đơn và tài khoản B hưởng lãi kép như hình, với t tính bằng năm. Sau bao nhiêu năm tròn thì tài khoản B lần đầu có nhiều tiền hơn tài khoản A?","c2_9":"Một đại lượng được mô tả bởi hàm số, trong đó t là thời gian. Với mỗi 1 đơn vị t, đại lượng giảm khoảng bao nhiêu phần trăm?","c2_10":"(x + 3) là một nhân tử của đa thức. Giá trị của k là bao nhiêu?","c2_11":"Một parabol có đỉnh tại điểm thứ nhất và đi qua điểm thứ hai. Phương trình nào biểu diễn parabol đó?","c2_12":"Chiều dài của một hình chữ nhật hơn gấp đôi chiều rộng 3 đơn vị. Diện tích hình chữ nhật là 65 đơn vị vuông. Chiều rộng là bao nhiêu?","c2_13":"Với những giá trị nào của x thì đẳng thức đúng?","c2_14":"Khi bỏ giá trị ngoại lai 60 ra khỏi tập dữ liệu, giá trị trung bình giảm bao nhiêu?","c2_15":"Một hình chữ nhật có diện tích A và chiều rộng w như hình. Chu vi của nó là 48. Giá trị của x là bao nhiêu?","c3_1":"Với những giá trị nào của a thì bất phương trình có nghiệm như hình?","c3_2":"Có bao nhiêu số nguyên là nghiệm của bất phương trình?","c3_3":"Các điểm A, B và C thẳng hàng. Giá trị của k là bao nhiêu?","c3_4":"Hai đồ thị cắt nhau tại hai điểm. Tổng hoành độ của các giao điểm là bao nhiêu?","c3_5":"Có bao nhiêu giá trị nguyên của x để f(x) > 0?","c3_6":"Với giá trị nào của k thì hệ vô nghiệm?","c3_7":"Diện tích của miền thỏa mãn cả hai bất phương trình là bao nhiêu?","c3_9":"Một quần thể 150 vi khuẩn tăng gấp đôi sau mỗi 20 phút. Mất bao lâu để quần thể đạt 9,600 vi khuẩn?","c3_10":"Dùng hai phương trình để tìm giá trị của x.","c3_12":"Một parabol có các giao điểm với trục x như hình và đi qua điểm đã cho. Giao điểm với trục y của nó là bao nhiêu?","c3_13":"Với những giá trị nào của c thì phương trình có hai nghiệm thực phân biệt?","c3_15":"Trong một nhóm 120 học sinh, có 70 em chơi thể thao. Trong số các em không chơi thể thao, có 20 em làm việc bán thời gian. Bao nhiêu phần trăm số học sinh không chơi thể thao có việc làm bán thời gian?","c4_1":"Với giá trị nào của k thì phương trình có vô số nghiệm?","c4_2":"Một đường thẳng đi qua điểm đã cho. Hoành độ gốc a và tung độ gốc b của nó đều dương và bằng nhau. a + b bằng bao nhiêu?","c4_3":"Với những giá trị nào của m thì đường thẳng cắt đồ thị tại đúng hai điểm?","c4_4":"Một nhà hóa học trộn dung dịch axit 20% với dung dịch axit 50% để được 60 lít dung dịch axit 30%. Cần bao nhiêu lít dung dịch 20%?","c4_5":"Lượng thuốc trong cơ thể giảm một nửa sau mỗi 6 giờ. Một bệnh nhân uống liều 200 mg mỗi 6 giờ. Ngay sau liều thứ 4, trong cơ thể có bao nhiêu thuốc?","c4_6":"Hai mô hình dự đoán quy mô một quần thể sau t năm. Số nguyên t nhỏ nhất để g(t) > f(t) là bao nhiêu?","c4_8":"(x − 2) là một nhân tử của p(x). Tất cả các nghiệm của p(x) là gì?","c4_9":"Với mọi giá trị của k, đỉnh của parabol này luôn nằm trên cùng một đường thẳng. Đó là đường thẳng nào?","c4_10":"Một nghiệm của phương trình là x = 3. Nghiệm còn lại là gì?","c4_11":"f là một hàm số bậc nhất thỏa mãn các điều kiện như hình. Tìm giá trị.","c4_12":"Hàm số nào là hàm ngược của h?","c4_13":"Một tập dữ liệu có giá trị trung bình và độ lệch chuẩn như hình. Mỗi giá trị được nhân với 3 rồi cộng thêm 5. Giá trị trung bình và độ lệch chuẩn mới là bao nhiêu?","c4_14":"Một tập dữ liệu có 5 giá trị với trung bình là 10. Thêm giá trị 22 vào tập dữ liệu. Giá trị trung bình mới là bao nhiêu?","c4_15":"Hai hãng taxi tính giá như hình, bằng đô la, cho chuyến đi d dặm. Với những quãng đường nào thì hãng A rẻ hơn?","c5_3":"Hai đường thẳng vuông góc với nhau. Giá trị của k là bao nhiêu?","c5_4":"Diện tích của miền giới hạn bởi hai đồ thị là bao nhiêu?","c5_5":"Với giá trị nào của a thì hệ vô nghiệm?","c5_8":"Khi chia đa thức cho (x − 2), số dư là 7. Giá trị của k là bao nhiêu?","c5_10":"Một nông dân có 120 mét hàng rào để làm một chuồng hình chữ nhật dọc theo một bức tường thẳng. Bức tường làm một cạnh, nên chỉ cần rào ba cạnh. Diện tích lớn nhất có thể của chuồng là bao nhiêu?","c5_11":"Phương trình có đúng một nghiệm thực. Tất cả các giá trị có thể của k là gì?","c5_12":"Tổng bình phương của tất cả các nghiệm thực của phương trình là bao nhiêu?","c5_14":"Hàm số f thỏa mãn quy tắc như hình với mọi giá trị của x. Tìm giá trị.","c5_15":"Trung bình năm điểm kiểm tra là 80. Khi bỏ điểm thấp nhất, trung bình bốn điểm còn lại là 86. Điểm thấp nhất là bao nhiêu?","op_distribute":"Phân phối (nhân phá ngoặc)","op_combine":"Gộp các hạng tử đồng dạng","op_subboth":"Trừ cùng một lượng ở hai vế","op_addboth":"Cộng cùng một lượng vào hai vế","op_divboth":"Chia hai vế cho cùng một số","op_slope":"Tìm hệ số góc","op_pointslope":"Viết dạng điểm–hệ số góc","op_solvey":"Giải tìm y","op_vertex":"Đọc tọa độ đỉnh","op_direction":"Xác định hướng mở","op_setzero":"Cho y = 0","op_twocases":"Chia thành hai trường hợp","op_addeq":"Cộng các phương trình để khử y","op_substitute":"Thế ngược lại","op_power":"Quy tắc lũy thừa của lũy thừa: nhân các số mũ","op_product":"Quy tắc tích: cộng các số mũ","op_growth":"Tăng trưởng: nhân với cùng một thừa số ở mỗi bước","op_findac":"Tìm a · c và cặp số có tổng bằng b","op_split":"Tách hạng tử ở giữa","op_group":"Nhóm và phân tích từng cặp","op_commonbin":"Đặt nhị thức chung ra ngoài","op_axis":"Tìm trục đối xứng","op_height":"Tìm độ cao của đỉnh","op_zeros":"Tìm các nghiệm","op_discrim":"Dùng biệt thức để đếm số nghiệm","op_factor":"Phân tích thành nhân tử","op_zeroprod":"Cho từng nhân tử bằng không","op_solveeach":"Giải từng phương trình","op_inner":"Tính hàm bên trong trước","op_outer":"Đưa kết quả đó vào hàm bên ngoài","op_swap":"Đổi chỗ x và y","op_mean":"Tìm giá trị trung bình","op_median":"Tìm trung vị","op_compare":"So sánh: giá trị ngoại lai kéo lệch trung bình","op_residual":"Tìm phần dư: thực tế − dự đoán","L_solving-equations_p":"Phương trình là một chiếc cân. Bạn làm gì ở một vế thì phải làm y như vậy ở vế kia, nên nghiệm không bao giờ thay đổi.","L_solving-equations_w":"Mỗi phép toán ngược gỡ bỏ một lớp đã tác động lên x, theo thứ tự ngược lại — giống như cởi giày trước rồi mới cởi tất.","L_linear-equations_p":"Đường thẳng có tốc độ thay đổi không đổi: mỗi khi x tăng 1, y thay đổi cùng một lượng — đó là hệ số góc m.","L_linear-equations_w":"Vì tốc độ không bao giờ đổi, bất kỳ hai điểm nào trên đường thẳng cũng cho cùng hệ số góc, và một điểm cùng hệ số góc xác định cả đường thẳng.","L_linear-absvalue-functions_p":"|x| là khoảng cách đến số không, nên nó không bao giờ âm. Đồ thị của nó là hình chữ V gấp khúc tại đỉnh.","L_linear-absvalue-functions_w":"Trong y = a|x − h| + k, thay đổi bên trong dấu giá trị tuyệt đối dịch đồ thị sang trái hoặc phải (ngược dấu), còn thay đổi bên ngoài dịch đồ thị lên hoặc xuống (cùng dấu).","L_systems-equations_p":"Nghiệm của một hệ là điểm làm mọi phương trình đúng cùng lúc — điểm mà các đồ thị cắt nhau.","L_systems-equations_w":"Nếu hai biểu thức cùng bằng một đại lượng thì chúng bằng nhau. Phương pháp thế và phương pháp cộng đại số là hai cách dùng điều này để khử một ẩn.","L_exponents-exponential_p":"Số mũ đếm phép nhân lặp lại: xᵃ · xᵇ là a thừa số x rồi thêm b thừa số nữa, tức là xᵃ⁺ᵇ.","L_exponents-exponential_w":"Mọi quy tắc lũy thừa đều đến từ việc đếm thừa số. Tăng trưởng mũ là cùng ý tưởng đó theo thời gian: nhân với cùng một thừa số ở mỗi bước.","L_polynomials-factoring_p":"Phân tích thành nhân tử là phép nhân chạy ngược — tính chất phân phối đọc từ phải sang trái.","L_polynomials-factoring_w":"Khi a · c tách được thành hai số có tích bằng a · c và tổng bằng b, bạn có thể tách hạng tử ở giữa và nhóm lại, để lộ ra nhị thức chung.","L_quadratic-functions_p":"Đồ thị hàm số bậc hai là một parabol, đối xứng qua đường thẳng đứng đi qua đỉnh của nó.","L_quadratic-functions_w":"Với y = ax² + bx + c, trục đối xứng là x = −b/(2a), vì các giá trị đầu vào cách đều bên trái và bên phải nó cho cùng đầu ra. Thay x đó vào để tìm độ cao của đỉnh.","L_solving-quadratics_p":"Nếu một tích bằng không thì ít nhất một nhân tử của nó phải bằng không. Đây là Tính Chất Tích Bằng Không.","L_solving-quadratics_w":"Mọi phương pháp — phân tích nhân tử, khai căn, hoàn thành bình phương và công thức nghiệm — đều viết lại phương trình để tính chất này (hoặc phép khai căn) hoàn tất công việc. Biệt thức b² − 4ac cho bạn biết trước sẽ có bao nhiêu nghiệm thực.","L_working-with-functions_p":"Hàm số gán đúng một đầu ra cho mỗi đầu vào.","L_working-with-functions_w":"Vì mỗi đầu vào chỉ có một đầu ra, bạn có thể tính giá trị hàm, hợp các hàm bằng cách đưa đầu ra của hàm này vào hàm khác, và đảo ngược hàm bằng hàm ngược — không hề mơ hồ.","L_analyzing-data_p":"Dữ liệu có trung tâm, độ phân tán và hình dạng. Một mô hình chỉ tốt bằng các phần dư của nó.","L_analyzing-data_w":"Giá trị trung bình là điểm cân bằng của dữ liệu, trung vị chia dữ liệu làm đôi, và phần dư (thực tế − dự đoán) đo dự đoán lệch bao xa."},"ko":{"_name":"한국어","hub_title":"Byrdway 마스터리 허브","hub_sub":"진단 → 처방 → 제1원리부터 학습 → EOC 시험으로 완전 습득 증명.","lang_label":"언어","lang_note":"문장은 여러분의 언어로 바뀝니다. 수학은 절대 바뀌지 않습니다.","lang_disclaimer":"번역은 이해를 돕기 위한 것입니다. 표현이 분명하지 않으면 선생님께 물어보세요. 수학 내용은 항상 똑같습니다.","card_diag_t":"진단 평가","card_diag_d":"10개 영역 전체에서 20문항. 지금 내 실력을 정확히 확인하세요.","card_plan_t":"나의 맞춤 학습 계획","card_plan_d":"가장 약한 영역부터 가장 강한 영역까지 순서대로, 영역마다 다음에 할 일을 정확히 알려 줍니다.","card_learn_t":"제1원리 수업","card_learn_d":"각 단원이 기초로 삼는 핵심 원리에서 출발하는 단계별 수업.","card_eoc_t":"EOC 시험","card_eoc_d":"DOK 2.5에서 극한 마스터리까지 올라가는 다섯 개의 학년말 시험.","open":"열기","start":"시작","nav_hub":"마스터리 허브","tab_learn":"제1원리","back_hub":"← 마스터리 허브로 돌아가기","q_of":"{t}문항 중 {n}번","prev":"← 이전","next":"다음 →","finish":"마치고 채점하기","answered":"{t}문항 중 {n}문항 답함","confirm_unanswered":"아직 답하지 않은 문항이 {n}개 있습니다. 그래도 채점할까요?","results":"결과","score":"점수","by_area":"영역별 결과","retake":"다시 풀기","see_plan":"나의 맞춤 계획 보기","review":"모든 문항 다시 보기","your_answer":"내 답","correct_answer":"정답","solution":"단계별 풀이","correct":"정답","incorrect":"아직이에요","unanswered":"답하지 않음","diag_intro":"노트 없이 20문항 모두 답하세요. 가장 알맞은 답을 고르세요. 결과로 나만의 계획이 만들어집니다.","plan_none":"먼저 진단 평가를 보세요. 계획은 평가 결과로 만들어집니다.","plan_intro":"위에서 아래로 공부하세요. 가장 약한 영역이 맨 앞에 있는 이유는 그 부분을 고치면 점수가 가장 빨리 오르기 때문입니다.","plan_basis":"진단 평가와 EOC 시험에서 답한 {n}개 문항을 바탕으로 합니다.","band_fix":"가장 먼저 보완","band_build":"기초 다지기","band_strengthen":"강화하기","band_extend":"심화하기","band_fix_d":"제1원리부터 다시 세우고 연습하세요.","band_build_d":"Blueprint를 다시 풀고 핵심 공식을 확실히 익히세요.","band_strengthen_d":"플래시카드로 떠올리고 스스로 테스트하세요.","band_extend_d":"아너스 수준의 깊이까지 도전하세요.","step_learn":"제1원리 수업","step_cheat":"요약 노트","step_blueprint":"Blueprint","step_flash":"플래시카드","step_test":"테스트하기","step_honors":"아너스 단계","step_practice":"연습하기","plan_next_checkout":"추천하는 다음 시험:","learn_title":"제1원리 수업","learn_pick":"영역을 고르세요. 모든 수업은 나머지 전부가 기대고 있는 하나의 생각에서 시작합니다.","l_example":"예제","l_principle":"제1원리","l_why":"왜 성립할까","l_build":"단계별로 쌓기","l_check":"확인하기","l_try":"내 차례","l_reveal":"정답 보기","l_next":"이 영 3":"인구 500명인 마을이 매년 6%씩 늘어납니다. t년 후의 인구를 나타내는 함수는 무엇입니까?","d23":"함수를 나타내는 순서쌍의 집합은 무엇입니까?","d25":"어떤 산점도의 상관계수가 r = −0.92입니다. 상관관계를 가장 잘 설명하는 것은 무엇입니까?","c1_3":"배관공은 기본요금에 시간당 요금을 더해 받습니다. 2시간 작업은 $170, 5시간 작업은 $350입니다. h시간 걸리는 작업의 비용 C(달러)를 나타내는 식은 무엇입니까?","c1_4":"주어진 직선에 수직이고 주어진 점을 지나는 직선은 무엇입니까?","c1_5":"함수의 그래프를 x축에 대해 대칭이동한 다음, 오른쪽으로 3만큼, 아래로 2만큼 평행이동했습니다. 그 결과인 함수 g(x)는 무엇입니까?","c1_7":"한 학교에서 연극 표 150장을 팔아 총 $1,480을 벌었습니다. 어른 표는 $12, 학생 표는 $8입니다. 학생 표는 몇 장 팔렸습니까?","c1_9":"$24,000짜리 자동차가 매년 가치의 15%를 잃습니다. 3년 후 이 자동차의 가치는 1달러 단위로 반올림하면 얼마입니까?","c1_12":"공을 위로 던졌습니다. t초 후 공의 높이(피트)는 주어진 함수로 나타납니다. 공의 최고 높이는 얼마입니까?","c1_15":"공부 시간(x)과 시험 점수(y)에 대한 최적 직선이 주어져 있습니다. 한 학생이 6시간 공부하고 85점을 받았습니다. 이 학생의 잔차는 얼마입니까?","c2_1":"한 학생이 그림과 같이 방정식을 풀었습니다. 처음으로 실수한 단계는 어디입니까?","c2_2":"k가 어떤 값일 때 방정식의 해가 없습니까?","c2_3":"직선 ℓ은 주어진 두 점을 지납니다. 다음 중 직선 ℓ 위에 있는 점은 무엇입니까?","c2_4":"표는 선형 관계를 나타냅니다. 빠진 y 값은 얼마입니까?","c2_5":"g(x)와 x절편이 완전히 같은 함수는 무엇입니까?","c2_6":"a와 b가 어떤 값일 때 연립방정식의 해가 무수히 많습니까?","c2_7":"배가 강을 따라 내려가며 2시간 동안 36마일을 갑니다. 거슬러 올라오는 데는 3시간이 걸립니다. 물살의 속력은 얼마입니까?","c2_8":"그림과 같이 계좌 A는 단리, 계좌 B는 복리로 이자가 붙으며 t의 단위는 년입니다. 몇 년이 지나야 계좌 B의 돈이 처음으로 계좌 A보다 많아집니까?","c2_9":"어떤 양이 주어진 함수로 나타나며, t는 시간입니다. t가 1만큼 늘 때마다 이 양은 약 몇 퍼센트 줄어듭니까?","c2_10":"(x + 3)은 다항식의 인수입니다. k의 값은 얼마입니까?","c2_11":"포물선의 꼭짓점은 첫 번째 점이고, 두 번째 점을 지납니다. 이 포물선을 나타내는 식은 무엇입니까?","c2_12":"직사각형의 가로 길이는 세로 길이의 두 배보다 3만큼 깁니다. 넓이는 65제곱단위입니다. 세로 길이는 얼마입니까?","c2_13":"x가 어떤 값일 때 등식이 성립합니까?","c2_14":"자료에서 이상값 60을 빼면 평균은 얼마나 줄어듭니까?","c2_15":"그림과 같이 직사각형의 넓이는 A, 폭은 w입니다. 둘레는 48입니다. x의 값은 얼마입니까?","c3_1":"a가 어떤 값일 때 부등식의 해가 그림과 같습니까?","c3_2":"부등식을 만족하는 정수는 몇 개입니까?","c3_3":"점 A, B, C는 한 직선 위에 있습니다. k의 값은 얼마입니까?","c3_4":"두 그래프는 두 점에서 만납니다. 두 교점의 x좌표의 합은 얼마입니까?","c3_5":"f(x) > 0을 만족하는 정수 x는 몇 개입니까?","c3_6":"k가 어떤 값일 때 연립방정식의 해가 없습니까?","c3_7":"두 부등식을 모두 만족하는 영역의 넓이는 얼마입니까?","c3_9":"150마리의 세균 집단이 20분마다 두 배가 됩니다. 9,600마리가 되기까지 얼마나 걸립니까?","c3_10":"두 방정식을 이용하여 x의 값을 구하세요.","c3_12":"포물선의 x절편은 그림과 같고, 주어진 점을 지납니다. y절편은 얼마입니까?","c3_13":"c가 어떤 값일 때 방정식이 서로 다른 두 실근을 가집니까?","c3_15":"학생 120명 중 70명이 운동을 합니다. 운동을 하지 않는 학생 중 20명이 아르바이트를 합니다. 운동을 하지 않는 학생 중 아르바이트를 하는 학생은 몇 퍼센트입니까?","c4_1":"k가 어떤 값일 때 방정식의 해가 무수히 많습니까?","c4_2":"직선이 주어진 점을 지납니다. 이 직선의 x절편 a와 y절편 b는 양수이고 서로 같습니다. a + b는 얼마입니까?","c4_3":"m이 어떤 값일 때 직선이 그래프와 정확히 두 점에서 만납니까?","c4_4":"화학자가 20% 산 용액과 50% 산 용액을 섞어 30% 산 용액 60리터를 만듭니다. 20% 용액은 몇 리터 사용합니까?","c4_5":"몸속 약의 양은 6시간마다 절반으로 줄어듭니다. 환자가 6시간마다 200 mg씩 복용합니다. 4번째 복용 직후 몸속에 있는 약의 양은 얼마입니까?","c4_6":"두 모델이 t년 후의 개체 수를 예측합니다. g(t) > f(t)가 되는 가장 작은 정수 t는 무엇입니까?","c4_8":"(x − 2)는 p(x)의 인수입니다. p(x)의 모든 근은 무엇입니까?","c4_9":"k가 어떤 값이든 이 포물선의 꼭짓점은 같은 직선 위에 있습니다. 그 직선은 무엇입니까?","c4_10":"방정식의 한 근은 x = 3입니다. 다른 한 근은 무엇입니까?","c4_11":"f는 주어진 조건을 만족하는 일차함수입니다. 값을 구하세요.","c4_12":"h의 역함수는 무엇입니까?","c4_13":"어떤 자료의 평균과 표준편차가 주어져 있습니다. 각 값에 3을 곱한 뒤 5를 더합니다. 새로운 평균과 표준편차는 무엇입니까?","c4_14":"자료 5개의 평균이 10입니다. 여기에 값 22를 추가합니다. 새로운 평균은 얼마입니까?","c4_15":"두 택시 회사가 d마일 이동에 대해 그림과 같은 요금(달러)을 받습니다. 이동 거리가 어떨 때 A 회사가 더 저렴합니까?","c5_3":"두 직선은 서로 수직입니다. k의 값은 얼마입니까?","c5_4":"두 그래프로 둘러싸인 영역의 넓이는 얼마입니까?","c5_5":"a가 어떤 값일 때 연립방정식의 해가 없습니까?","c5_8":"다항식을 (x − 2)로 나눈 나머지가 7입니다. k의 값은 얼마입니까?","c5_10":"농부가 곧은 벽을 따라 직사각형 우리를 만들 울타리 120미터를 가지고 있습니다. 벽이 한 변이 되므로 세 변에만 울타리가 필요합니다. 우리의 최대 넓이는 얼마입니까?","c5_11":"방정식의 실근이 정확히 하나입니다. 가능한 k의 값을 모두 구하면?","c5_12":"방정식의 모든 실근의 제곱의 합은 얼마입니까?","c5_14":"함수 f는 모든 x에 대해 주어진 규칙을 만족합니다. 값을 구하세요.","c5_15":"시험 점수 다섯 개의 평균이 80입니다. 가장 낮은 점수를 빼면 나머지 네 점수의 평균은 86입니다. 가장 낮은 점수는 얼마였습니까?","op_distribute":"분배법칙으로 전개하기","op_combine":"동류항끼리 정리하기","op_subboth":"양변에서 같은 양 빼기","op_addboth":"양변에 같은 양 더하기","op_divboth":"양변을 같은 수로 나누기","op_slope":"기울기 구하기","op_pointslope":"점-기울기 형태로 쓰기","op_solvey":"y에 대해 풀기","op_vertex":"꼭짓점 읽기","op_direction":"그래프가 열리는 방향 정하기","op_setzero":"y = 0 대입하기","op_twocases":"두 경우로 나누기","op_addeq":"두 식을 더해 y 소거하기","op_substitute":"다시 대입하기","op_power":"거듭제곱의 거듭제곱: 지수끼리 곱하기","op_product":"같은 밑의 곱: 지수끼리 더하기","op_growth":"성장: 매 단계마다 같은 수를 곱하기","op_findac":"a · c를 구하고 합이 b인 두 수 찾기","op_split":"가운데 항 쪼개기","op_group":"묶어서 각 쌍 인수분해하기","op_commonbin":"공통 이항식으로 묶기","op_axis":"대칭축 구하기","op_height":"꼭짓점의 높이 구하기","op_zeros":"근 구하기","op_discrim":"판별식으로 해의 개수 세기","op_factor":"인수분해하기","op_zeroprod":"각 인수를 0으로 놓기","op_solveeach":"각 방정식 풀기","op_inner":"안쪽 함수 값을 먼저 구하기","op_outer":"그 결과를 바깥 함수에 넣기","op_swap":"x와 y 바꾸기","op_mean":"평균 구하기","op_median":"중앙값 구하기","op_compare":"비교하기: 이상값은 평균을 끌어당긴다","op_residual":"잔차 구하기: 실제값 − 예측값","L_solving-equations_p":"방정식은 저울입니다. 한쪽에 하는 일은 반드시 다른 쪽에도 해야 하므로 해는 절대 바뀌지 않습니다.","L_solving-equations_w":"각 역연산은 x에 했던 연산을 거꾸로 한 겹씩 벗겨 냅니다. 양말보다 신발을 먼저 벗는 것과 같습니다.","L_linear-equations_p":"직선은 변화율이 일정합니다. x가 1 늘 때마다 y는 항상 같은 양만큼 변하는데, 그것이 기울기 m입니다.","L_linear-equations_w":"변화율이 변하지 않으므로 직선 위의 어떤 두 점을 골라도 기울기가 같고, 한 점과 기울기만 알면 직선 전체가 정해집니다.","L_linear-absvalue-functions_p":"|x|는 0으로부터의 거리이므로 절대 음수가 아닙니다. 그래프는 꼭짓점에서 꺾이는 V 모양입니다.","L_linear-absvalue-functions_w":"y = a|x − h| + k에서 절댓값 안의 변화는 그래프를 좌우로(부호와 반대로), 바깥의 변화는 위아래로(부호와 같게) 움직입니다.","L_systems-equations_p":"연립방정식의 해는 모든 식을 동시에 참으로 만드는 점, 즉 그래프들이 만나는 점입니다.","L_systems-equations_w":"두 식이 같은 양과 같다면 두 식은 서로 같습니다. 대입법과 가감법은 이 사실을 이용해 변수 하나를 없애는 두 가지 방법입니다.","L_exponents-exponential_p":"지수는 반복된 곱셈의 횟수를 셉니다. xᵃ · xᵇ는 x를 a번 곱한 뒤 b번 더 곱한 것이므로 xᵃ⁺ᵇ입니다.","L_exponents-exponential_w":"모든 지수법칙은 곱해진 인수의 개수를 세는 데서 나옵니다. 지수적 성장은 같은 생각을 시간에 적용한 것으로, 매 단계마다 같은 수를 곱합니다.","L_polynomials-factoring_p":"인수분해는 곱셈을 거꾸로 하는 것, 즉 분배법칙을 오른쪽에서 왼쪽으로 읽는 것입니다.","L_polynomials-factoring_w":"a · c를 곱이 a · c이고 합이 b인 두 수로 나눌 수 있으면, 가운데 항을 쪼개 묶어서 공통 이항식 인수를 드러낼 수 있습니다.","L_quadratic-functions_p":"이차함수의 그래프는 포물선이며, 꼭짓점을 지나는 세로 직선에 대해 대칭입니다.","L_quadratic-functions_w":"y = ax² + bx + c의 대칭축은 x = −b/(2a)입니다. 그 왼쪽과 오른쪽으로 같은 거리에 있는 입력값은 같은 출력값을 주기 때문입니다. 그 x를 대입하면 꼭짓점의 높이를 구할 수 있습니다.","L_solving-quadratics_p":"곱이 0이면 인수 중 적어도 하나는 0입니다. 이것이 영인자 성질입니다.","L_solving-quadratics_w":"인수분해, 제곱근, 완전제곱식, 근의 공식 등 모든 방법은 이 성질(또는 제곱근)로 마무리할 수 있도록 식을 바꿔 쓰는 것입니다. 판별식 b² − 4ac는 풀기 전에 실근이 몇 개인지 알려 줍니다.","L_working-with-functions_p":"함수는 각 입력에 정확히 하나의 출력을 대응시킵니다.","L_working-with-functions_w":"각 입력의 출력이 하나뿐이므로 함숫값을 구하고, 한 함수의 출력을 다른 함수에 넣어 합성하고, 역함수로 함수를 되돌릴 수 있습니다. 모호함이 없습니다.","L_analyzing-data_p":"자료에는 중심, 퍼짐, 모양이 있습니다. 모델의 좋고 나쁨은 잔차가 결정합니다.","L_analyzing-data_w":"평균은 자료의 균형점이고, 중앙값은 자료를 반으로 나누며, 잔차(실제값 − 예측값)는 예측이 얼마나 빗나갔는지 측정합니다."},"ja":{"_name":"日本語","hub_title":"Byrdway マスタリー・ハブ","hub_sub":"診断 → 処方 → 第一原理から学ぶ → EOC テストで習熟を証明。","lang_label":"言語","lang_note":"文章はあなたの言語に変わります。数学は決して変わりません。","lang_disclaimer":"翻訳は理解を助けるためのものです。わかりにくい表現があれば先生に聞いてください。数学の内容は常にまったく同じです。","card_diag_t":"診断テスト","card_diag_d":"全 10 分野から 20 問。今の自分の位置を正確に知ろう。","card_plan_t":"私の個別学習プラン","card_plan_d":"苦手な分野から得意な分野の順に並べ、それぞれの次の一歩を具体的に示します。","card_learn_t":"第一原理レッスン","card_learn_d":"各単元の土台となる根本的な真理から始める、ステップごとの授業。","card_eoc_t":"EOC テスト","card_eoc_d":"DOK 2.5 から究極の習熟まで段階的に難しくなる 5 つの学年末テスト。","open":"開く","start":"始める","nav_hub":"マスタリー・ハブ","tab_learn":"第一原理","back_hub":"← マスタリー・ハブに戻る","q_of":"第 {n} 問（全 {t} 問）","prev":"← 前へ","next":"次へ →","finish":"終了して採点","answered":"{t} 問中 {n} 問回答済み","confirm_unanswered":"まだ {n} 問が未回答です。このまま採点しますか？","results":"結果","score":"得点","by_area":"分野別の結果","retake":"もう一度受ける","see_plan":"個別学習プランを見る","review":"すべての問題を振り返る","your_answer":"あなたの答え","correct_answer":"正解","solution":"ステップごとの解説","correct":"正解","incorrect":"もう少し","unanswered":"未回答","diag_intro":"ノートを見ずに 20 問すべてに答えてください。最も適切な答えを選びましょう。結果からあなた専用のプランが作られます。","plan_none":"まず診断テストを受けてください。プランはその結果から作られます。","plan_intro":"上から順に取り組みましょう。苦手な分野が先頭にあるのは、そこを直すと最も早く点数が上がるからです。","plan_basis":"診断テストと EOC テストで回答した {n} 問に基づいています。","band_fix":"最優先で克服","band_build":"土台づくり","band_strengthen":"強化","band_extend":"発展","band_fix_d":"第一原理から組み立て直し、練習しましょう。","band_build_d":"Blueprint をやり直し、重要な公式を定着させましょう。","band_strengthen_d":"フラッシュカードで思い出し、自分をテストしましょう。","band_extend_d":"オナーズレベルの深さに挑戦しましょう。","step_learn":"第一原理レッスン","step_cheat":"まとめシート","step_blueprint":"Blueprint","step_flash":"フラッシュカード","step_test":"腕だめし","step_honors":"オナーズ編","step_practice":"練習する","plan_next_checkout":"次におすすめのテスト：","learn_title":"第一原理レッスン",
