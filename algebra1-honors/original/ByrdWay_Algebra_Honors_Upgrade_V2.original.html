/* ---------- Exams: Diagnostic + EOC Checkouts ---------- */
function prog(key){ return DB.progress[key] || (DB.progress[key] = {idx:0, answers:{}}); }

function renderExam(key){
  const ex = examDef(key); if(!ex) return wrap('');
  const p = prog(key);
  const n = ex.items.length;
  p.idx = Math.min(Math.max(p.idx,0), n-1);
  const q = ex.items[p.idx];
  const done = Object.keys(p.answers).length;
  const ord = order(q);
  const letters = 'ABCD';
  const opts = ord.map((oi,k) => `<button type="button" class="bwm-opt ${p.answers[q.id]===oi?'on':''}" aria-pressed="${p.answers[q.id]===oi}" onclick="BWM.pick('${key}','${q.id}',${oi})">
      <span class="bwm-letter" translate="no">${letters[k]}</span>${optHTML(q.o[oi])}</button>`).join('');
  const dots = ex.items.map((it,i) => `<button type="button" class="bwm-dot ${p.answers[it.id]!==undefined?'done':''} ${i===p.idx?'cur':''}" onclick="BWM.go('${key}',${i})" translate="no" aria-label="${i+1}">${i+1}</button>`).join('');
  const intro = key==='diag' ? `<p class="hint">${esc(t('diag_intro'))}</p>` : `<p class="hint">${esc(t('co'+key.slice(2)+'_d'))}</p>`;
  return wrap(`<h2>${esc(ex.title)} ${ex.dok?`<span class="bwm-dok ${ex.dok.charAt(0)==='@'?'x':''}">${esc(dokLabel(ex.dok))}</span>`:''}</h2>
    ${intro}
    <div class="bwm-qhead"><span>${esc(t('q_of',{n:p.idx+1,t:key==='diag'?p.target:n}))}</span><span>${esc(t('answered',{n:done,t:key==='diag'?p.target:n}))}</span></div>
    <div class="bwm-progress"><i style="width:${Math.round(done/(key==="diag"?p.target:n)*100)}%"></i></div>
    <div class="bwm-qcard">
      <div class="bwm-qhead"><span>${esc(areaName(q.a))}</span></div>
      <p class="bwm-stem" id="bwm-current-question" tabindex="-1">${esc(t(q.s))}</p>
      ${q.m?`<div class="bwm-mathbox">${math(q.m)}</div>`:''}
      <div class="bwm-opts" role="group" aria-labelledby="bwm-current-question">${opts}</div>
    </div>
    <div class="bwm-nav">
      <button type="button" class="bwm-btn ghost" ${p.idx===0?'disabled':''} onclick="BWM.go('${key}',${p.idx-1})">${esc(t('prev'))}</button>
      ${p.idx<n-1 ? `<button type="button" class="bwm-btn alt" onclick="BWM.go('${key}',${p.idx+1})">${esc(t('next'))}</button>` : ''}
      <button type="button" class="bwm-btn" onclick="BWM.finish('${key}')">${esc(t('finish'))}</button>
    </div>
    <div class="bwm-dots">${dots}</div>
    <p><a href="#/mastery">${esc(t('back_hub'))}</a></p>`);
}

function scoreExam(key, answers, savedItems){
  const ex = examDef(key);
  const byArea = {};
  let correct = 0;
  (savedItems || ex.items).forEach(q => {
    const ok = answers[q.id] === 0;
    if(ok) correct++;
    const b = byArea[q.a] || (byArea[q.a] = {c:0, n:0});
    b.n++; if(ok) b.c++;
  });
  return {correct, total:(savedItems || ex.items).length, byArea};
}

function barColor(f){ return f>=0.85 ? 'var(--green)' : f>=0.7 ? 'var(--blue)' : f>=0.5 ? '#fb923c' : 'var(--red)'; }

function renderResults(key){
  const originalDef = examDef(key); const r = originalDef && DB.results[key]; const ex = originalDef && key==='diag' && r ? {...originalDef,items:r.ids?r.ids.map(id=>BANK_BY_ID[id]).filter(Boolean):BWM_DIAGNOSTIC}:originalDef;
  if(!r) return renderExam(key);
  const s = scoreExam(key, r.answers, ex.items);
  const bars = AREAS.filter(a => s.byArea[a.id]).map(a => {
    const b = s.byArea[a.id], f = b.c/b.n;
    return `<div class="bwm-bar"><span>${esc(areaName(a.id))}</span><span class="bwm-track"><i style="width:${Math.max(f*100,2)}%;background:${barColor(f)}"></i></span><span translate="no">${b.c}/${b.n}</span></div>`;
  }).join('');
  const review = ex.items.map((q,i) => {
    const pick = r.answers[q.id];
    const st = pick===undefined ? 'na' : pick===0 ? 'ok' : 'no';
    const label = st==='ok' ? t('correct') : st==='no' ? t('incorrect') : t('unanswered');
    return `<div class="bwm-qcard bwm-review ${st}">
      <div class="bwm-qhead"><span translate="no">#${i+1}</span><span class="bwm-tag ${st}">${esc(label)}</span></div>
      <p class="bwm-stem">${esc(t(q.s))}</p>${q.m?`<div class="bwm-mathbox">${math(q.m)}</div>`:''}
      ${pick!==undefined && pick!==0 ? `<p><b>${esc(t('your_answer'))}:</b> ${optHTML(q.o[pick])}</p>`:''}
      <p><b>${esc(t('correct_answer'))}:</b> ${optHTML(q.o[0])}</p>
      <details><summary>${esc(t('solution'))}</summary><ol class="bwm-steps">${q.w.map((w,k)=>`<li><span class="bwm-sn">${k+1}</span>${math(w)}</li>`).join('')}</ol></details>
      ${st!=='ok'?`<div class="fixthis"><a href="#/learn/${q.a}">→ ${esc(t('step_learn'))}</a> · <a href="#/area/${q.a}/blueprint">→ ${esc(t('step_blueprint'))}</a></div>`:''}
    </div>`;
  }).join('');
  const f = s.correct/s.total;
  return wrap(`<h2>${esc(ex.title)} — ${esc(t('results'))} ${ex.dok?`<span class="bwm-dok ${ex.dok.charAt(0)==='@'?'x':''}">${esc(dokLabel(ex.dok))}</span>`:''}</h2>
    <div class="cs-page"><p class="bwm-score" translate="no">${s.correct}/${s.total} · ${pct(f)}</p>
      ${key!=='diag' && f>=BWM_PASS ? `<p class="bwm-done">✓ ${esc(t('mastered'))}</p>`:''}
      <h3>${esc(t('by_area'))}</h3><div class="bwm-bars">${bars}</div>
      <div style="margin-top:14px"><a class="bwm-btn" href="#/plan">${esc(t('see_plan'))}</a>
      <button type="button" class="bwm-btn ghost" onclick="BWM.retake('${key}')">${esc(t('retake'))}</button></div></div>
    <h3>${esc(t('review'))}</h3>${review}
    <p><a href="#/mastery">${esc(t('back_hub'))}</a></p>`);
}

/* ---------- Prescriptive plan: weakest → strongest ---------- */
function areaStats(){
  const agg = {};
  Object.keys(DB.results).forEach(key => {
    if(!examDef(key)) return;
    const s = scoreExam(key, DB.results[key].answers, key==='diag'?(DB.results[key].ids?DB.results[key].ids.map(id=>BANK_BY_ID[id]).filter(Boolean):BWM_DIAGNOSTIC):undefined);
    Object.keys(s.byArea).forEach(id => { const g = agg[id] || (agg[id]={c:0,n:0}); g.c += s.byArea[id].c; g.n += s.byArea[id].n; });
  });
  return agg;
}
function band(f){
  if(f < 0.5) return {k:'fix', color:'var(--red)', steps:[['learn','#/learn/'],['blueprint','/blueprint'],['practice','/interactive'],['flash','/flashcards'],['test','/testme']]};
  if(f < 0.7) return {k:'build', color:'#fb923c', steps:[['blueprint','/blueprint'],['cheat','/cheatsheet'],['flash','/flashcards'],['test','/testme']]};
  if(f < 0.85) return {k:'strengthen', color:'var(--blue)', steps:[['flash','/flashcards'],['test','/testme'],['learn','#/learn/']]};
  return {k:'extend', color:'var(--green)', steps:[['honors','/honors'],['test','/testme']]};
}
function renderPlan(){
  const agg = areaStats();
  const answered = Object.values(agg).reduce((s,g)=>s+g.n,0);
  if(!answered) return wrap(`<h2>${esc(t('card_plan_t'))}</h2><div class="cs-page"><p>${esc(t('plan_none'))}</p>
    <a class="bwm-btn" href="#/diagnostic">${esc(t('start'))}: ${esc(t('card_diag_t'))}</a></div>`);
  const ranked = AREAS.filter(a => agg[a.id]).map(a => ({a, f:agg[a.id].c/agg[a.id].n, g:agg[a.id]}))
    .sort((x,y) => x.f - y.f || x.a.num - y.a.num);
  const items = ranked.map((r,i) => {
    const b = band(r.f);
    const links = b.steps.map(([s,path],k) => {
      const href = path.charAt(0)==='#' ? path + r.a.id : `#/area/${r.a.id}${path}`;
      return `<a href="${href}"><b translate="no">${k+1}</b>${esc(t('step_'+s))}</a>`;
    }).join('');
    return `<div class="bwm-plan-item" style="border-inline-start-color:${b.color}">
      <h3><span class="bwm-rank" translate="no">${i+1}</span>${esc(areaName(r.a.id))}
        <span class="bwm-band" style="background:${b.color}">${esc(t('band_'+b.k))}</span>
        <span class="bwm-note" translate="no">${r.g.c}/${r.g.n} · ${pct(r.f)}</span></h3>
      <p class="hint">${esc(t('band_'+b.k+'_d'))}</p><div class="bwm-plan-links">${links}</div></div>`;
  }).join('');
  const nextCo = BWM_CHECKOUTS.find(c => (DB.best['co'+c.n]||0) < BWM_PASS);
  return wrap(`<h2>${esc(t('card_plan_t'))}</h2>
    <p class="hint">${esc(t('plan_intro'))}</p><p class="bwm-note">${esc(t('plan_basis',{n:answered}))}</p>
    ${items}
    ${nextCo?`<div class="cs-page"><p><b>${esc(t('plan_next_checkout'))}</b> ${esc(t('co'+nextCo.n+'_n'))} <span class="bwm-dok ${nextCo.dok.charAt(0)==='@'?'x':''}">${esc(dokLabel(nextCo.dok))}</span></p>
      <a class="bwm-btn" href="#/eoc/${nextCo.n}">${esc(t('start'))}</a></div>`:''}
    <p><a href="#/mastery">${esc(t('back_hub'))}</a></p>`);
}

/* ---------- Router layer (runs after the original route()) ---------- */
function decorate(parts){
  const links = document.querySelector('#app .navlinks');
  if(links && !links.querySelector('.bwm-navlink')){
    const a = document.createElement('a');
    a.href = '#/mastery'; a.className = 'bwm-navlink'; a.textContent = t('nav_hub');
    if(['mastery','diagnostic','plan','learn','eoc'].includes(parts[0])) a.classList.add('active');
    links.insertBefore(a, links.querySelector('a[href="#/how"]'));
  }
  const tabbar = document.querySelector('#app .area-tabbar');
  if(tabbar && parts[0]==='area' && parts[1] && !tabbar.querySelector('.bwm-tab')){
    const a = document.createElement('a');
    a.href = '#/learn/'+parts[1]; a.className = 'bwm-tab'; a.textContent = '🧠 '+t('tab_learn');
    tabbar.appendChild(a);
  }
  document.querySelectorAll('#app .cc-formula, #app .ti-diagram, #app .fc-diagram').forEach(el => el.setAttribute('translate','no'));
}

function bwmRoute(){
  const hash = (!location.hash || location.hash==='#/' || location.hash==='#') ? '#/home' : location.hash;
  const parts = hash.replace('#/','').split('/');
  const app = document.getElementById('app');
  if(!app) return;
  let body = null;
  if(parts[0]==='mastery') body = renderHub();
  else if(parts[0]==='diagnostic') body = parts[1]==='results' ? renderResults('diag') : renderExam('diag');
  else if(parts[0]==='plan') body = renderPlan();
  else if(parts[0]==='learn') body = parts[1] ? renderLesson(parts[1]) : renderLearnIndex();
  else if(parts[0]==='eoc') body = parts[1] ? (parts[2]==='results' ? renderResults('co'+parts[1]) : renderExam('co'+parts[1])) : renderEocList();
  if(body !== null){
    app.innerHTML = navBar() + body;
  } else if(parts[0]==='home'){
    const page = app.querySelector('.page');
    if(page && !page.querySelector('.bwm-hero')) page.insertAdjacentHTML('afterbegin', '<h1>Dashboard</h1>'+hubBlock());
  }
  decorate(parts);
}

window.BWM = {
  setLang(l){ if(BWM_LANGS.some(x=>x[0]===l)){ DB.lang = l; bwmSave(); const y = window.scrollY; route(); bwmRoute(); window.scrollTo(0,y); } },
  pick(key, qid, oi){ const p = prog(key); p.answers[qid] = oi; bwmSave(); const y = window.scrollY; bwmRoute(); window.scrollTo(0,y); },
  go(key, i){ prog(key).idx = i; bwmSave(); bwmRoute(); window.scrollTo(0,0); },
  finish(key){
    const ex = examDef(key); const p = prog(key);
    const missing = ex.items.length - Object.keys(p.answers).length;
    if(missing > 0 && !window.confirm(t('confirm_unanswered',{n:missing}))) return;
    const s = scoreExam(key, p.answers);
    DB.results[key] = {answers:Object.assign({}, p.answers), correct:s.correct, total:s.total, at:Date.now()};
    DB.best[key] = Math.max(DB.best[key]||0, s.correct/s.total);
    delete DB.progress[key];
    bwmSave();
    location.hash = ex.base + '/results';
  },
  retake(key){ const ex = examDef(key); delete DB.progress[key]; bwmSave(); if(location.hash===ex.base) bwmRoute(); else location.hash = ex.base; window.scrollTo(0,0); }
};

DB.schemaVersion=2;
DB.history=Array.isArray(DB.history)?DB.history:[];
DB.attempts=Array.isArray(DB.attempts)?DB.attempts:[];
DB.lessons=DB.lessons&&typeof DB.lessons==='object'&&!Array.isArray(DB.lessons)?DB.lessons:{};
function evidenceFor(p){
 const by={};
 for(const id of p.ids||[]){const q=BANK_BY_ID[id];if(!q||p.answers[id]===undefined)continue;
  const g=by[q.a]||(by[q.a]={c:0,n:0,skills:{},errors:[]});g.n++;if(p.answers[id]===0)g.c++;
  const sk=g.skills[q.skill]||(g.skills[q.skill]={c:0,n:0});sk.n++;if(p.answers[id]===0)sk.c++;else g.errors.push(q.skill);
 }return by;
}
function selectAdaptive(p){
 const evidence=evidenceFor(p), unused=BWM_BANK.filter(q=>!p.ids.includes(q.id));

rategic reasoning and error analysis","suggestedProcess":"One or two lessons","prompt":"A play sells 150 tickets. Adult tickets cost $12 and student tickets $8. Reported revenue is $1,480. Someone claims 90 adults and 60 students were sold.","stages":[{"id":"stage-1","title":"Model and audit","prompt":"Write and solve a system. Audit the claim by checking BOTH constraints. Explain why checking only the ticket total is insufficient."},{"id":"stage-2","title":"Alternative evidence","prompt":"Show a second solution method. Explain what information would be lost if only the revenue equation were known."},{"id":"stage-3","title":"Revisit","prompt":"The office corrects revenue to $1,500. Decide whether that total is possible with 150 tickets. Generalize all possible revenues for 150 tickets."}],"rubric":[{"criterion":"Model and solution","points":4,"descriptor":"Accurate constraints and independently checked solution."},{"criterion":"Critique","points":4,"descriptor":"Claim tested against both conditions with logical explanation."},{"criterion":"Generalization","points":4,"descriptor":"Feasibility and revenue pattern proved, including bounds and integer condition."}],"workedAnswer":["a+s=150 and 12a+8s=1480 imply 4a=280, a=70,s=80. Claim revenue=1560, so claim fails.","Start from 150 student tickets: $1200. Each adult replacement adds $4; 280/4=70 replacements.","Revenue R=1200+4a for integer 0<=a<=150: possible totals are multiples of $4 from $1200 to $1800. $1500 is possible with a=75,s=75.","Revenue alone does not uniquely determine both counts: (a,s)=(0,185) and (70,80) both yield $1480, but only (70,80) totals 150 tickets."],"independentMathProof":["Eliminating 8(a+s)=1200 from revenue leaves 4a=280; substituting 70,80 gives both original constraints.","The map a ->1200+4a is both necessary and sufficient: each integer a in the domain constructs a valid ticket mix."],"transfer":"Changed revenue and feasibility","reviewPolicy":"Student self-review is formative only. No automatic or AI grading. A teacher must review the process, reasoning, and evidence to certify performance; this browser does not issue performance certification."},{"id":"eoc-performance-3","checkout":3,"title":"Design a fenced garden","cognitiveDemand":"DOK 3: non-routine reasoning across representations","suggestedProcess":"Two lessons with model critique","prompt":"A rectangular garden uses a straight wall as one side and all 120 m of fencing for the other three sides. The width perpendicular to the wall is x.","stages":[{"id":"stage-1","title":"Build and connect","prompt":"Develop an area equation, a table, and a sketch description. State the physically meaningful domain. Use factoring and vertex form to explain the same model."},{"id":"stage-2","title":"Optimize and justify","prompt":"Find the best dimensions. Prove your recommendation globally over the domain rather than checking only a few cases."},{"id":"stage-3","title":"Transfer and critique","prompt":"A path requires width x>=35 m. Revise the optimum and compare lost area. Explain why using 60 m for every side is invalid."}],"rubric":[{"criterion":"Model","points":4,"descriptor":"A=x(120-2x), domain and connected representations correct."},{"criterion":"Justification","points":4,"descriptor":"Vertex/completing-square proof of global maximum."},{"criterion":"Transfer","points":4,"descriptor":"Constrained optimum and invalid alternative explained."}],"workedAnswer":["Length=120-2x; domain 0<x<60. A=-2x²+120x=-2(x-30)²+1800. Table at x=10,20,30,40,50: A=1000,1600,1800,1600,1000.","Maximum 1800 m² at x=30 m, length 60 m.","For 35<=x<60, (x-30)² grows with x; best x=35, length=50, area=1750, loss=50 m². Three 60 m fenced sides need 180 m, violating the budget."],"independentMathProof":["Because a square is nonnegative, A<=1800 with equality exactly at x=30.","For x>=35, write x=35+d with d>=0: A=1750-20d-2d²<=1750."],"transfer":"Additional physical constraint","reviewPolicy":"Student self-review is formative only. No automatic or AI grading. A teacher must review the process, reasoning, and evidence to certify performance; this browser does not issue performance certification."},{"id":"eoc-performance-4","checkout":4,"title":"Investigate competing growth models","cognitiveDemand":"DOK 4: extended investigation, synthesis, revision","suggestedProcess":"At least two sessions: initial investigation, then new evidence and revision. Save an initial recommendation BEFORE consulting Stage 4.","prompt":"A club records memberships at years t=0,1,2,3 as 100,110,121,133. Two proposed models are L(t)=100+11t and E(t)=100(1.1)^t. The board needs a defensible year-8 forecast, not just one calculated number.","stages":[{"id":"stage-1","title":"Plan and initial investigation","prompt":"State what evidence would support each model and your comparison method. Compute predictions and signed residuals observed-minus-predicted at t=0..3. Compare sums of squared residuals; connect constant differences and ratios to model structure."},{"id":"stage-2","title":"Initial recommendation","prompt":"Write an initial model recommendation and year-8 forecast, with assumptions and limitations. Record what later observation would make you reconsider. Save this response before proceeding."},{"id":"stage-3","title":"Independent verification and boundary","prompt":"Use a second representation or calculation to verify forecasts. Compare model divergence at years 4 and 8. Explain why a better fit to four early observations does not prove the mechanism or justify indefinite growth."},{"id":"stage-4","title":"New evidence and revision","prompt":"NEW EVIDENCE: year-4 membership is 138 after a recruitment policy change. Recalculate each residual and total squared residual. Revisit your saved recommendation: retain, revise, or use a new piecewise model. Justify with numerical evidence AND context. Specify two further observations and a future review point."},{"id":"stage-5","title":"Transfer","prompt":"A second view is formative only. No automatic or AI grading. A teacher must review the process, reasoning, and evidence to certify performance; this browser does not issue performance certification."},{"id":"eoc-performance-5","checkout":5,"title":"Develop and defend a general design rule","cognitiveDemand":"DOK 4: extended proof, sensitivity, constraints, transfer","suggestedProcess":"Three phases over at least two sessions: conjecture, proof, constraint revision. Preserve the initial design before Stage 4.","prompt":"A community plans a rectangular garden beside a wall. Three sides require fencing. Available fencing is F metres, with F>0. Develop a general design rule and defend its use when real constraints change.","stages":[{"id":"stage-1","title":"Investigate and conjecture","prompt":"Choose at least three different F values. Compare multiple feasible widths for each, organize normalized ratios x/F and area/F², and conjecture an optimum rule. Record the initial design recommendation and uncertainty."},{"id":"stage-2","title":"General proof and model comparison","prompt":"Prove or refute your conjecture for every F>0 using algebra. Compare your result with the claim that three equal fenced sides maximize area. Connect table, factored, and vertex forms; explain admissible domain."},{"id":"stage-3","title":"Sensitivity investigation","prompt":"Explore a 10% change in F and derive the exact effect on optimal dimensions and area. Explain why percentage change in area differs from percentage change in fence. Include an independent numerical check."},{"id":"stage-4","title":"New constraints and revision","prompt":"NEW CONSTRAINT: access requires width at least w metres; w>0. Classify every case relating w and F, including the feasibility boundary. Derive a piecewise rule and revisit your initial recommendation. For F=120,w=35 give a concrete revised plan."},{"id":"stage-5","title":"Transfer and defense","prompt":"The wall becomes unavailable and all four sides need fencing. D ndently."],"transfer":"General constraint rule and four-side model","reviewPolicy":"Student self-review is formative only. No automatic or AI grading. A teacher must review the process, reasoning, and evidence to certify performance; this browser does not issue performance certification."}] with eoc_performance_tasks.json.tasks. */

function performanceRecord(task){
 if(!DB.performanceTasks||typeof DB.performanceTasks!=='object'||Array.isArray(DB.performanceTasks))DB.performanceTasks={};
 return DB.performanceTasks[task.id]||(DB.performanceTasks[task.id]={responses:{},selfReviewed:false,updatedAt:0});
}
function performancePanel(level){
 const task=EOC_PERFORMANCE_TASKS.find(t=>t.checkout===Number(level));if(!task)return '';
 const r=performanceRecord(task);
 return `<section class="cs-page" lang="en" dir="ltr" aria-labelledby="${task.id}-title"><h3 id="${task.id}-title">Supplementary written performance task ${task.checkout}: ${esc(task.title)}</h3>
 <p><strong>${esc(task.cognitiveDemand)}</strong> · ${esc(task.suggestedProcess)}</p>
 <p>The original 15 multiple-choice questions remain separate. Their 80% threshold is 12/15. Written tasks have no automatic score. Teacher review is required for genuine performance certification; teacher grading and certification are unavailable in this browser.</p>
 <p>${esc(task.prompt)}</p>
 ${task.stages.map(stage=>`<div style="margin:1rem 0"><label for="${task.id}-${stage.id}"><strong>${esc(stage.title)}</strong><br>${esc(stage.prompt)}</label><textarea id="${task.id}-${stage.id}" rows="7" maxlength="20000" style="display:block;width:100%;box-sizing:border-box" oninput="BWM.savePerformance('${task.id}','${stage.id}',this.value)" aria-describedby="${task.id}-status">${esc(r.responses[stage.id]||'')}</textarea></div>`).join('')}
 <p id="${task.id}-status" role="status" aria-live="polite">${r.updatedAt?'Saved in this browser. Resume here or export a backup.':'Write your response; changes save in this browser.'}</p>
 <details><summary>Formative self-review: rubric and worked example</summary><p>Preserve your initial reasoning before consulting the example. Multiple defensible recommendations can meet the rubric. This example is not an automatic grade.</p>
 <ul>${task.rubric.map(c=>`<li><strong>${esc(c.criterion)}</strong> (0–4 points, teacher assessed): ${esc(c.descriptor)}</li>`).join('')}</ul>
 <p>For each criterion: 0 = missing; 1 = substantial errors; 2 = partially correct with gaps; 3 = sound evidence with minor omissions; 4 = complete and independently justified. The rubric total is separate from the MC threshold; no performance passing score is inferred.</p>
 <ol>${task.workedAnswer.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h4>Independent mathematical verification</h4><ul>${task.independentMathProof.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>
 <label><input type="checkbox" ${r.selfReviewed?'checked':''} onchange="BWM.reviewPerformance('${task.id}',this.checked)"> I compared my written evidence with the rubric (student self-review only).</label>
 <p><button type="button" class="bwm-btn ghost" onclick="BWM.exportPerformance('${task.id}')">Export written response and rubric</button> <button type="button" class="bwm-btn ghost" onclick="BWM.exportProgress()">Export resumable progress backup</button></p></section>`;
}
function performanceStatus(id,message){const el=document.getElementById(id+'-status');if(el)el.textContent=message;}
function persistPerformance(id){try{localStorage.setItem(BWM_KEY,JSON.stringify(DB));performanceStatus(id,'Saved in this browser. Resume here or export a backup.');}catch(e){performanceStatus(id,'Could not save in this browser. Export your written response now to keep a copy.');}}
window.BWM.savePerformance=function(id,stage,value){const task=EOC_PERFORMANCE_TASKS.find(t=>t.id===id);if(!task||!task.stages.some(s=>s.id===stage)||typeof value!=='string')return;const r=performanceRecord(task);r.responses[stage]=value.slice(0,20000);r.selfReviewed=false;r.updatedAt=Date.now();persistPerformance(id);const check=document.querySelector('#'+id+'-title')?.closest('section')?.querySelector('input[type="checkbox"]');if(check)check.checked=false;};
window.BWM.reviewPerformance=function(id,value){const task=EOC_PERFORMANCE_TASKS.find(t=>t.id===id);if(!task)return;const r=performanceRecord(task);r.selfReviewed=value===true;r.updatedAt=Date.now();persistPerformance(id);};
window.BWM.exportPerformance=function(id){const task=EOC_PERFORMANCE_TASKS.find(t=>t.id===id);if(!task)return;const payload={schemaVersion:1,task,studentDraft:performanceRecord(task),assessmentStatus:'Unscored student work; teacher review required. Self-review does not certify performance.'};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=id+'-written-response.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
const beforePerformanceResults=renderResults;
renderResults=function(key){return beforePerformanceResults(key)+(/^co[1-5]$/.test(key)?performancePanel(Number(key.slice(2))):'');};
if(typeof renderEocList==='function'){const beforePerformanceEoc=renderEocList;renderEocList=function(){return beforePerformanceEoc()+`<div class="cs-page" lang="en" dir="ltr"><h3>Written evidence beyond multiple choice</h3><p>Five supplementary tasks build from application to sustained investigations. Open a checkout result to draft and resume its written task. Checkouts 4 and 5 require multiple sessions, evidence comparison, revision, proof, and transfer. Written-task text is available in English.</p></div>`;};}
if(typeof renderEoc==='function'){const beforePerformanceRenderEoc=renderEoc;renderEoc=function(...args){return beforePerformanceRenderEoc(...args)+performancePanel(Number(args[0]));};}
const beforePerformanceInspect=window.BWM.inspect;
window.BWM.inspect=function(){return {...beforePerformanceInspect(),performanceTasks:EOC_PERFORMANCE_TASKS,validatePerformanceTasks,performancePanel};};

/* Optional hands-on orientation. Learning records and assessment APIs are untouched. */
const TOUR_KEY='byrdway.algebra.onboarding.v1';
let tourRecord={version:1,status:'new'};
try{const r=JSON.parse(localStorage.getItem(TOUR_KEY));if(r&&r.version===1&&['invited','skipped','exited','completed'].includes(r.status))tourRecord={version:1,status:r.status};}catch(e){}
let tourStep=-1,tourMode='flashcards',tourTry=null,tourVisited=new Set(),tourReturn=null,tourFocus=null,tourRestoreFocus=false;
function tourSave(status){tourRecord={version:1,status};try{localStorage.setItem(TOUR_KEY,JSON.stringify(tourRecord));}catch(e){}}
function tourHome(){return !location.hash||['#','#/','#/home'].includes(location.hash);}
function tourRoute(hash){location.hash=hash;route();bwmRoute();}
function clearTourHighlight(){document.querySelectorAll('.bwm-tour-highlight').forEach(el=>el.classList.remove('bwm-tour-highlight'));document.body.classList.remove('bwm-tour-running');}
function tourTarget(){
 if(tourStep===0)return document.querySelector('#app h1');
 if(tourStep===1)return document.querySelector('.bwm-card[href="#/diagnostic"]');
 if(tourStep===2)return document.querySelector(tourMode==='flashcards'?'.flip-inner':tourMode==='testme'?'.reveal-btn':'.cc');
 if(tourStep===3)return document.querySelector('.testitem');
 return document.querySelector('.bwm-card[href="#/plan"]');
}
function highlightTour(){
 clearTourHighlight();if(tourStep<0)return;
 document.body.classList.add('bwm-tour-running');const target=tourTarget();if(!target)return;
 target.classList.add('bwm-tour-highlight');target.scrollIntoView({block:'center',behavior:'instant'});
 const panel=document.getElementById('bwm-tour-coach'),nav=document.querySelector('.topnav'),tabs=document.querySelector('.area-tabbar');
 const lower=Math.max(nav?.getBoundingClientRect().bottom||76,tabs?.getBoundingClientRect().bottom||0)+20;
 target.style.scrollMarginTop=lower+'px';
 const upper=(panel?.getBoundingClientRect().top||window.innerHeight)-20;
 const card=target.closest('.flashcard');if(card&&tourStep===2)card.style.height=Math.min(420,Math.max(120,upper-lower))+'px';
 const r=target.getBoundingClientRect(),desired=(lower+upper)/2;
 window.scrollBy({top:r.top+r.height/2-desired,behavior:'instant'});
}

function tourInvitation(){
 if(tourRecord.status!=='new'||!tourHome()||document.getElementById('bwm-tour-invitation')||tourStep>=0)return;
 const el=document.createElement('aside');el.id='bwm-tour-invitation';el.className='bwm-tour-invitation';el.setAttribute('aria-labelledby','bwm-tour-invite-title');el.setAttribute('lang','en');el.setAttribute('dir','ltr');
 el.innerHTML=`<h2 id="bwm-tour-invite-title">Welcome to ByrdWay!</h2><p>Your math command center is ready. Want a quick, hands-on look around? About 60 seconds, at your pace.</p><button type="button" class="bwm-btn" onclick="BWM.startTour()">Show Me Around!</button><button type="button" class="bwm-btn ghost" onclick="BWM.skipTour()">Skip Tour</button>`;
 document.body.appendChild(el);tourSave('invited');
}
function renderTour(){
 document.getElementById('bwm-tour-coach')?.remove();if(tourStep<0)return;
 const titles=['Welcome aboard!','Find your starting point','Try your learning engines','Your first small win','Your mission begins!'];
 const descriptions=[
 'This is your dashboard: your home base for all ten learning areas. You can explore freely. This tour never changes your learning scores.',
 'The diagnostic checks what you know and builds a study plan from your answers. Look for the highlighted Diagnostic Assessment card. Your saved assessment is safe while you explore.',
 'These are the real tools. Flip the highlighted flashcard with a click, Enter, or Space. Try Reveal Answer, then peek at a cheat sheet.',
 'Try this real Foundation question from Test Me. This is tour practice only. A wrong answer is a clue, not a penalty!',
 'Use your Study Plan to choose a lesson, then practice with the engines. Five EOCs check your progress. Export a backup before changing devices. You can replay this tour anytime.'
 ];
 let activity='';
 if(tourStep===2)activity=`<div class="bwm-tour-tools">${[['flashcards','Flip a flashcard'],['testme','Reveal a solution'],['cheatsheet','Open a cheat sheet']].map(([mode,label])=>`<button type="button" class="bwm-btn ghost" aria-pressed="${tourMode===mode}" onclick="BWM.tourEngine('${mode}')">${label}${tourVisited.has(mode)?' ✓':''}</button>`).join('')}</div><p id="bwm-tour-action-status" role="status">${tourVisited.has('flipped')?'Flashcard flipped — nice discovery! ':''}${tourVisited.has('revealed')?'Solution revealed — notice the Why.':''}</p>`;
 if(tourStep===3){const q=AREAS[0].testMe.foundation[0];activity=`<p><strong>${esc(q.q)}</strong></p><div class="bwm-tour-tools" role="group" aria-label="Tour practice answers">${[6,5,8,9].map(n=>`<button type="button" class="bwm-btn ghost" aria-pressed="${tourTry===n}" onclick="BWM.tourAnswer(${n})">x = ${n}</button>`).join('')}</div><p id="bwm-tour-answer-feedback" role="status" aria-live="polite">${tourTry===null?'Choose an answer. It will not affect your diagnostic or EOC records.':tourTry===6?'Yes! '+esc(q.explain):'Good try! Undo the +9 first, then divide by 4. Try again — you can do this.'}</p>`;}
 if(tourStep===4)activity='<p><a href="#/learn" class="bwm-btn ghost" onclick="BWM.finishTour(false)">Find a lesson</a> <a href="#/eoc" class="bwm-btn ghost" onclick="BWM.finishTour(false)">Explore five EOCs</a></p>';
 const el=document.createElement('section');el.id='bwm-tour-coach';el.className='bwm-tour-coach'+(tourStep===2?' bwm-tour-hands-on':'');el.setAttribute('role','region');el.setAttribute('aria-labelledby','bwm-tour-title');el.setAttribute('lang','en');el.setAttribute('dir','ltr');
 el.innerHTML=`<p class="bwm-tour-kicker">SHOW ME AROUND! · <span aria-live="polite">Step ${tourStep+1} of 5</span></p><progress max="5" value="${tourStep+1}" aria-label="Tour progress">${tourStep+1}/5</progress><h2 id="bwm-tour-title" tabindex="-1">${titles[tourStep]}</h2><p>${descriptions[tourStep]}</p>${activity}<div class="bwm-tour-footer"><button type="button" class="bwm-btn ghost" ${tourStep===0?'disabled':''} onclick="BWM.backTour()">Back</button>${tourStep<4?'<button type="button" class="bwm-btn" onclick="BWM.nextTour()">Next →</button>':'<button type="button" class="bwm-btn" onclick="BWM.finishTour(true)">Finish Tour</button><button type="button" class="bwm-btn alt" onclick="BWM.beginAfterTour()">Begin Diagnostic</button>'}<button type="button" class="bwm-btn ghost" onclick="BWM.skipTour()">Skip Tour</button><button type="button" class="bwm-btn ghost" onclick="BWM.exitTour()">Exit</button><button type="button" class="bwm-btn ghost" onclick="BWM.startTour()">Replay Tour</button></div><p class="bwm-tour-note">Optional tour. Use the highlighted real controls above. Escape exits anytime.</p>`;
 document.body.appendChild(el);document.getElementById('bwm-tour-title')?.focus({preventScroll:true});highlightTour();
}
function tourSetStep(step){tourStep=Math.max(0,Math.min(4,step));const area=AREAS[0].id;const target=tourStep===2?`#/area/${area}/${tourMode}`:tourStep===3?`#/area/${area}/testme`:'#/home';tourRoute(target);renderTour();}
function endTour(status,home){tourSave(status);tourStep=-1;document.getElementById('bwm-tour-coach')?.remove();document.getElementById('bwm-tour-invitation')?.remove();clearTourHighlight();if(home){tourRestoreFocus=true;tourRoute(tourReturn||'#/home');setTimeout(()=>{if(tourRestoreFocus){document.getElementById('bwm-help-tour')?.focus({preventScroll:true});tourRestoreFocus=false;}},0);}const focus=tourFocus&&tourFocus.isConnected?tourFocus:document.getElementById('bwm-help-tour');focus?.focus({preventScroll:true});}
window.BWM.startTour=function(){if(tourStep<0){tourReturn=location.hash||'#/home';tourFocus=document.activeElement;}tourMode='flashcards';tourTry=null;tourVisited=new Set();document.getElementById('bwm-tour-invitation')?.remove();tourSetStep(0);};
window.BWM.nextTour=function(){if(tourStep>=0&&tourStep<4)tourSetStep(tourStep+1);};
window.BWM.backTour=function(){if(tourStep>0)tourSetStep(tourStep-1);};
window.BWM.skipTour=function(){endTour('skipped',tourStep>=0);};
window.BWM.exitTour=function(){endTour('exited',true);};
window.BWM.finishTour=function(home=true){endTour('completed',home);};
window.BWM.beginAfterTour=function(){endTour('completed',false);tourRoute('#/diagnostic');};
window.BWM.tourEngine=function(mode){if(tourStep!==2||!['flashcards','testme','cheatsheet'].includes(mode))return;tourMode=mode;tourVisited.add(mode);tourSetStep(2);};
window.BWM.tourAnswer=function(n){if(tourStep!==3||![6,5,8,9].includes(n))return;tourTry=n;const active=document.activeElement;const label=active?.textContent;renderTour();if(n===6)revealAnswer(AREAS[0].id+'-foundation-0');const button=[...document.querySelectorAll('#bwm-tour-coach button')].find(el=>el.textContent===label);button?.focus({preventScroll:true});};
let dashboardEngineArea=AREAS[0].id;
function dashboardEngines(){return `<section id="bwm-dashboard-engines" class="cs-page"><h2>Learning Engines</h2><p>Pick an area, then choose the kind of help you need.</p><label for="bwm-engine-area">Learning area</label><select id="bwm-engine-area" class="bwm-select" onchange="BWM.chooseEngineArea(this.value)">${AREAS.map(a=>`<option value="${a.id}" ${a.id===dashboardEngineArea?'selected':''}>${esc(a.area)}</option>`).join('')}</select><div class="bwm-tour-tools" style="margin-top:16px">${[['cheatsheet','Cheat Sheets'],['blueprint','Blueprints'],['flashcards','Flashcards'],['testme','Test Me'],['interactive','Interactive Support'],['interactive','AI Tutor']].map(([tab,label])=>`<a class="bwm-btn ghost" data-engine-tab="${tab}" href="#/area/${dashboardEngineArea}/${tab}">${label}</a>`).join('')}</div><p class="bwm-note">AI Tutor provides tutoring prompts and external resources; it is not a built-in conversational chatbot.</p></section>`;}
window.BWM.chooseEngineArea=function(id){if(!findArea(id))return;dashboardEngineArea=id;document.querySelectorAll('#bwm-dashboard-engines a[data-engine-tab]').forEach(a=>{a.href='#/area/'+id+'/'+a.dataset.engineTab;});};
function arrangeDashboard(){
 if(!tourHome()||document.getElementById('bwm-dashboard-engines'))return;
 const page=document.querySelector('#app .page'),grid=page?.querySelector('.tilegrid');if(!page||!grid)return;
 const learn=page.querySelector('.bwm-card[href="#/learn"]'),eoc=page.querySelector('.bwm-card[href="#/eoc"]');
 if(learn){const row=document.createElement('div');row.className='bwm-cards';grid.insertAdjacentElement('beforebegin',row);row.appendChild(learn);}
 const needs=page.querySelector('.needgrid');if(needs)needs.insertAdjacentHTML('beforebegin',dashboardEngines());
 const block=document.createElement('section');block.id='bwm-dashboard-eoc';block.className='cs-page';block.innerHTML=`<h2>Five EOC Assessments</h2><p>Each assessment has 15 questions. The multiple-choice threshold is 12/15; written reasoning tasks have separate teacher review.</p><div class="bwm-tour-tools">${BWM_CHECKOUTS.map(c=>`<a class="bwm-btn ghost" href="#/eoc/${c.n}${DB.results['co'+c.n]&&!DB.progress['co'+c.n]?'/results':''}">EOC ${c.n}</a>`).join('')}</div>`;page.appendChild(block);if(eoc)block.appendChild(eoc);
 const backup=document.getElementById('bwm-storage-status')?.closest('.cs-page');if(backup)page.appendChild(backup);
}
function onboardingDecorate(){
 if(!tourHome())document.getElementById('bwm-tour-invitation')?.remove();
 arrangeDashboard();
 if(tourHome()&&!document.getElementById('bwm-help-tour')){const heading=document.querySelector('#app h1');if(heading)heading.insertAdjacentHTML('afterend','<div class="bwm-tour-help"><button type="button" id="bwm-help-tour" class="bwm-btn alt" onclick="BWM.startTour()">How Do I Use This? · Show Me Around!</button><a href="#/how">How This Works</a></div>');}
 tourInvitation();if(tourStep>=0)highlightTour();if(tourRestoreFocus&&tourHome())document.getElementById('bwm-help-tour')?.focus({preventScroll:true});
}
const originalOnboardingRoute=bwmRoute;
bwmRoute=function(){originalOnboardingRoute();onboardingDecorate();};
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&tourStep>=0){event.preventDefault();window.BWM.exitTour();}});
document.addEventListener('click',event=>{if(tourStep!==2)return;const flip=event.target.closest('.flip-inner'),reveal=event.target.closest('.reveal-btn');if(flip&&flip.getAttribute('aria-pressed')==='true')tourVisited.add('flipped');if(reveal)tourVisited.add('revealed');const status=document.getElementById('bwm-tour-action-status');if(status)status.textContent=(tourVisited.has('flipped')?'Flashcard flipped — nice discovery! ':'')+(tourVisited.has('revealed')?'Solution revealed — notice the Why.':'');});
document.addEventListener('keyup',event=>{if(tourStep===2&&['Enter',' '].includes(event.key)&&event.target.closest('.flip-inner')?.getAttribute('aria-pressed')==='true'){tourVisited.add('flipped');const status=document.getElementById('bwm-tour-action-status');if(status)status.textContent='Flashcard flipped — nice discovery!';}});
const inspectOnboarding=window.BWM.inspect;window.BWM.inspect=function(){return {...inspectOnboarding(),onboarding:{step:tourStep,status:tourRecord.status,visited:[...tourVisited],practiceAnswer:tourTry}};};

window.addEventListener('hashchange', bwmRoute);
window.addEventListener('DOMContentLoaded', bwmRoute);

})();
</script>
</body>
</html>
