<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ByrdWay Physics I + Honors Power Tool — 20 units, 170 sections, 20 interactive 3D labs, 12 languages.">
<meta name="color-scheme" content="dark">
<title>ByrdWay Physics I + Honors Power Tool</title>
<style>/* ByrdWay Physics I + Honors — midnight blue and gold identity, carried over from the Algebra 2 Power Tool. */
:root {
  --bg: #0b1220; --bg1: #0f172a; --bg2: #111827; --card: #16213a; --card2: #1e293b; --line: #263349;
  --txt: #e2e8f0; --dim: #94a3b8; --gold: #fbbf24; --gold2: #f59e0b; --blue: #7dd3fc; --green: #4ade80; --red: #f87171;
  --purple: #c084fc; --pink: #f472b6; --cyan: #22d3ee; --orange: #fb923c;
  --radius: 14px; --fs: 1;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  color-scheme: dark;
}
:lang(ar) { --font: "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", "Geeza Pro", Arial, sans-serif; }
:lang(hi) { --font: "Nirmala UI", "Noto Sans Devanagari", "Kohinoor Devanagari", "Mangal", system-ui, sans-serif; }
:lang(bn) { --font: "Nirmala UI", "Noto Sans Bengali", "Kohinoor Bangla", "Vrinda", system-ui, sans-serif; }
:lang(zh) { --font: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif; }
:lang(ja) { --font: "Yu Gothic UI", "Yu Gothic", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Meiryo", system-ui, sans-serif; }
:lang(ko) { --font: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", system-ui, sans-serif; }
.untr:lang(en) { font-family: "Segoe UI", system-ui, sans-serif; }

* { box-sizing: border-box; }
html { font-size: calc(16px * var(--fs)); }
body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--font); line-height: 1.6; -webkit-text-size-adjust: 100%; }
a { color: var(--blue); }
a:hover { color: var(--gold); }
h1, h2, h3 { line-height: 1.25; color: #fff; margin: 0 0 .5em; }
h1 { font-size: clamp(1.6rem, 3.5vw, 2.3rem); }
h2 { font-size: 1.15rem; }
p { margin: .4em 0 .8em; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; inset-inline-start: 8px; top: -60px; background: var(--gold); color: #111; padding: 8px 14px; border-radius: 8px; z-index: 100; font-weight: 700; }
.skip:focus { top: 8px; }
main:focus { outline: none; }
.hint { color: var(--dim); font-size: .9rem; }
.small { font-size: .85rem; }
.good { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--gold); } .dimtxt { color: var(--dim); }
.big { font-size: 1.4rem; font-weight: 700; }
.lead { font-size: 1.08rem; color: #cbd5e1; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; color: var(--gold); font-weight: 700; margin-bottom: .3em; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--card2); color: var(--txt); border: 1px solid #334155; border-radius: 999px; padding: 9px 16px; font: inherit; font-size: .92rem; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 40px; }
.btn:hover { border-color: var(--gold); color: var(--gold); }
.btn.gold { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #111; border: none; }
.btn.gold:hover { filter: brightness(1.08); color: #111; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.big { font-size: 1.05rem; padding: 12px 26px; }
.btn.small { padding: 4px 12px; min-height: 32px; font-size: .82rem; }
.btn:disabled { opacity: .55; cursor: default; }
.cta { display: inline-block; margin-top: 26px; background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #111; padding: 15px 34px; border-radius: 999px; font-weight: 800; font-size: 1.05rem; text-decoration: none; box-shadow: 0 0 40px rgba(251,191,36,.35); }
.cta:hover { color: #111; filter: brightness(1.08); }

/* Cover */
.cover { position: relative; min-height: 100vh; display: grid; place-items: center; text-align: center; overflow: hidden; background: radial-gradient(ellipse at 50% 20%, #1e293b 0%, #0b1220 55%, #02040b 100%); padding: 40px 16px; }
#stars { position: absolute; inset: 0; width: 100%; height: 100%; }
.cover-inner { position: relative; z-index: 1; max-width: 760px; }
.cover h1 { font-size: clamp(2.6rem, 8vw, 4.4rem); letter-spacing: .3em; color: var(--gold); margin: 10px 0 0; text-shadow: 0 0 30px rgba(251,191,36,.35); padding-inline-start: .3em; }
.cover h2 { font-size: clamp(1.1rem, 3vw, 1.6rem); letter-spacing: .12em; color: #fff; font-weight: 600; }
.tagline { color: var(--blue); font-size: 1.15rem; letter-spacing: .04em; }
.promise { color: var(--dim); }
.author { color: #fff; margin-top: 14px; }
.cover-langs { margin-top: 28px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.cover-langs button { background: rgba(30,41,59,.7); color: var(--txt); border: 1px solid #334155; border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: .85rem; }
.cover-langs button:hover { border-color: var(--gold); color: var(--gold); }
.atom { position: relative; width: 120px; height: 120px; margin: 0 auto; }
.atom i { position: absolute; inset: 50px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 25px var(--gold); }
.atom span { position: absolute; inset: 0; border: 2px solid var(--blue); border-radius: 50%; transform: rotate(var(--r)) scaleY(.35); animation: orbit 6s linear infinite; opacity: .8; }
.atom span:nth-child(1) { --r: 0deg; } .atom span:nth-child(2) { --r: 60deg; animation-delay: -2s; } .atom span:nth-child(3) { --r: 120deg; animation-delay: -4s; }
@keyframes orbit { from { transform: rotate(var(--r)) scaleY(.35) rotate(0); } to { transform: rotate(var(--r)) scaleY(.35) rotate(360deg); } }

/* Top nav */
.topnav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 18px; background: rgba(11,18,32,.93); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; color: var(--gold); letter-spacing: .08em; text-decoration: none; white-space: nowrap; }
.brand span:not(.logo) { color: var(--dim); font-weight: 400; letter-spacing: 0; margin-inline-start: 6px; font-size: .88em; }
.navlinks { display: flex; gap: 4px; flex-wrap: wrap; margin-inline-start: auto; }
.navlinks a { color: var(--dim); text-decoration: none; padding: 6px 10px; border-radius: 8px; font-size: .92rem; }
.navlinks a.active, .navlinks a:hover { color: var(--gold); background: rgba(251,191,36,.08); }
.langsel select { background: var(--card2); color: var(--txt); border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: .9rem; }
.menu-btn { display: none; margin-inline-start: auto; background: var(--card2); color: var(--txt); border: 1px solid #334155; border-radius: 8px; padding: 6px 12px; font: inherit; }
.banner { padding: 10px 18px; text-align: center; }
.banner.warn { background: #3b2a06; color: var(--gold); }
.foot { text-align: center; color: var(--dim); font-size: .78rem; padding: 30px 16px 40px; border-top: 1px solid var(--line); margin-top: 40px; }

/* Layout */
.page { max-width: 1080px; margin: 0 auto; padding: 24px 16px 60px; }
.page.wide { max-width: 1320px; }
.page.narrow { max-width: 760px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin: 14px 0; }
.card.glow { background: linear-gradient(160deg, #1d2a4a, #16213a 60%); border-color: #3b4a6b; box-shadow: 0 0 40px rgba(125,211,252,.08); }
details.card > summary { cursor: pointer; list-style: none; }
details.card > summary h2 { display: inline; }
details.card > summary::before { content: "▸ "; color: var(--gold); }
details[open].card > summary::before { content: "▾ "; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.crumb { font-size: .88rem; color: var(--dim); }
.crumb a { color: var(--dim); }
.notice { background: #13233f; border-inline-start: 4px solid var(--blue); padding: 12px 16px; border-radius: 8px; }
.pbar { height: 8px; background: #0b1220; border-radius: 6px; overflow: hidden; margin: 6px 0; }
.pbar span { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); }

/* Pathway badges */
.pw { display: inline-block; font-size: .7rem; font-weight: 800; padding: 2px 9px; border-radius: 999px; letter-spacing: .04em; vertical-align: middle; }
.pw-core { background: #12324a; color: var(--blue); }
.pw-honors { background: #3b2a06; color: var(--gold); }
.pw-advanced { background: #2e1a45; color: var(--purple); }
.pw-note { background: #2e1a45; color: #e9d5ff; border-radius: 8px; padding: 8px 12px; font-size: .9rem; }
.untr-note, .mt-note { font-size: .82rem; color: var(--dim); background: #111a2e; border-radius: 8px; padding: 6px 10px; }
.untr { border-bottom: 1px dotted #64748b; }

/* Dashboard */
.dash-top { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 14px; }
.dash-top .card { margin: 0; }
.seg { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 14px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat b { font-size: 1.8rem; color: var(--gold); }
.stat span { color: var(--dim); font-size: .85rem; margin-inline-start: 4px; }
.unitbars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
.ubar { display: grid; grid-template-columns: 28px 1fr 90px 40px; align-items: center; gap: 8px; text-decoration: none; color: var(--txt); font-size: .88rem; padding: 3px 0; }
.ubar .un { color: var(--gold); font-weight: 800; }
.ubar .ut { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ubar .uc { color: var(--dim); font-size: .8rem; text-align: end; }
.lvgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.lv { background: var(--bg2); border-radius: 10px; padding: 10px; text-decoration: none; color: var(--txt); display: flex; flex-direction: column; gap: 3px; font-size: .82rem; }
.lv b { color: var(--gold); font-size: 1.1rem; } .lv em { color: var(--green); font-style: normal; font-weight: 700; }
.labchips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--bg2); border: 1px solid #334155; border-radius: 999px; padding: 6px 12px; font-size: .85rem; text-decoration: none; color: var(--txt); }
.chip.done { border-color: var(--green); color: var(--green); }
.hr { font-weight: 800; padding: 3px 10px; border-radius: 999px; }
.hr-ready { background: #0f3020; color: var(--green); } .hr-building { background: #3b2a06; color: var(--gold); } .hr-notyet { background: #1e293b; color: var(--dim); }

/* Units */
.parthead { color: var(--gold); margin-top: 26px; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase; }
.unitgrid, .labgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.utile, .labtile { display: flex; flex-direction: column; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-decoration: none; color: var(--txt); transition: transform .15s, border-color .15s; }
.utile:hover, .labtile:hover { border-color: var(--gold); transform: translateY(-2px); color: var(--txt); }
.labtile.done { border-color: #1f5f3c; }
.unum, .labnum { font-size: 1.6rem; font-weight: 800; color: var(--gold); }
.uname, .labname { font-weight: 700; color: #fff; }
.unit-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
.seclist { list-style: none; padding: 0; }
.seclist li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seclist li.done { border-color: #1f5f3c; }
.seclist li.optional { opacity: .8; }
.seclist a { color: #fff; text-decoration: none; font-weight: 600; flex: 1; }
.secnum { color: var(--gold); font-weight: 800; margin-inline-end: 6px; }

/* Lesson */
.lesson-head { margin-bottom: 8px; }
.lesson-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.flowbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 12px 0; }
.flowbar span { background: var(--card); border-radius: 999px; padding: 3px 9px; }
.flowbar i { color: var(--gold); font-style: normal; }
[dir="rtl"] .flowbar i { transform: scaleX(-1); display: inline-block; }
.observe { border-inline-start: 4px solid var(--blue); }
.predict { border-inline-start: 4px solid var(--gold); }
.example { border-inline-start: 4px solid var(--green); }
.miscon { border-inline-start: 4px solid var(--red); }
.investigate { border-inline-start: 4px solid var(--purple); }
.dimmed { opacity: .45; filter: saturate(.6); }
.choices { display: grid; gap: 6px; margin: 8px 0 12px; }
.choice { display: flex; gap: 10px; align-items: flex-start; background: var(--bg2); border: 1px solid #263349; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.choice:hover { border-color: #475569; }
.choice input { margin-top: 5px; accent-color: var(--gold); }
.vocab dt { font-weight: 700; color: var(--gold); margin-top: 8px; }
.vocab dd { margin: 2px 0 0; color: #cbd5e1; }
.formula { background: var(--bg2); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.feq { font-family: "Cambria Math", "STIX Two Math", Consolas, monospace; font-size: 1.25rem; color: var(--gold); font-weight: 700; direction: ltr; unicode-bidi: isolate; text-align: start; }
.fvars { width: 100%; font-size: .88rem; border-collapse: collapse; margin: 6px 0; }
.fvars td { padding: 2px 6px; border-bottom: 1px solid #1e293b; }
.fvars td:first-child, .fvars td:last-child { direction: ltr; unicode-bidi: isolate; font-family: "Cambria Math", Consolas, monospace; color: var(--blue); }
.when { font-size: .85rem; color: var(--dim); margin: 4px 0; }
.steps li { margin: 6px 0; }
.answer { font-weight: 700; color: var(--green); }
.q { background: var(--bg2); border: 1px solid #263349; border-radius: 12px; padding: 14px; margin: 10px 0; }
.q.qdone { border-color: #1f5f3c; }
.qtext { font-weight: 600; }
.qrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.qin { flex: 1 1 160px; min-width: 0; background: #0b1220; color: var(--txt); border: 1.5px solid #334155; border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 1rem; direction: ltr; }
.qin:focus { border-color: var(--gold); outline: none; }
.unit { color: var(--blue); font-family: Consolas, monospace; direction: ltr; unicode-bidi: isolate; }
.fb { min-height: 1.2em; margin: 6px 0; font-weight: 600; }
.detective { font-weight: 400; color: #fde68a; background: #2a2208; border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
.hintline { color: #fde68a; margin: 4px 0; }
.sol summary { cursor: pointer; color: var(--blue); font-size: .9rem; }
.mc { background: var(--bg2); border-radius: 10px; padding: 10px 14px; margin: 8px 0; }
.mc .wrong { color: #fecaca; } .mc .right { color: #bbf7d0; } .mc .fbk { color: var(--dim); font-size: .9rem; margin: 0; }
.checks { list-style: none; padding: 0; } .checks li { padding: 4px 0; }
.checks li::before { content: "☐ "; color: var(--gold); }
.checks li.good::before, .checks li.dimtxt::before { content: ""; }
textarea { width: 100%; background: #0b1220; color: var(--txt); border: 1.5px solid #334155; border-radius: 10px; padding: 10px; font: inherit; }
.complete-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 20px 0; }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.vlinks { display: flex; gap: 8px; flex-wrap: wrap; }
.vbtn { display: inline-block; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: .85rem; text-decoration: none; color: #111; }
.vbtn.khan { background: #7dd3fc; } .vbtn.oct { background: #fbbf24; } .vbtn.yt { background: #fca5a5; }
.vbtn:hover { filter: brightness(1.1); color: #111; }
.fig { margin: 0; text-align: center; }
.diagram { width: 100%; max-width: 460px; height: auto; background: #0b1220; border-radius: 10px; }
figcaption { color: var(--dim); font-size: .85rem; }

/* Lab */
.lab-head h1 { margin-bottom: 4px; }
.lab-q { font-size: 1.05rem; }
.lab-main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.lab-stage-wrap { min-width: 0; }
.lab-stage { position: relative; height: min(58vh, 520px); min-height: 300px; border-radius: var(--radius); overflow: hidden; border: 1px solid #334155; background: #0b1220; touch-action: none; }
.lab-stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; top: 8px; inset-inline-start: 10px; inset-inline-end: 10px; display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--dim); pointer-events: none; z-index: 2; font-variant-numeric: tabular-nums; }
.fxbadge { background: rgba(192,132,252,.18); color: #e9d5ff; border-radius: 999px; padding: 2px 10px; }
.lab-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.lab-label { position: absolute; top: 0; left: 0; background: rgba(11,18,32,.82); color: #fff; border: 1px solid #475569; border-radius: 6px; padding: 1px 6px; font-size: .74rem; white-space: nowrap; direction: ltr; }
.lab-controls, .lab-toggles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 4px; }
.lab-toggles label { font-size: .88rem; display: inline-flex; gap: 6px; align-items: center; background: var(--card); padding: 5px 10px; border-radius: 999px; }
.sel { display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; color: var(--dim); }
.sel select, .sel input, .form select, .form input[type=search] { background: var(--card2); color: var(--txt); border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: .9rem; }
.lab-side .card { margin: 0 0 12px; padding: 14px 16px; }
.param { display: block; margin: 10px 0; font-size: .9rem; }
.param span { display: block; }
.param output { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
.param input[type=range] { width: 100%; accent-color: var(--gold); }
.param select { width: 100%; background: var(--card2); color: var(--txt); border: 1px solid #334155; border-radius: 8px; padding: 6px; font: inherit; }
.measures { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 0; }
.measures div { background: var(--bg2); border-radius: 8px; padding: 6px 10px; }
.measures dt { font-size: .74rem; color: var(--dim); }
.measures dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; direction: ltr; text-align: start; }
.measures .u { color: var(--blue); font-weight: 400; font-size: .8rem; }
.cbar { display: inline-block; width: 100%; height: 10px; background: #0b1220; border-radius: 6px; overflow: hidden; }
.cbar span { display: block; height: 100%; background: var(--gold); }
.cbar.neg span { background: var(--red); }
.ebars { margin-top: 10px; }
.ebar { display: grid; grid-template-columns: 90px 1fr 70px; gap: 8px; align-items: center; font-size: .8rem; margin: 4px 0; }
.eb-t { height: 12px; background: #0b1220; border-radius: 6px; overflow: hidden; }
.eb-t span { display: block; height: 100%; }
.eb-v { text-align: end; font-variant-numeric: tabular-nums; color: var(--dim); }
.eqs .eq { font-family: "Cambria Math", Consolas, monospace; background: var(--bg2); border-radius: 8px; padding: 6px 10px; margin: 5px 0; font-size: .88rem; direction: ltr; text-align: start; color: #fde68a; overflow-x: auto; }
.lab-data { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.graph { width: 100%; height: 240px; display: block; }
.tablewrap { overflow-x: auto; }
table.data, table.vtable { border-collapse: collapse; width: 100%; font-size: .84rem; font-variant-numeric: tabular-nums; }
table.data th, table.data td, table.vtable th, table.vtable td { border-bottom: 1px solid #263349; padding: 5px 8px; text-align: start; }
table.data th, table.vtable th { color: var(--gold); font-weight: 700; }
.vtable tr.grp th { background: var(--card2); color: #fff; }
.lab-tasks { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.lab-tasks .card { margin: 8px 0; }
.lab-prog { grid-column: 1 / -1; color: var(--dim); }
.lab2d { display: block; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 30px); background: var(--card2); border: 1px solid var(--gold); color: var(--txt); padding: 10px 18px; border-radius: 10px; opacity: 0; transition: .3s; z-index: 200; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.form label { display: block; margin: 12px 0; }
.form select { width: 100%; margin-top: 4px; }

/* Responsive */
@media (max-width: 980px) {
  .lab-main, .lab-data, .lab-tasks { grid-template-columns: 1fr; }
  .dash-top { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .lvgrid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px) {
  .grid2, .unitbars { grid-template-columns: 1fr; }
  .menu-btn { display: inline-block; }
  .navlinks { display: none; width: 100%; flex-direction: column; }
  .navlinks.open { display: flex; }
  .brand span:not(.logo) { display: none; }
  .lab-stage { height: 52vh; }
  .ubar { grid-template-columns: 24px 1fr 60px 34px; }
  .measures { grid-template-columns: 1fr 1fr; }
}

/* High contrast */
.hc { --bg: #000; --bg1: #000; --bg2: #000; --card: #0a0a0a; --card2: #111; --line: #fff; --txt: #fff; --dim: #e5e5e5; --gold: #ffd84d; --blue: #8fdcff; }
.hc .card, .hc .q, .hc .choice, .hc .btn { border-color: #fff; }
.hc .untr { border-bottom-color: #fff; }

/* Reduced motion */
.reduced-motion *, .reduced-motion *::before, .reduced-motion *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) { .atom span { animation: none; } }

@media print {
  .topnav, .foot, .lab-controls, .lab-toggles, .complete-bar, .pager, .flowbar { display: none; }
  body { background: #fff; color: #000; }
  .card { border-color: #999; background: #fff; color: #000; }
  h1, h2 { color: #000; }
}

The scale does not read your weight when the elevator accelerates."}],sections:{"5.3":{objectives:["State Newton’s second law as ΣF = m·a and explain each term, including that ΣF is the vector sum of all forces on one object.","Predict how acceleration changes when net force or mass changes, using proportional reasoning.","Calculate net force, mass, or acceleration from the other two, with correct SI units and directions.","Apply the second law along each axis separately for forces in two dimensions."],prereqs:["Acceleration is the rate of change of velocity (Unit 3.3).","Forces are vectors with magnitude and direction (Section 5.1).","Solving a two-variable proportion such as a = F/m (Unit 2.1)."],observe:"Push an empty shopping cart and then a full one with the same effort. The empty cart speeds up quickly; the full cart barely gets going. Now push the full cart twice as hard. What did you change, and what happened to how quickly it sped up?",predict:{prompt:"A cart accelerates at 2 m/s² when pushed with a net force F. You keep the same net force but triple the cart’s mass. What is the new acceleration?",choices:["6 m/s²","2 m/s²","About 0.67 m/s²","Zero — it is too heavy to move"],correct:2,why:"Acceleration is inversely proportional to mass when net force is fixed: a = F/m. Triple the mass → one-third the acceleration: 2 ÷ 3 ≈ 0.67 m/s². Any nonzero net force accelerates any mass; heavy objects just accelerate less."},intro:"Newton’s second law connects the cause of a change in motion (net force) to the change itself (acceleration). For one object, the vector sum of every force acting on it equals its mass times its acceleration: ΣF = m·a.",explain:["Read the law in two directions. Forward: if you know all the forces, you can predict exactly how the motion will change. Backward: if you measure the acceleration, you know the net force — even if you cannot see what is pushing.","Mass here is inertial mass: a measure of how strongly an object resists changes in its velocity. Double the mass and the same net force produces half the acceleration. Double the net force on the same mass and the acceleration doubles.","Because force and acceleration are vectors, the law holds along every direction independently: ΣFx = m·ax and ΣFy = m·ay. Acceleration always points in the same direction as the net force — not necessarily the direction the object is moving. A car braking while moving forward has a backward net force and a backward acceleration.","The law contains Newton’s first law as a special case: if ΣF = 0, then a = 0, so velocity stays constant (including staying at rest).","Limits of the model: ΣF = m·a holds in inertial (non-accelerating) reference frames, for objects whose mass is constant, and at speeds far below the speed of light. Rockets losing fuel and particles near light speed need the more general form ΣF = Δp/Δt (Unit 7 and Unit 19)."],vocab:[["Net force (ΣF)","The vector sum of all forces acting on one object."],["Inertial mass","The property of an object that measures its resistance to acceleration, measured in kilograms."],["Newton (N)","The SI unit of force: the net force that gives a 1 kg mass an acceleration of 1 m/s². 1 N = 1 kg·m/s²."],["Inertial reference frame","A viewpoint that is not accelerating, in which Newton’s laws hold without extra fictitious forces."],["Proportional reasoning","Predicting how one quantity changes when another is scaled, e.g. a ∝ F and a ∝ 1/m."]],formulas:[{eq:"ΣF = m·a",id:"newton2",vars:[["ΣF","net force","N"],["m","mass","kg"],["a","acceleration","m/s²"]],when:"Any object of constant mass, in an inertial frame, at everyday speeds."},{eq:"ΣFx = m·ax,  ΣFy = m·ay",id:"newton2xy",vars:[["ΣFx, ΣFy","net force components","N"],["ax, ay","acceleration components","m/s²"]],when:"Forces in two dimensions: apply the law along each axis separately."}],derivation:["Experiments with a fixed mass show a ∝ ΣF (double the pull, double the acceleration).","Experiments with a fixed net force show a ∝ 1/m (double the mass, half the acceleration).","Combining both: a ∝ ΣF/m, so ΣF = k·m·a for some constant k.","The newton is defined so that k = 1: 1 N is the net force that gives 1 kg an acceleration of 1 m/s². Therefore ΣF = m·a."],units:"Check every answer with units: [ΣF] = N = kg·m/s². Dividing N by kg gives m/s², an acceleration; dividing N by m/s² gives kg, a mass. If your units do not reduce to the quantity you want, a step is wrong. Grams must be converted to kilograms before using the law.",example:{problem:"A 1200 kg car is pushed by a driving force of 3600 N forward while friction and air resistance together exert 1200 N backward. Find its acceleration.",steps:["Choose forward as positive. Identify the forces along the motion: +3600 N (drive) and −1200 N (resistance).","Net force: ΣF = 3600 N + (−1200 N) = +2400 N.","Apply the second law: a = ΣF/m = 2400 N ÷ 1200 kg.","Units: N/kg = (kg·m/s²)/kg = m/s². ✓","a = +2.0 m/s², forward. Sense check: a real car speeding up gently has an acceleration of a few m/s². ✓"],answer:"a = 2.0 m/s² forward"},guided:[{id:"g1",kind:"num",q:"A net force of 45 N acts on a 9.0 kg box. What is its acceleration?",answer:5,unit:"m/s²",calc:"P.accel(45, 9)",hints:["Which form of the law gives acceleration directly?","a = ΣF/m. Put the numbers in with units."],solution:"a = ΣF/m = 45 N ÷ 9.0 kg = 5.0 m/s²."},{id:"g2",kind:"num",q:"A 0.40 kg soccer ball accelerates at 30 m/s² during a kick. What net force does the foot exert (assume it is the only significant force)?",answer:12,unit:"N",calc:"0.40 * 30",hints:["You want force, so multiply.","ΣF = m·a = 0.40 kg × 30 m/s²."],solution:"ΣF = m·a = 0.40 kg × 30 m/s² = 12 N."},{id:"g3",kind:"num",q:"Two people pull a 50 kg sled in the same direction with 120 N and 80 N, and snow friction is 50 N. Find the sled’s acceleration.",answer:3,unit:"m/s²",calc:"P.accel(120 + 80 - 50, 50)",hints:["Add the pulls with signs: friction opposes motion.","ΣF = 120 + 80 − 50 = 150 N. Now divide e at that moment?",solution:"(a) ΣFx = 10 cos30° = 8.66 N, so ax = 8.66/2.0 = 4.33 m/s². (b) ΣFy = 0: N + 10 sin30° − (2.0)(9.8) = 0 → N = 19.6 − 5.0 = 14.6 N. (c) Lift-off when N = 0: T sin30° = 19.6 N → T = 39.2 N; then ax = 39.2 cos30°/2.0 = 17.0 m/s².",calc:["10 * Math.cos(P.deg(30)) / 2","2 * 9.8 - 10 * Math.sin(P.deg(30))","2 * 9.8 / Math.sin(P.deg(30))"],answers:[4.33,14.6,39.2]},explainKeys:["net force (sum of all forces)","acceleration is proportional to net force","acceleration is inversely proportional to mass","acceleration has the same direction as the net force"],explainWords:[["net","sum","total","all forces"],["proportional","double","twice","more force"],["mass","heavier","inverse","less acceleration"],["direction","same way","points"]]}}};var rh={num:6,sections:{}};var ah={num:7,sections:{}};var oh={num:8,sections:{}};var ch={num:9,sections:{}};var lh={num:10,sections:{}};var hh={num:11,sections:{}};var uh={num:12,sections:{}};var dh={num:13,sections:{}};var ph={num:14,sections:{}};var fh={num:15,sections:{}};var mh={num:16,sections:{}};var yh={num:17,sections:{}};var gh={num:18,sections:{}};var _h={num:19,sections:{}};var wh={num:20,sections:{}};var fp=[eh,th,nh,ih,sh,rh,ah,oh,ch,lh,hh,uh,dh,ph,fh,mh,yh,gh,_h,wh],vh=[...new Set(ys.units.map(i=>i.part))],ki=ys.units.map(i=>{let e=fp[i.num-1]||{},t=ys.sections.filter(n=>n.unit===i.num).map(n=>{var s;return{...n,title:n.topic,content:((s=e.sections)==null?void 0:s[n.id])||null}});return{...i,lab:e.lab??null,bridges:e.bridges||[],blueprint:e.blueprint||[],sections:t}}),Yt=ki.flatMap(i=>i.sections),xh=i=>Yt.find(e=>e.id===i),js=i=>ki.find(e=>e.num===Number(i)),bh=i=>Yt.findIndex(e=>e.id===i),Ct=ys;var Ks=null;function Mh(i){Ks=i}function Pi(i){let e=dt().labs[i];return!!(e&&e.predicted!=null&&e.runs>0&&Object.keys(e.challenge||{}).length>0&&e.evaluated)}function Sh(i,e,t={}){var Q,se;let n=dt().settings,s=n.reducedMotion??matchMedia("(prefers-reduced-motion: reduce)").matches,{value:r}=Ot("lab."+e.num,
